<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>棋盘塔防 · 蓝方 vs 红方</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #0e140d; color: #e8f0e6;
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    user-select: none; touch-action: none;
  }
  #app { position: fixed; inset: 0; display: flex; flex-direction: column; }
  #topbar {
    display: flex; align-items: center; gap: 8px; padding: 5px 9px;
    background: linear-gradient(#1f2f24, #182419); border-bottom: 1px solid #33503e; font-size: 12px; flex: 0 0 auto;
  }
  #topbar .gold { color: #ffd479; font-weight: 700; }
  #topbar .rate { color: #9db89a; font-size: 11px; }
  #topbar .spacer { flex: 1; }
  #topbar button {
    background: #2e4433; color: #d8ecd6; border: 1px solid #44664b; border-radius: 6px;
    padding: 3px 8px; font-size: 11px; cursor: pointer;
  }
  #topbar button:hover { background: #3a553f; }
  #board-wrap { flex: 1 1 auto; position: relative; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  #panel {
    flex: 0 0 auto; background: linear-gradient(#1c2b20, #16221a); border-top: 1px solid #33503e;
    padding: 5px 7px calc(5px + env(safe-area-inset-bottom));
  }
  .rowlabel { font-size: 11px; color: #9db89a; margin: 1px 0 3px 2px; display: flex; align-items: center; }
  .rowlabel .sp { flex: 1; }
  .rowlabel label { cursor: pointer; }
  .cards { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 2px; }
  .tabs { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }
  .tabs .tab {
    background: #22362a; color: #a8c3a4; border: 1px solid #3c5c44; border-radius: 7px;
    padding: 5px 12px; font-size: 12px; font-weight: 700; cursor: pointer;
  }
  .tabs .tab.on { background: #3f7a3a; color: #fff; border-color: #5da04a; }
  .tabs .sp { flex: 1; }
  /* ==================== 放置面板折叠（用户需求：「放置界面下拉隐藏，棋盘更大」） ====================
   * 折叠 = #panel 只剩标签栏一行（约 34px），两个 pane 收成 0 高，棋盘按腾出的高度重铺满。
   * 为什么用 max-height 而不是 display：display 不可过渡。
   * 初值 460px 必须 ≥ 面板真实内容高度（3 行卡片 ≈324px + 三条行标 ≈54px ≈ 380px）：
   *   · 太小 → 展开态被裁掉底部卡片；
   *   · 太大 → 折叠动画前 80% 时间内容不动、最后一下突然收掉。
   * 460px 留了字体放大/窄屏的余量，且与 380px 相差不远，动画观感正常。
   * 收起时额外 visibility:hidden —— max-height:0 不会让卡片退出 Tab 焦点序列，visibility 会。
   * overflow:hidden 全程保留：展开途中内容若溢出会盖到棋盘上（180ms 内一闪），比裁掉一点光晕更丑。 */
  #paneBuild, #paneGlobal {
    max-height: 460px; opacity: 1; overflow: hidden;
    transition: max-height 180ms ease, opacity 160ms ease;
  }
  #panel.collapsed #paneBuild, #panel.collapsed #paneGlobal {
    max-height: 0; opacity: 0; visibility: hidden; pointer-events: none;
  }
  #panel.collapsed { padding: 2px 7px calc(2px + env(safe-area-inset-bottom)); }
  #panel.collapsed .tabs { margin-bottom: 0; }
  /* 折叠按钮：幽灵按钮语言（比 .tab 更淡、更小），不抢「开始游戏」主 CTA 的视觉权重 */
  .tabs .paneltoggle {
    display: inline-flex; align-items: center; gap: 3px; flex: 0 0 auto;
    background: #1f3125; color: #a8c3a4; border: 1px solid #44664b; border-radius: 7px;
    padding: 4px 8px; font-size: 11px; font-weight: 700; line-height: 1.3; cursor: pointer;
    transition: background 140ms ease, border-color 140ms ease, color 140ms ease;
  }
  .tabs .paneltoggle:hover { background: #2c4433; border-color: #5da04a; color: #d8ecd6; }
  .tabs .paneltoggle:focus-visible { outline: 2px solid #8fe06a; outline-offset: 1px; }
  .tabs .paneltoggle .pt-ico { font-size: 10px; line-height: 1; }
  .gcards .card { width: 84px; }
  /* 总体升级卡图标 46→58px（美术规范 A5-4）：卡宽 84px 而图标只有 46px → 左右各空 19px，
   * 「图标显小、四周空」是图标观感差的一半原因。58px 下 512 源图仍是 8.8× 缩小，够锐利。
   * 作用域限定 .gcards，不动放置栏（建筑 96px canvas / 兵种 46px img）的既有尺寸。
   * 投影不烘进贴图，用 drop-shadow 跟 alpha 剪影走；底光斑沿用 .card .ic 的现有 CSS 椭圆。
   * image-rendering 保持 auto —— 8~11× 缩小必须让浏览器做高质量插值，pixelated 会变马赛克。 */
  .gcards .card .ic { height: 58px; }
  .gcards .card .ic img.ci { width: 58px; height: 58px; filter: drop-shadow(0 2px 2px rgba(0,0,0,.45)); }
  .gcards .card .ic .gt { line-height: 56px; }
  .card .eff { font-size: 10px; color: #8fe0a0; }
  .card .lvtag { font-size: 9px; color: #9fd0ff; }
  .card {
    flex: 0 0 auto; width: 66px; border-radius: 9px; border: 1px solid #3c5c44;
    background: linear-gradient(#243829, #1b2b1f); padding: 3px 2px 4px; text-align: center; cursor: pointer; position: relative;
    overflow: hidden;
  }
  .card:hover { border-color: #5da04a; }
  .card.sel { border-color: #8fe06a; box-shadow: 0 0 0 1px #8fe06a inset, 0 0 8px rgba(143,224,106,.25); background: linear-gradient(#2c442f, #20362a); }
  .card.locked { opacity: .38; }
  /* 图标槽：椭圆草地光斑托住贴图，和棋盘风格一致 */
  .card .ic {
    height: 46px; display: flex; align-items: flex-end; justify-content: center; position: relative;
    background: radial-gradient(ellipse 22px 12px at 50% 78%, rgba(140,200,110,.20), rgba(0,0,0,0) 72%);
    border-radius: 7px; margin: 0 1px;
  }
  .card .ic canvas.ci, .card .ic img.ci { width: 46px; height: 46px; object-fit: contain; display: block; }
  .card .ic .gt { font-size: 21px; line-height: 44px; font-weight: 700; }
  /* img 图标（兵种/法术）就位时藏汉字；img 被移除（加载失败）后汉字自然露出。
   * 建筑卡是 canvas：画成功由 JS 直接把 .gt 藏掉。 */
  .card .ic img.ci ~ .gt { display: none; }
  .card .n { font-size: 10px; color: #c4d8c0; margin-top: 2px; white-space: nowrap; }
  .card .c { font-size: 10px; color: #ffd479; font-weight: 700; }
  .card .c::before {
    content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffe9a8, #e0a52c);
    margin-right: 2px; vertical-align: -0.5px;
  }
  .card .cd {
    position: absolute; left: 0; right: 0; bottom: 0; background: rgba(10,14,10,.78);
    font-size: 9px; color: #a8e0b0; padding: 1px 0;
  }
  .card .cdbar { position: absolute; left: 0; top: 0; bottom: 0; background: rgba(110,200,120,.16); }
  #hint {
    position: absolute; left: 50%; transform: translateX(-50%); bottom: 8px;
    background: rgba(16,22,14,.9); border: 1px solid #44664b; border-radius: 8px;
    padding: 4px 11px; font-size: 12px; color: #d8ecd6; pointer-events: none;
    max-width: 94%; text-align: center;
  }
  /* 建筑详情卡：贴在屏幕底部，往下挡住下面的卡片栏，而不是挡住棋盘 */
  #detail {
    position: fixed; left: 7px; right: 7px; bottom: 6px; display: none;
    background: rgba(24,34,25,.99); border: 1px solid #4a6b50; border-radius: 10px;
    padding: 7px 10px; font-size: 12px; box-shadow: 0 -6px 28px rgba(0,0,0,.65); z-index: 20;
    max-height: 38vh; overflow-y: auto;
  }
  #detail.show { display: block; }
  #detail .head { display: flex; align-items: center; gap: 7px; margin-bottom: 3px; }
  #detail .head .g { width: 22px; height: 22px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: 700; color: #fff; font-size: 13px; }
  #detail .head .nm { font-size: 13px; font-weight: 700; }
  #detail .head .lv { color: #ffd479; }
  #detail .head .x { margin-left: auto; cursor: pointer; color: #9db89a; padding: 2px 6px; }
  #detail .desc { color: #a8c3a4; margin-bottom: 4px; font-size: 11px; }
  #detail table { width: 100%; border-collapse: collapse; }
  #detail td { padding: 1px 0; vertical-align: top; font-size: 11px; }
  #detail td.k { color: #9db89a; width: 40%; }
  #detail td.v { color: #e0efe0; }
  #detail .up { color: #8fe0a0; }
  #detail .bar { height: 5px; background: #2e4433; border-radius: 3px; overflow: hidden; margin: 4px 0 5px; }
  #detail .bar i { display: block; height: 100%; background: #54d96b; }
  #detail .acts { display: flex; gap: 6px; margin-top: 5px; flex-wrap: wrap; }
  #detail button {
    flex: 1 1 40%; border: 0; border-radius: 7px; padding: 7px 4px; font-size: 12px; font-weight: 700;
    background: #3f7a3a; color: #fff; cursor: pointer;
  }
  #detail button:hover { background: #4c9046; }
  #detail button.alt { background: #6a4fb0; }
  #detail button.danger { background: #a33a3a; flex: 1 1 100%; }
  #detail button:disabled { background: #39445c; color: #8b97ad; cursor: not-allowed; }
  /* ======================================================================
   * 开始 / 结束界面 —— 林绿 palette（UX 规格 docs/ux/start-end-screens.md）
   * 双模态定位（规格 §2.1 / §8.3，T4-UX-REVISE-SHORTVIEW 用户拍板）：视口高 ≤900px
   * 切 fixed 全屏——1366×768 棋盘区仅 ~414px，容不下 ~725px 菜单内容触发滚动条，
   * 矮屏下「菜单嵌在棋盘区」必然溢出，用户拍板自动全屏接管；>900px 维持 absolute
   * 只遮棋盘区。z-index:30 压住 #detail(20)；规格其余视觉升级照做
   * ====================================================================== */
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  @keyframes ru-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }

  /* ---- 结束界面 #over（规格 §5.1–5.4） ---- */
  #over {
    position: absolute; inset: 0; z-index: 30;
    display: none; align-items: center; justify-content: center; padding: 24px;
    background: rgba(8,10,16,.82);
    -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
    overflow-y: auto;
  }
  #over.show { display: flex; }
  #over .card-r {
    width: 100%; max-width: 520px; text-align: center;
    background: linear-gradient(#1f2f24, #16221a);
    border: 1px solid var(--rc, #44664b); border-radius: 16px;
    padding: 22px 26px 20px;
    box-shadow: 0 18px 60px rgba(0,0,0,.55);
    animation: rise .45s .05s both cubic-bezier(.2,.7,.3,1);
  }
  #over.show .card-r.win  { --rc: #8fe06a; box-shadow: 0 18px 60px rgba(0,0,0,.55), 0 0 28px rgba(143,224,106,.16); }
  #over.show .card-r.lose { --rc: #ff8080; box-shadow: 0 18px 60px rgba(0,0,0,.55), 0 0 28px rgba(255,128,128,.12); }
  #over.show .card-r.draw { --rc: #44664b; }
  /* 结果剪影（规格 §5.3） */
  #over .figs { display: flex; align-items: flex-end; justify-content: center; gap: 12px; height: 52px; margin-bottom: 8px; }
  #over .figs .fg {
    width: 46px; height: 46px; display: flex; align-items: flex-end; justify-content: center;
    background: radial-gradient(ellipse 21px 11px at 50% 84%, rgba(140,200,110,.18), rgba(0,0,0,0) 72%);
    border-radius: 7px;
  }
  #over .figs .fg img { width: 42px; height: 42px; object-fit: contain; display: block; }
  #over .figs .fg .gt { font-size: 17px; font-weight: 800; line-height: 42px; color: #a8c3a4; }
  #over .figs .fg img ~ .gt { display: none; }
  #over .figs.win  .fg img { opacity: .9;  filter: drop-shadow(0 2px 6px rgba(255,128,128,.28)); }
  #over .figs.lose .fg img { opacity: .75; filter: grayscale(.2) brightness(.78); }
  #over .figs.draw .fg img { opacity: .85; }
  /* 标题 / 副标题 / 数据行（规格 §5.1） */
  #over .t { font-size: 30px; font-weight: 800; letter-spacing: .3em; text-indent: .3em; line-height: 1.15; }
  #over .t.win  { color: #8fe06a; text-shadow: 0 0 18px rgba(143,224,106,.25); }
  #over .t.lose { color: #ff8080; }
  #over .t.draw { color: #dfe9dc; }
  #over .sub  { font-size: 12px; color: #a8c3a4; margin-top: 7px; line-height: 1.65; }
  #over .meta { font-size: 11px; color: #9db89a; margin-top: 5px; }
  #over .meta b { color: #ffd479; font-weight: 700; }
  /* 战绩表（规格 §5.2） */
  #over .stats { margin: 14px 0 2px; border: 1px solid #3c5c44; border-radius: 10px; overflow: hidden;
    background: rgba(14,20,13,.5); }
  #over .stats table { width: 100%; border-collapse: collapse; font-size: 12px; }
  #over .stats th, #over .stats td { padding: 6px 12px; text-align: right; }
  #over .stats th:first-child, #over .stats td:first-child { text-align: left; color: #9db89a; width: 30%; }
  #over .stats thead th { background: rgba(31,47,36,.9); font-size: 11px; color: #c4d8c0;
    font-weight: 700; border-bottom: 1px solid #3c5c44; }
  #over .stats thead .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    margin-right: 5px; vertical-align: 0; }
  #over .stats thead .me .dot  { background: #8fe06a; }
  #over .stats thead .foe .dot { background: #ff8080; }
  #over .stats tbody tr:nth-child(even) { background: rgba(36,56,41,.28); }
  #over .stats td { color: #e0efe0; border-top: 1px solid rgba(60,92,68,.5); }
  #over .stats td.me { color: #eafce0; font-weight: 700; }
  #over .stats .dead { color: #9db89a; }
  #over .stats .bar { height: 4px; border-radius: 2px; background: #2e4433; margin-top: 3px; overflow: hidden; }
  #over .stats .bar i { display: block; height: 100%; background: #5da04a; }
  #over .stats .bar i.low { background: #e0a52c; }     /* HP < 35% 警示（既有深金） */
  #over .stats .note { font-size: 10px; color: #9db89a; padding: 5px 12px 7px; text-align: left; }
  /* 按钮区（规格 §5.4）：主操作唯一实心亮块，次操作幽灵按钮 */
  #over .acts { display: flex; gap: 10px; justify-content: center; margin-top: 16px; }
  #over .acts button {
    border-radius: 9px; padding: 10px 26px; cursor: pointer;
    font-size: 14px; font-weight: 700; letter-spacing: .1em;
    transition: filter .15s ease, transform .15s ease, background .15s ease;
  }
  #over .acts .p {
    border: 0; color: #fff; background: linear-gradient(180deg, #6fb855, #4d8b3c);
    box-shadow: 0 1px 0 rgba(255,255,255,.16) inset, 0 6px 16px rgba(77,139,60,.28);
  }
  #over .acts .p:hover { filter: brightness(1.08); transform: translateY(-1px); }
  #over .acts .g { background: transparent; color: #c4d8c0; border: 1px solid #44664b; }
  #over .acts .g:hover { background: rgba(68,102,75,.22); }
  #over .acts button:focus-visible { outline: 2px solid #8fe06a; outline-offset: 2px; }

  /* ================= 开始界面 #start（v16：海报 + 轻量文字） =================
   * 玩家要求：不要厚重绿色方框 / 不要密麻信息面板 / 文字轻量化；
   * 标题放大放上半区，难度与图鉴缩小弱化悬浮底部角落，构图重心留给建筑与兵种。
   * 所以这一版**没有卡片、没有分隔线、没有信息块**——
   * 只有一张海报底图 + 三组漂浮文字（标题 / 主按钮 / 两角小控件）。 */
  /* fixed 而不是 absolute：#panel 在 #app 之外，absolute 只覆盖 #app 的范围，
   * 桌面端窗口较高时底部会把放置面板露出来（v21 实测：开始界面下方露出一排卡片）。
   * fixed + inset:0 覆盖整个视口，同时 JS 还会把 #panel 直接置 hidden。 */
  #start {
    position: fixed; inset: 0; z-index: 30;
    display: block; overflow: hidden; background: #0a0f0a;
  }
  #start.hide { display: none; }
  /* 开始界面存在期间放置面板整个不参与布局（也不进 Tab 焦点序列） */
  #panel[hidden] { display: none !important; }

  /* 海报层：底图 + 三段柔和压暗（上给标题、下给按钮、四周暗角）。
   * 全是渐变、没有一条硬边 —— 「不要条框感」的关键就在这里。 */
  #start .poster {
    position: absolute; inset: 0;
    background-image: url("art/v9/start_poster.jpg");
    background-size: cover; background-position: center 46%;
    animation: poster-in .9s ease both;
  }
  @keyframes poster-in { from { opacity: 0; transform: scale(1.04); } to { opacity: 1; transform: scale(1); } }
  #start .poster::before {   /* 顶部压暗：托住标题 */
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg,
      rgba(6,11,7,.92) 0%, rgba(6,11,7,.66) 11%, rgba(6,11,7,.22) 25%, rgba(6,11,7,0) 40%);
  }
  #start .poster::after {    /* 底部压暗 + 暗角 */
    content: ''; position: absolute; inset: 0;
    background:
      linear-gradient(0deg, rgba(6,11,7,.88) 0%, rgba(6,11,7,.50) 12%, rgba(6,11,7,0) 30%),
      radial-gradient(120% 82% at 50% 46%, rgba(0,0,0,0) 54%, rgba(3,6,3,.55) 100%);
  }

  /* ① 标题区：上半区居中 */
  #start .mast {
    position: absolute; left: 0; right: 0; top: 7%;
    display: flex; flex-direction: column; align-items: center; text-align: center;
    pointer-events: none;
    animation: fade-down .7s .04s both cubic-bezier(.2,.7,.3,1);
  }
  @keyframes fade-down { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: none; } }
  #start .kicker {
    font-size: 11px; font-weight: 700; letter-spacing: .52em; text-indent: .52em;
    color: rgba(206,226,180,.70); text-shadow: 0 2px 12px rgba(0,0,0,.9);
  }
  #start .title {
    margin: 5px 0 0; font-size: clamp(46px, 7.2vw, 88px); font-weight: 800; line-height: 1.04;
    letter-spacing: .16em; text-indent: .16em; color: #eafccd;
    text-shadow: 0 2px 0 rgba(24,44,20,.5), 0 12px 38px rgba(0,0,0,.9), 0 0 52px rgba(143,224,106,.28);
  }
  #start .tag {
    margin-top: 9px; font-size: 12.5px; letter-spacing: .18em;
    color: rgba(214,232,196,.78); text-shadow: 0 2px 14px rgba(0,0,0,.9);
  }

  /* ② 底部中央：主按钮 + 一行极小的规则提示
   * v18：bottom 74 → 96px（玩家要求「开始对战略微上移」）。
   * 只抬这一块，标题区不动 —— 上移后按钮离底部两角的小控件也更远了。 */
  #start .dock {
    position: absolute; left: 0; right: 0; bottom: 96px;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    animation: fade-up .7s .14s both cubic-bezier(.2,.7,.3,1);
  }
  @keyframes fade-up { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  #start .cta {
    position: relative; overflow: hidden;
    border: 1px solid rgba(180,232,140,.55); border-radius: 999px;
    padding: 12px 44px; cursor: pointer; background: rgba(14,26,14,.40);
    font: inherit; font-size: 16px; font-weight: 800; letter-spacing: .28em; text-indent: .28em;
    color: #f2ffe0;
    box-shadow: 0 6px 30px rgba(0,0,0,.45), 0 0 26px -8px rgba(143,224,106,.5) inset;
    transition: background .18s ease, border-color .18s ease, transform .18s ease, box-shadow .18s ease;
  }
  @supports ((-webkit-backdrop-filter: blur(3px)) or (backdrop-filter: blur(3px))) {
    #start .cta { -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
  }
  #start .cta:hover {
    background: rgba(74,132,54,.42); border-color: rgba(190,240,150,.85); transform: translateY(-1px);
    box-shadow: 0 10px 34px rgba(0,0,0,.5), 0 0 30px -6px rgba(143,224,106,.65) inset;
  }
  #start .cta:active { transform: translateY(0); }
  #start .cta:focus-visible { outline: 2px solid #8fe06a; outline-offset: 4px; }
  #start .meta {
    font-size: 11px; letter-spacing: .12em; color: rgba(206,224,196,.62);
    text-shadow: 0 1px 10px rgba(0,0,0,.95);
  }

  /* ③ 底部两角：难度（左）/ 图鉴（右）
   * v18：玩家反馈「左下角右下角的部分略微显眼一点」——
   * 底色 .62 → .76、边框 .44 → .58、加一层很轻的外发光。
   * 只加"看得清"，不加"很重"：仍然是胶囊、仍然没有卡片底板。 */
  #start .corner {
    position: absolute; bottom: 16px; display: flex; align-items: center; gap: 10px;
    animation: fade-up .7s .24s both cubic-bezier(.2,.7,.3,1);
  }
  #start .corner-l { left: 22px; flex-direction: column; align-items: flex-start; gap: 5px; }
  #start .corner-r { right: 22px; }
  #start .pick-label {
    font-size: 9.5px; letter-spacing: .32em; text-indent: .32em;
    color: rgba(214,232,198,.78); text-shadow: 0 1px 8px rgba(0,0,0,.95);
  }
  #start .diffs { display: flex; gap: 6px; }
  /* 难度胶囊：只留名字。描述与角标在这版收起（信息密度是玩家明确要去掉的东西） */
  #start .diff {
    position: relative; font: inherit; cursor: pointer;
    padding: 5px 13px; border-radius: 999px;
    border: 1px solid rgba(178,214,164,.58); background: rgba(6,12,6,.76);
    color: rgba(232,246,222,.96); font-size: 11.5px; font-weight: 700; letter-spacing: .12em;
    text-shadow: 0 1px 6px rgba(0,0,0,.95);
    box-shadow: 0 4px 18px rgba(0,0,0,.5), 0 0 16px -10px rgba(143,224,106,.9);
    transition: color .16s ease, border-color .16s ease, background .16s ease, box-shadow .16s ease;
  }
  #start .diff .en, #start .diff .dd, #start .diff .tg { display: none; }
  #start .diff .dn { display: block; font-size: 11.5px; font-weight: 700; color: inherit; margin: 0; }
  #start .diff:hover { color: #e6f6d8; border-color: rgba(180,220,150,.6); background: rgba(20,34,18,.5); }
  #start .diff.on {
    color: #f7ffe8; border-color: var(--tier); background: rgba(24,44,22,.55);
    box-shadow: 0 0 0 1px var(--tier) inset, 0 0 18px -6px var(--tier);
  }
  #start .diff:focus-visible { outline: 2px solid #8fe06a; outline-offset: 2px; }
  #start .cur { font-size: 10px; letter-spacing: .1em; color: rgba(206,226,192,.70); text-shadow: 0 1px 8px rgba(0,0,0,.9); }
  #start .cur b { color: rgba(255,212,121,.88); font-weight: 700; }

  /* 图鉴入口：幽灵胶囊（v18：与难度胶囊同档的可见度） */
  #start .ghost {
    display: inline-flex; align-items: center; gap: 6px;
    font: inherit; font-size: 11.5px; font-weight: 700; letter-spacing: .12em;
    color: rgba(232,246,222,.96); background: rgba(6,12,6,.76);
    border: 1px solid rgba(178,214,164,.58); border-radius: 999px; padding: 6px 14px;
    cursor: pointer; text-shadow: 0 1px 6px rgba(0,0,0,.95);
    box-shadow: 0 4px 18px rgba(0,0,0,.5), 0 0 16px -10px rgba(143,224,106,.9);
    transition: color .16s ease, border-color .16s ease, background .16s ease;
  }
  #start .ghost:hover { color: #eafccd; border-color: rgba(180,220,150,.55); background: rgba(20,34,18,.5); }
  #start .ghost:focus-visible { outline: 2px solid #8fe06a; outline-offset: 2px; }
  #start .ghost svg { opacity: .85; flex: 0 0 auto; }

  /* ================= 双人对战：模式切换 + 房间面板（v20） ================= */
  #start .modes { display: flex; gap: 8px; justify-content: center; margin: 0 0 10px; }
  #start .mtab {
    font: inherit; font-size: 11.5px; font-weight: 700; letter-spacing: .12em;
    color: rgba(206,226,192,.72); background: rgba(6,12,6,.62);
    border: 1px solid rgba(178,214,164,.34); border-radius: 999px; padding: 6px 15px;
    cursor: pointer; text-shadow: 0 1px 6px rgba(0,0,0,.9);
    transition: color .16s ease, border-color .16s ease, background .16s ease;
  }
  #start .mtab:hover { color: #eafccd; border-color: rgba(180,220,150,.55); }
  #start .mtab.on {
    color: #0e1a0c; background: linear-gradient(180deg,#a8ea74,#79c94f);
    border-color: rgba(180,236,130,.9); box-shadow: 0 0 16px -6px rgba(143,224,106,.9);
  }
  #start .mtab:focus-visible { outline: 2px solid #8fe06a; outline-offset: 2px; }
  #start .pvpbox { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; align-items: center; }
  #start .pvpbox[hidden] { display: none; }
  #start .pvpbox .row { display: flex; gap: 8px; align-items: center; justify-content: center; }
  #start #roomcode {
    font: inherit; font-size: 13px; letter-spacing: .18em; text-align: center; text-transform: uppercase;
    color: #eafccd; background: rgba(6,12,6,.8); border: 1px solid rgba(178,214,164,.42);
    border-radius: 10px; padding: 8px 12px; width: 168px; outline: none;
  }
  #start #roomcode::placeholder { color: rgba(206,226,192,.45); letter-spacing: .08em; }
  #start #roomcode:focus { border-color: rgba(180,236,130,.8); box-shadow: 0 0 14px -6px rgba(143,224,106,.8); }
  #start .cta.small { padding: 9px 18px; font-size: 13px; min-width: 0; }
  #start .cta.ghost2 {
    background: rgba(6,12,6,.72); color: #eafccd;
    border: 1px solid rgba(178,214,164,.5); box-shadow: none;
  }
  #start .cta.ghost2:hover { background: rgba(20,34,18,.6); border-color: rgba(180,220,150,.7); }
  #start .pstatus { font-size: 11px; line-height: 1.4; color: #ffd479; min-height: 15px; text-align: center;
    text-shadow: 0 1px 8px rgba(0,0,0,.95); max-width: 300px; }
  #start .pstatus.err { color: #ff8a7a; }

  /* 可访问性：减少动态 */
  @media (prefers-reduced-motion: reduce) {
    #start *, #over *, #codex * { animation: none !important; transition: none !important; }
    /* 放置面板折叠也关掉过渡（高度瞬变，布局立刻到位） */
    #panel, #paneBuild, #paneGlobal, .tabs .paneltoggle { transition: none !important; }
  }
  /* 响应式三档（900 / 760 / 620）：900 双模态切 fixed；760 收紧；620 窄屏 */
  @media (max-height: 900px) {
    #start, #over { position: fixed; }
    #start .mast { top: 4.5%; }
    #start .title { font-size: clamp(40px, 6vw, 66px); }
    #start .dock { bottom: 88px; }
  }
  @media (max-height: 760px) {
    #start .mast { top: 3%; }
    #start .title { font-size: clamp(34px, 5.2vw, 52px); }
    #start .kicker { display: none; }
    #start .tag { display: none; }
    #start .dock { bottom: 74px; }
    #start .corner { bottom: 12px; }
  }
  @media (max-width: 620px) {
    /* 图鉴第二层：窄屏改成「大图在上、数值在下」的单列。
     * 这里的写法看着啰嗦（多挂一级 class、甚至带上元素名），是被优先级逼的：
     * 媒体查询并不比常规规则优先 —— 同特异性时照样看源码顺序，而图鉴的 CSS 写在后面，
     * 用 `#codex .cx-detail-grid` 会被后文那条 grid-template-columns 直接盖掉
     * （实测右栏被挤到 34px，文字竖着排成一列）。断点只能有这一个，不能另开。 */
    #codex div.cx-detail { max-width: none; }
    #codex .cx-detail .cx-detail-grid { grid-template-columns: 1fr; gap: 16px; }
    #codex .cx-detail .cx-hero { width: 100%; max-width: 300px; margin: 0 auto; }
    /* 左右翻页键占位的左右 padding 收窄，不然 390 屏上内容只剩一半宽度 */
    #codex .cx-dwrap .cx-dscroll { padding-left: 46px; padding-right: 46px; }
    /* 窄屏放不下「主图 + 两张完整残影」，残影收到一半宽度：
     * 完整露在两侧，只跟主图擦一点边，仍能看出「旁边还有东西」。 */
    #codex .cx-stage .cx-ghost { width: calc(var(--cxfig) * .5); opacity: .26; }
    #codex .cx-dwrap button.cx-nav { width: 34px; height: 62px; font-size: 22px; }
    #codex .cx-dwrap button.cx-nav.prev { left: 4px; }
    #codex .cx-dwrap button.cx-nav.next { right: 4px; }
    #codex .cx-detail .cx-downbtn { max-width: none; }

    /* 开始界面：两角收窄，按钮上移，避免挤在一起 */
    #start .corner-l { left: 12px; }
    #start .corner-r { right: 12px; }
    #start .diff { padding: 5px 10px; letter-spacing: .08em; }
    #start .dock { bottom: 104px; }
    #start .cta { padding: 11px 34px; font-size: 15px; }
    #start .meta { display: none; }
    /* 窄屏：折叠按钮只留箭头（省出 ~34px 给标签栏，避免 tabs 行横向溢出） */
    #paneltoggle .pt-txt { display: none; }
    #paneltoggle { padding: 4px 6px; }
  }

/* ============================ 单位图鉴 #codex（规格 docs/ux/codex.md） ============================ */
/* 复用开始界面林绿 palette 与 .ic / .g 视觉语言；本块仅新增 #codex 作用域布局规则，不新增色值 token。
 * 所有数值由 C.* API 实时算，图鉴内零硬编码数值（仅列标签与 秒/格/金/% 等展示后缀）。 */
#codex {
  /* 图鉴是 role=dialog 的全屏模态，必须盖住「棋盘 + 底部面板」整个视口。
   * 曾经是 absolute（= 只填满 #board-wrap），而 #panel 不被覆盖 → 视口下部会漏出开始界面；
   * 且「矮屏那条 position:fixed」因为同优先级、位置更靠前而被这条覆盖掉（等于从来没生效过），
   * 所以「矮屏才 fixed」其实从来没生效过。这里直接改成 fixed，两处一致。 */
  position: fixed; inset: 0; z-index: 30;
  display: none; flex-direction: column;
  /* 背景复用开始界面：页面底 + 顶部草绿辉光 */
  background:
    radial-gradient(1100px 460px at 50% -8%, rgba(93,160,74,.16), transparent 62%),
    #0e140d;
}
#codex:not([hidden]) { display: flex; }
#codex.show { display: flex; }

#codex .cx-bar {
  flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between;
  padding: 16px 20px 12px;
}
#codex .cx-title {
  font-size: 22px; font-weight: 800; letter-spacing: .14em; text-indent: .14em; color: #8fe06a;
  filter: drop-shadow(0 2px 10px rgba(143,224,106,.20));
}
#codex .cx-close {
  background: transparent; color: #c4d8c0; border: 1px solid #44664b;
  border-radius: 8px; width: 30px; height: 30px; cursor: pointer; font-size: 14px; line-height: 1;
  transition: background .15s ease;
}
#codex .cx-close:hover { background: rgba(68,102,75,.22); }
#codex .cx-close:focus-visible { outline: 2px solid #8fe06a; outline-offset: 2px; }

/* 三 Tab：复用 .slabel 装饰线语言（两侧渐隐线 + 标签感） */
#codex .cx-tabs {
  flex: 0 0 auto; display: flex; gap: 8px; justify-content: center;
  padding: 0 20px 10px; border-bottom: 1px solid rgba(60,92,68,.7);
}
#codex .cx-tab {
  font: inherit; color: #9db89a; background: transparent; border: 0; cursor: pointer;
  padding: 8px 18px; font-size: 13px; font-weight: 700; letter-spacing: .14em; text-indent: .14em;
  border-bottom: 2px solid transparent; margin-bottom: -1px;
  transition: color .15s ease, border-color .15s ease;
}
#codex .cx-tab:hover { color: #c4d8c0; }
#codex .cx-tab.on { color: #8fe06a; border-bottom-color: #8fe06a; }
#codex .cx-tab:focus-visible { outline: 2px solid #8fe06a; outline-offset: 2px; border-radius: 4px; }

/* 说明：v23 起图鉴是「翻页浏览 → 详情」两层，
 * 旧的单页卡片（.cx-card / .cx-entry / .cx-unit / .cx-stats / .cx-note）
 * 与旧容器（.cx-body / .cx-pane）已全部退役并删干净，
 * 这里只保留两层都会用到的「每级数值表」(.cx-tw/.cx-lv) 与「科技表」(.cx-gup/.cx-g)。 */

/* —— 每级数值表（详情页右侧复用） —— */
#codex .cx-tw { overflow-x: auto; margin-top: 10px; }
#codex table.cx-lv { border-collapse: collapse; width: 100%; font-size: 11px; min-width: 520px; }
#codex table.cx-lv th, #codex table.cx-lv td { border: 1px solid rgba(60,92,68,.6); padding: 4px 6px; text-align: center; }
#codex table.cx-lv thead th { background: rgba(31,47,36,.9); color: #c4d8c0; font-weight: 700; position: sticky; top: 0; }
#codex table.cx-lv thead th.lv5 { color: #ffd479; }
#codex table.cx-lv td.row { text-align: left; color: #9db89a; background: rgba(36,56,41,.4); white-space: nowrap; }
#codex table.cx-lv td .ba { font-weight: 700; }
#codex table.cx-lv td .bb { font-weight: 700; }
#codex table.cx-lv td .sep { color: #9db89a; margin: 0 3px; }
#codex table.cx-lv td.gold { color: #ffd479; font-weight: 700; }

#codex .cx-gup { margin-top:8px; overflow-x:auto; }
#codex table.cx-g { border-collapse:collapse; font-size:11px; min-width:480px; }
#codex table.cx-g th, #codex table.cx-g td { border:1px solid rgba(60,92,68,.6); padding:3px 6px; text-align:center; }
#codex table.cx-g thead th { background:rgba(31,47,36,.9); color:#c4d8c0; font-weight:700; }
#codex table.cx-g td.lv { color:#9db89a; text-align:left; }
#codex table.cx-g td.pct { color:#ffd479; font-weight:700; }

/* ==================== 第一层：翻页浏览（v22 重做） ====================
 * 从「网格列表」改成「一次只看一件，左右翻页」。理由是玩家的原话：
 * 列表一次铺 7~8 张，每张只有 56px 缩略图，根本看不清建筑长什么样 ——
 * 而这是个靠贴图认建筑的游戏，认不出图等于图鉴没用。
 * 现在主图给到 300px，两侧只留相邻项的一角残影做「旁边还有东西」的暗示。
 * ==================================================================== */
#codex .cx-browse { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }
#codex .cx-browse[hidden] { display: none; }

#codex .cx-stage {
  flex: 1 1 auto; position: relative; display: flex;
  align-items: center; justify-content: center;
  min-height: 0; padding: 4px clamp(28px, 7vw, 96px) 0;
  /* 左右两条渐隐遮罩：残影贴到边缘时自然淡出，不会硬切一刀。
   * 起始点从 9% 收到 4% —— 原来 1440 屏上要吃掉 130px，正好把整张残影的左半边抹平，
   * 那「给完整图」就白给了。现在只淡掉最外侧那一条。 */
  -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 4%, #000 96%, transparent 100%);
          mask-image: linear-gradient(90deg, transparent 0, #000 4%, #000 96%, transparent 100%);
}

/* —— 相邻项残影 ——
 * 给完整图：裁掉一半的图认不出是什么，「旁边还有一座塔」的暗示就只剩「旁边有块东西」。
 * 靠的是「淡 + 虚 + 不带字」拉开层级，而不是靠裁切 —— 完整但失焦，眼睛扫过去知道有货、不会去读。
 * 尺寸跟主图挂钩（.82 倍宽 + 同高），否则三者大小不一，读起来像三张不相干的图。 */
#codex .cx-ghost {
  position: absolute; top: 50%; width: calc(var(--cxfig) * .86); height: var(--cxfig);
  transform: translateY(-50%);
  opacity: .30; filter: blur(1.3px) saturate(.7);
  pointer-events: none; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  transition: opacity .25s ease;
}
/* 完整图不再往画外推，所以要自己跟屏幕边留点气口（贴着边会像被切掉的） */
#codex .cx-ghost.l { left: clamp(6px, 2.2vw, 44px); }
#codex .cx-ghost.r { right: clamp(6px, 2.2vw, 44px); }
#codex .cx-ghost .gf { position: relative; width: 100%; height: 100%; flex: 0 0 auto; }
#codex .cx-ghost img { position: absolute; display: block; object-fit: contain; }
#codex .cx-ghost img.b { left: 50%; bottom: 4%; width: 74%; height: 74%; transform: translateX(-50%); }
#codex .cx-ghost img.t { left: 50%; top: 50%; width: 84%; height: 84%; transform: translate(-50%, -50%); }
#codex .cx-ghost img.u { left: 50%; bottom: 6%; width: 80%; height: 80%; transform: translateX(-50%); }
/* img.s = 法术图。绝对不能漏：position:absolute 又没给宽高的话，
 * 浏览器会按图片原始尺寸撑开，超出 .gf 直接被裁光 —— 表现就是「残影不见了」。 */
#codex .cx-ghost img.s { left: 50%; top: 50%; width: 76%; height: 76%; transform: translate(-50%, -50%); }
#codex .cx-ghost .gt {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-size: 40px; font-weight: 800;
}
#codex .cx-ghost img ~ .gt { display: none; }

/* —— 主图 —— */
#codex .cx-focus {
  position: relative; z-index: 2; flex: 0 1 auto;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 10px 34px 6px; border-radius: 22px; cursor: pointer;
  transition: transform .18s ease, background .18s ease;
}
#codex .cx-focus:hover { transform: translateY(-4px); }
#codex .cx-focus:focus-visible { outline: 2px solid #8fe06a; outline-offset: 4px; }

/* —— 主图尺寸 ——
 * 抽成变量是因为「残影」必须跟主图同比例缩放：残影一旦比主图小太多，
 * 读起来就是「三张大小不一的图」，而不是「同一排里被切掉两头的相邻项」。
 * 38vh 在 900 高屏上约 342px —— 图鉴这一层唯一的任务就是认图，图必须够大。 */
/* 52vw 这一档只在 769px 以下生效（769 × 52% ≈ 400，正好等于上限）。
 * 之前是 64vw，窄屏上主图把两侧挤得一点不剩，残影只能压在主图身上 —— 三张完整图摆不开。 */
#codex { --cxfig: min(clamp(180px, 44vh, 400px), 52vw); }

#codex .cx-fig {
  position: relative;
  width: var(--cxfig); height: var(--cxfig);
  overflow: hidden;
  /* 不画边框、不铺实色底。之前那圈 1px 描边 + 圆角矩形底色会读成「一张卡片」，
   * 和「看这个大图」的意图正好相反；去掉之后图直接浮在遮罩上，
   * 只靠下面两圈无硬边的径向柔光把暗色石塔从深背景里托出来。 */
  background:
    radial-gradient(ellipse 58% 44% at 50% 62%, rgba(158,212,126,.16), transparent 76%),
    radial-gradient(ellipse 62% 28% at 50% 94%, rgba(140,200,110,.22), transparent 72%);
  transition: filter .2s ease;
}
#codex .cx-focus:hover .cx-fig { filter: brightness(1.07); }
#codex .cx-fig::before {   /* 落地阴影，让大图站在地上而不是浮着 */
  content: ''; position: absolute; left: 50%; bottom: 5%; width: 60%; height: 11%;
  transform: translateX(-50%); border-radius: 50%; pointer-events: none;
  background: radial-gradient(ellipse, rgba(0,0,0,.5), transparent 72%);
  filter: blur(3px);
}
#codex .cx-fig img { position: absolute; display: block; object-fit: contain; }
#codex .cx-fig img.b { left: 50%; bottom: 3%; width: 78%; height: 78%; transform: translateX(-50%); }
#codex .cx-fig img.t { left: 50%; top: 52%; width: 90%; height: 90%; transform: translate(-50%, -50%); }
#codex .cx-fig img.u { left: 50%; bottom: 4%; width: 84%; height: 84%; transform: translateX(-50%); }
#codex .cx-fig img.s {   /* 法术图标：不吃满整格，留出光晕呼吸的空间 */
  left: 50%; top: 50%; width: 72%; height: 72%; transform: translate(-50%, -50%);
  filter: drop-shadow(0 0 18px currentColor);
}
#codex .cx-fig .gt {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-size: 48px; font-weight: 800;
}
#codex .cx-fig img ~ .gt { display: none; }

#codex .cx-fname {
  margin-top: 14px; font-size: 19px; font-weight: 800; color: #e8f0e6; letter-spacing: .06em;
}
#codex .cx-fsub { margin-top: 3px; font-size: 11px; color: #9db89a; letter-spacing: .05em; }

/* 翻页动画：新的一张从移动方向那侧滑进来，配合残影淡出，看起来像「滚动了一格」 */
@keyframes cx-roll-next { from { opacity: 0; transform: translateX(42%) scale(.9); } to { opacity: 1; transform: none; } }
@keyframes cx-roll-prev { from { opacity: 0; transform: translateX(-42%) scale(.9); } to { opacity: 1; transform: none; } }
#codex .cx-focus.roll-next { animation: cx-roll-next .28s cubic-bezier(.22,.8,.3,1) both; }
#codex .cx-focus.roll-prev { animation: cx-roll-prev .28s cubic-bezier(.22,.8,.3,1) both; }

/* —— 左右翻页键 ——
 * 平常半透明浮着（.55），鼠标进舞台或悬停本身才变实：要看得见「这里能点」，
 * 但不能实到和主图抢注意力 —— 所以用「有没有底色」而不是「有没有箭头」来区分。
 * 键盘 / 触屏也都能用（按钮本身可聚焦，方向键另做绑定）。 */
#codex .cx-nav {
  position: absolute; top: 50%; z-index: 3; transform: translateY(-50%);
  width: 48px; height: 80px; padding: 0; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 30px; line-height: 1; font-weight: 700; color: #c4d8c0;
  background: linear-gradient(rgba(31,47,36,.55), rgba(20,30,22,.55));
  border: 1px solid rgba(68,102,75,.55); border-radius: 14px;
  opacity: .55; transition: opacity .18s ease, background .18s ease, transform .18s ease;
}
#codex .cx-nav.prev { left: 18px; }
#codex .cx-nav.next { right: 18px; }
#codex .cx-stage:hover .cx-nav, #codex .cx-dwrap:hover .cx-nav,
#codex .cx-nav:hover, #codex .cx-nav:focus-visible { opacity: 1; }
#codex .cx-nav:hover { background: rgba(68,102,75,.42); color: #8fe06a; }
#codex .cx-nav:active { transform: translateY(-50%) scale(.95); }
#codex .cx-nav:focus-visible { outline: 2px solid #8fe06a; outline-offset: 2px; }
#codex .cx-nav[disabled] { opacity: .12; cursor: default; }

#codex .cx-tip {
  flex: 0 0 auto; text-align: center; font-size: 11px; color: #8ba488;
  letter-spacing: .08em; padding: 6px 0 14px;
}

/* ==================== 第二层：详情（v22 沿用旧布局 + 新增对比区） ==================== */
/* 左大图 / 右数值；下方一条「下」键把各等级对照表折进来。 */

/* —— 第二层：详情（左大图 / 右数值） —— */
/* 第二层内容限宽：这一层的信息量是「一张图 + 一张小表」，
 * 让它撑满 1440 的话右半边会空掉一大片，读起来像没做完。
 * 1020px 刚好是「左图 300 + 间距 + 右栏 680」的自然宽度。 */
/* 注意 width:100% 不能省：在 flex 容器里 margin:auto 会让元素按内容宽度收缩
 * （实测右栏被挤到 340px，数值小卡被迫换行）。 */
#codex .cx-detail { animation: cx-in .22s ease both; width: 100%; max-width: 1020px; margin: 0 auto; }
@keyframes cx-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* 第二层容器：独立的滚动区 + 固定的左右切换键。
 * 注意这里**没有** .cx-ghost —— 玩家在这一层是来横向比较数值的，
 * 两侧再放残影会把视线从数字上拽走，这是第一层和第二层刻意的差别。 */
#codex .cx-dwrap {
  flex: 1 1 auto; min-height: 0; position: relative;
  display: flex; flex-direction: column;
}
#codex .cx-dwrap[hidden] { display: none; }
/* 第二层的翻页键跟着内容走（宽屏时贴到 1020 内容区外侧），
 * 否则 1440 屏上箭头会孤零零地挂在屏幕最边上、离内容 200px 远。 */
#codex .cx-dwrap .cx-nav { top: 42%; }
#codex .cx-dwrap .cx-nav.prev { left: max(14px, calc(50% - 600px)); }
#codex .cx-dwrap .cx-nav.next { right: max(14px, calc(50% - 600px)); }
/* 内容不超高时垂直居中：第二层信息量本来就少（一张图 + 一张小表），
 * 顶对齐会让下半屏空掉一大片。用 safe center —— 内容一旦超高就退回顶部对齐，
 * 不会像普通的 center 那样把顶部「← 返回」裁到滚动区外面去。 */
#codex .cx-dscroll {
  flex: 1 1 auto; min-height: 0; overflow-y: auto;
  display: flex; flex-direction: column; justify-content: safe center;
  padding: 2px 74px 10px;
}
#codex .cx-dtop { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
#codex .cx-didx { font-size: 11px; color: #8ba488; letter-spacing: .1em; }

/* 「下」键：把各等级对照表折进来 / 收回去 */
#codex .cx-downbtn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; max-width: 320px; margin: 16px auto 10px;
  font: inherit; font-size: 12px; font-weight: 700; color: #c4d8c0; letter-spacing: .1em;
  background: rgba(31,47,36,.62); border: 1px solid #44664b; border-radius: 10px;
  padding: 9px 16px; cursor: pointer;
  transition: background .15s ease, color .15s ease, border-color .15s ease;
}
#codex .cx-downbtn:hover { background: rgba(68,102,75,.35); color: #8fe06a; border-color: #5da04a; }
#codex .cx-downbtn:focus-visible { outline: 2px solid #8fe06a; outline-offset: 2px; }
#codex .cx-downbtn .ar { font-size: 13px; transition: transform .22s ease; }
#codex .cx-downbtn.open .ar { transform: rotate(180deg); }
#codex .cx-cmp { margin: 2px 0 20px; animation: cx-in .2s ease both; }
#codex .cx-cmp[hidden] { display: none; }
#codex .cx-cmp .cmptitle { font-size: 12px; color: #9db89a; margin: 0 0 7px; letter-spacing: .08em; }
#codex .cx-back {
  font: inherit; font-size: 12px; font-weight: 700; color: #c4d8c0;
  background: transparent; border: 1px solid #44664b; border-radius: 8px;
  padding: 6px 13px; margin-bottom: 12px; cursor: pointer; transition: background .15s ease;
}
#codex .cx-back:hover { background: rgba(68,102,75,.22); }
#codex .cx-back:focus-visible { outline: 2px solid #8fe06a; outline-offset: 2px; }
#codex .cx-detail-grid {
  display: grid; grid-template-columns: minmax(220px, 308px) minmax(0, 1fr);
  gap: 22px; align-items: start;
}
#codex .cx-hero { min-width: 0; }
#codex .cx-hero-stage {
  position: relative; width: 100%; aspect-ratio: 1 / 1; min-height: 200px;
  overflow: hidden;
  /* 同样不画框：边框 + 圆角 + 实色底会把它读成一张卡片，和第一层保持一致 */
  background:
    /* 中段一圈暖绿反光：暗色石塔/铁塔压在纯深色上会糊成一团，垫一层才看得出轮廓 */
    radial-gradient(ellipse 58% 44% at 50% 58%, rgba(158,212,126,.20), transparent 76%),
    radial-gradient(ellipse 62% 30% at 50% 92%, rgba(140,200,110,.26), transparent 72%);
}
#codex .cx-hero-stage::before {   /* 落地阴影，让大图「站在地上」而不是浮着 */
  content: ''; position: absolute; left: 50%; bottom: 5%; width: 60%; height: 11%;
  transform: translateX(-50%); border-radius: 50%; pointer-events: none;
  background: radial-gradient(ellipse, rgba(0,0,0,.55), transparent 72%);
  filter: blur(3px);
}
#codex .cx-hero-stage img { position: absolute; display: block; object-fit: contain; }
#codex .cx-hero-stage img.b { left: 50%; bottom: 3%; width: 78%; height: 78%; transform: translateX(-50%); }
#codex .cx-hero-stage img.t { left: 50%; top: 52%; width: 90%; height: 90%; transform: translate(-50%, -50%); }
#codex .cx-hero-stage img.u { left: 50%; bottom: 4%; width: 84%; height: 84%; transform: translateX(-50%); }
/* 法术图（同 .cx-ghost，漏了就没有尺寸可依，图会被裁没） */
#codex .cx-hero-stage img.s {
  left: 50%; top: 50%; width: 72%; height: 72%; transform: translate(-50%, -50%);
  filter: drop-shadow(0 0 22px currentColor);
}
#codex .cx-hero-stage .gt {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-size: 54px; font-weight: 800;
}
#codex .cx-hero-stage img ~ .gt { display: none; }
/* 原来这里有一层「顶部冷光」（::after，inset:0 的径向渐变）用来把大图从深背景里托起来。
 * 现在卡片底和边框都撤了，它反而成了唯一的矩形边界：渐变中心在 14% 高度、垂直半径 30%，
 * 到容器顶边时 alpha 还没衰减完，于是顶端挂出一条淡淡的亮边 —— 看着就是个没画边框的框。
 * 托底交给下面那两圈暖绿柔光就够了，这层直接去掉。 */

/* 等级滑动轨 */
#codex .cx-lvbar { margin-top: 12px; }
#codex .cx-lvhead { display: flex; align-items: baseline; justify-content: space-between; font-size: 11px; color: #9db89a; }
#codex .cx-lvhead b { font-size: 14px; color: #8fe06a; letter-spacing: .06em; }
#codex .cx-range {
  -webkit-appearance: none; appearance: none; width: 100%; height: 24px; margin: 3px 0 0;
  background: transparent; cursor: pointer;
}
#codex .cx-range:focus-visible { outline: 2px solid #8fe06a; outline-offset: 3px; border-radius: 6px; }
#codex .cx-range::-webkit-slider-runnable-track {
  height: 8px; border-radius: 4px; border: 1px solid rgba(60,92,68,.9);
  background: linear-gradient(90deg, #2c4433, #4d8b3c 62%, #8fe06a);
}
#codex .cx-range::-webkit-slider-thumb {
  -webkit-appearance: none; width: 18px; height: 18px; margin-top: -6px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #eafccd, #6fb855 70%, #4d8b3c);
  border: 1px solid #16221a; box-shadow: 0 0 10px rgba(143,224,106,.65);
}
#codex .cx-range::-moz-range-track {
  height: 8px; border-radius: 4px; border: 1px solid rgba(60,92,68,.9);
  background: linear-gradient(90deg, #2c4433, #4d8b3c 62%, #8fe06a);
}
#codex .cx-range::-moz-range-thumb {
  width: 16px; height: 16px; border-radius: 50%; border: 1px solid #16221a;
  background: radial-gradient(circle at 35% 30%, #eafccd, #6fb855 70%);
  box-shadow: 0 0 10px rgba(143,224,106,.65);
}
#codex .cx-ticks { display: flex; justify-content: space-between; padding: 0 2px; font-size: 10px; color: #7d9679; }
#codex .cx-ticks .tk.on { color: #8fe06a; font-weight: 800; text-shadow: 0 0 8px rgba(143,224,106,.5); }

/* 分支切换（L5 起出现） */
#codex .cx-branchpick { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 10px; }
#codex .cx-branchpick[hidden] { display: none; }
#codex .cx-branchpick .bplabel { font-size: 10px; color: #9db89a; letter-spacing: .1em; }
#codex .cx-bp {
  font: inherit; font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 8px; cursor: pointer;
  border: 1px solid rgba(120,150,120,.55); background: rgba(14,20,13,.55);
  transition: box-shadow .15s ease, background .15s ease;
}
#codex .cx-bp.on { background: rgba(255,255,255,.06); box-shadow: 0 0 0 1px currentColor inset, 0 0 14px -4px currentColor; }

/* 右侧数值 */
#codex .cx-facts { min-width: 0; }
#codex .cxd-name { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; font-size: 20px; font-weight: 800; color: #e8f0e6; }
#codex .cxd-name .tag2 {
  font-size: 11px; font-weight: 700; color: #9db89a; letter-spacing: .06em;
  border: 1px solid rgba(60,92,68,.9); border-radius: 6px; padding: 1px 6px;
}
#codex .cxd-desc { font-size: 12px; color: #a8c3a4; line-height: 1.65; margin: 7px 0 10px; }
#codex .cxd-sub { font-size: 11px; color: #9db89a; margin: 12px 0 6px; }
#codex .cx-kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(142px, 1fr)); gap: 6px; }
#codex .cx-kv .kv {
  display: flex; align-items: baseline; justify-content: space-between; gap: 6px;
  background: rgba(14,20,13,.42); border: 1px solid rgba(60,92,68,.55);
  border-radius: 8px; padding: 6px 9px; font-size: 12px;
}
#codex .cx-kv .kv .k { color: #9db89a; white-space: nowrap; }
#codex .cx-kv .kv .v { color: #e8f0e6; font-weight: 800; white-space: nowrap; }
#codex .cx-kv .kv .v.gold { color: #ffd479; }
#codex .cx-kv .kv .v .nx { color: #8fe06a; font-weight: 700; font-size: 11px; margin-left: 4px; }
#codex .cx-kv .kv.wide { grid-column: 1 / -1; }
#codex .cxd-branches { display: flex; flex-direction: column; gap: 3px; margin-top: 10px; font-size: 11px; }
#codex .cxd-branches .bx { color: #a8c3a4; }
#codex .cxd-branches .bx.on { font-weight: 700; }

/* 入口幽灵按钮：复用 #over .acts .g 幽灵语言（在 #start .codex-open 下镜像，不新增 token） */
#start .g.codex-open {
  margin-top: 10px;
  background: transparent; color: #c4d8c0; border: 1px solid #44664b;
  border-radius: 9px; padding: 8px 22px; cursor: pointer;
  font-size: 13px; font-weight: 700; letter-spacing: .12em; text-indent: .12em;
  transition: background .15s ease, filter .15s ease;
}
#start .g.codex-open .ci-book { vertical-align: -2px; margin-right: 6px; opacity: .9; }
#start .g.codex-open:hover { background: rgba(68,102,75,.22); }
#start .g.codex-open:active { filter: brightness(.96); }
#start .g.codex-open:focus-visible { outline: 2px solid #8fe06a; outline-offset: 2px; }
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <span>金币 <span class="gold" id="gold">0</span></span>
    <span class="rate" id="rate">+0/s</span>
    <span class="spacer"></span>
    <span class="rate" id="enemyinfo">红方大本营 —</span>
    <button id="btnpath">路线</button>
    <button id="btnrestart">重开</button>
  </div>
  <div id="board-wrap">
    <canvas id="cv"></canvas>
    <div id="hint">点卡片选建筑/兵种/法术，再点棋盘</div>
    <div id="detail"></div>
    <div id="over">
      <div class="card-r" id="overcard">
        <div class="figs" id="overfigs"></div>
        <div class="t" id="overtext"></div>
        <div class="sub" id="oversub"></div>
        <div class="meta" id="overmeta"></div>
        <div class="stats" id="overstats"></div>
        <div class="acts">
          <button class="p" id="again">再来一局</button>
          <button class="g" id="tomenu">返回主菜单</button>
        </div>
      </div>
    </div>
    <div id="start">
      <!-- 海报层：一张主视觉 + 两段柔和压暗（没有卡片、没有分隔线） -->
      <div class="poster" aria-hidden="true"></div>

      <!-- 上半区：标题 -->
      <div class="mast">
        <div class="kicker">BOARD TOWER DEFENSE</div>
        <h1 class="title">棋盘塔防</h1>
        <div class="tag">10 × 10 棋盘 · 蓝方（你）对阵红方 AI</div>
      </div>

      <!-- 底部中央：模式切换 + 主按钮 + 房间面板 + 一行极小的规则提示 -->
      <div class="dock">
        <div class="modes" id="modes" role="tablist" aria-label="选择游戏模式">
          <button class="mtab on" id="modeai" role="tab" aria-selected="true">单机挑战</button>
          <button class="mtab" id="modepvp" role="tab" aria-selected="false">双人对战</button>
        </div>
        <button class="cta" id="startbtn">开始对战</button>
        <div class="pvpbox" id="pvpbox" hidden>
          <div class="row">
            <input id="roomcode" maxlength="6" placeholder="房间号（4-6 位）" autocomplete="off" spellcheck="false" />
          </div>
          <div class="row">
            <button class="cta small" id="pvpcreate">创建房间</button>
            <button class="cta small ghost2" id="pvpjoin">加入房间</button>
          </div>
          <div class="pstatus" id="pvpstatus"></div>
        </div>
        <div class="meta">先摧毁对方大本营 · 没有决胜时刻，打到分出胜负为止</div>
      </div>

      <!-- 底部两角：难度（左）/ 图鉴（右），都是半透明小胶囊 -->
      <div class="corner corner-l" id="cornerl">
        <div class="pick-label">难度</div>
        <div class="diffs" id="diffs" role="radiogroup" aria-label="选择难度"></div>
        <div class="cur">当前 <b id="diffhint">普通</b></div>
      </div>
      <div class="corner corner-r">
        <button type="button" class="ghost" id="codexopen"
                aria-haspopup="dialog" aria-controls="codex">
          <svg class="ci-book" viewBox="0 0 24 24" width="13" height="13" aria-hidden="true">
            <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v16H6.5A2.5 2.5 0 0 0 4 21.5V5.5Z"
                  fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
            <path d="M19 19v2H6.5A2.5 2.5 0 0 1 4 18.5" fill="none" stroke="currentColor"
                  stroke-width="1.6" stroke-linejoin="round"/>
            <path d="M8 8h7M8 11.5h5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>图鉴
        </button>
      </div>
    </div>
    <div id="codex" role="dialog" aria-modal="true" aria-label="单位图鉴" hidden>
      <div class="cx-bar">
        <div class="cx-title">图鉴</div>
        <button type="button" class="g cx-close" id="codexclose" aria-label="关闭图鉴">✕</button>
      </div>

      <!-- 第一层：一次只看一件，左右翻页 -->
      <div class="cx-browse" id="cxbrowse">
        <div class="cx-tabs" role="tablist" aria-label="图鉴分类">
          <button type="button" class="cx-tab on" role="tab" aria-selected="true"  data-cat="bld"   tabindex="0">建筑</button>
          <button type="button" class="cx-tab"    role="tab" aria-selected="false" data-cat="unit"  tabindex="-1">兵种</button>
          <button type="button" class="cx-tab"    role="tab" aria-selected="false" data-cat="spell" tabindex="-1">法术</button>
        </div>
        <div class="cx-stage" id="cxstage">
          <button type="button" class="cx-nav prev" id="cxprev" aria-label="上一件">‹</button>
          <div class="cx-ghost l" id="cxghostl" aria-hidden="true"></div>
          <div class="cx-focus" id="cxfocus" role="button" tabindex="0" aria-label="查看当前条目详情"></div>
          <div class="cx-ghost r" id="cxghostr" aria-hidden="true"></div>
          <button type="button" class="cx-nav next" id="cxnext" aria-label="下一件">›</button>
        </div>
        <div class="cx-tip">点大图看详情　·　两侧可翻页　·　方向键也能换</div>
      </div>

      <!-- 第二层：详情（左大图 + 右数值 + 下方对比，刻意不放左右残影） -->
      <div class="cx-dwrap" id="cxdetail" hidden>
        <button type="button" class="cx-nav prev" id="cxdprev" aria-label="上一件">‹</button>
        <button type="button" class="cx-nav next" id="cxdnext" aria-label="下一件">›</button>
        <div class="cx-dscroll" id="cxdscroll"></div>
      </div>
    </div>
  </div>
  <div id="panel" hidden>
    <div class="tabs">
      <button class="tab on" id="tabBuild">建筑 / 派兵 / 法术</button>
      <button class="tab" id="tabGlobal">总体升级</button>
      <span class="sp"></span>
      <label style="margin-left:6px"><input type="checkbox" id="autodeploy"> 自动派兵</label>
      <!-- 折叠按钮：收起到只剩这一行标签栏，把下半屏让给棋盘（用户需求） -->
      <button type="button" class="paneltoggle" id="paneltoggle"
              aria-expanded="true" aria-controls="paneBuild paneGlobal"
              aria-label="收起放置面板，让棋盘更大" title="收起 / 展开放置面板">
        <span class="pt-ico" id="ptico" aria-hidden="true">▾</span><span class="pt-txt" id="pttxt">收起</span>
      </button>
    </div>
    <div id="paneBuild">
      <div class="rowlabel">建筑（自己半场行6~10；点已有建筑可升级 / 选分支 / 拆除）</div>
      <div class="cards" id="bcards"></div>
      <div class="rowlabel" style="margin-top:4px">派兵（时间冷却制 · 点行B 派出去）</div>
      <div class="cards" id="ucards"></div>
      <div class="rowlabel" style="margin-top:4px">法术（随大本营等级解锁 · 选中后点棋盘落点）</div>
      <div class="cards" id="scards"></div>
    </div>
    <div id="paneGlobal" style="display:none">
      <div class="rowlabel">
        总体升级（全局科技 · 只影响己方 · 建筑每级 +10%/20%，士兵每级 +15%/30%）
      </div>
      <div class="cards gcards" id="gcards"></div>
    </div>
  </div>
</div>
<!-- 海报是开始界面的第一屏内容，提前拉取，避免「先黑一下再出图」 -->
<link rel="preload" as="image" href="art/v9/start_poster.jpg">
<script src="src/logic.js"></script>
<script src="src/net.js"></script>
<script src="src/view.js"></script>
<script src="art/v9/assets.js"></script>
<script>
(function () {
  'use strict';
  var C = window.GameCore;
  var canvas = document.getElementById('cv');
  var ctx = canvas.getContext('2d');
  var goldEl = document.getElementById('gold');
  var rateEl = document.getElementById('rate');
  var enemyEl = document.getElementById('enemyinfo');
  var hintEl = document.getElementById('hint');
  var overEl = document.getElementById('over');
  var overText = document.getElementById('overtext');
  var overSub = document.getElementById('oversub');
  var overStats = document.getElementById('overstats');
  var overCard = document.getElementById('overcard');
  var overMeta = document.getElementById('overmeta');
  var startEl = document.getElementById('start');
  /* 开始界面与放置面板互斥显示。
   * 只靠 CSS 不够：#start 虽然改成了 fixed 全屏，视觉上盖住了 #panel，
   * 但 #panel 里的卡片按钮仍在 Tab 焦点序列里，键盘操作会跑到看不见的按钮上。
   * 所以统一走这个开关，顺带处理「菜单期间 #panel 不参与 flex 布局」。 */
  function setStartVisible(v) {
    var p = document.getElementById('panel');
    if (!startEl) startEl = document.getElementById('start');
    if (!startEl) return;
    if (v) { startEl.classList.remove('hide'); if (p) p.hidden = true; }
    else { startEl.classList.add('hide'); if (p) p.hidden = false; }
  }
  var diffsEl = document.getElementById('diffs');
  var difficulty = 'normal';   // 默认普通
  var startedAt = -1;
  var visLast = {};   // 单位 id → 上一帧画到的位置（用于限速抹平转向跳变）

  /* ==========================================================================
   * 视角镜像（v21）—— 双方都「自己是蓝方，在下方」
   * --------------------------------------------------------------------------
   * 逻辑层一个字都不改：蓝方大本营恒在行 9–10、出兵通道恒在行 11；
   * 红方大本营恒在行 1–2、出兵通道恒在行 0（见 logic.js BASE_RECT / CHANNEL_ROW）。
   *
   * 红方玩家用 180° 旋转把整盘倒过来看：
   *     viewRow = ROWS+1-row ，viewCol = COLS+1-col
   *   → 红方大本营（行1–2）落到屏幕下方，红方通道（行0）落到最底下
   *   → 红兵逻辑上「行号增大」= 屏幕上「往上推」，和蓝方的操作手感完全一致
   *
   * 再把「谁的兵」这套视觉语义统一成「我是蓝、对面是红」（vTeam），
   * 于是两端看到的画面语义相同：**下方是我（蓝）、上方是对手（红）**。
   * 好处是 PvP 里谁都不用重新学一套方位，截图给别人看也不会"左右颠倒"。
   *
   * 落地要求：格子坐标**只能**从 cellRect / cellRectF / pointToCell 三个口子进出，
   * 改这三处即全局生效（渲染 27 处调用 + 交互 2 处调用都已归口）。
   * ====================================================================== */
  var FLIP = false;                                   // true = 红方视角（180° 旋转）
  /* 纯数学在 src/view.js（可单测）；这里只保留「读 FLIP / 读 ME」的薄封装。
   * 万一 view.js 没加载上（老缓存），退化成同样的内联实现 —— 不至于白屏。 */
  var View = (typeof window !== 'undefined' && window.GameView) ? window.GameView : {
    flipRow: function (r, f) { return f ? (C.ROWS + 1 - r) : r; },
    flipCol: function (c, f) { return f ? (C.COLS + 1 - c) : c; },
    facing: function (f2, f) { return f ? ({ up: 'down', down: 'up', left: 'right', right: 'left' }[f2] || f2) : f2; },
    vTeam: function (t, me) { return (t === me) ? 'blue' : 'red'; }
  };
  function vRow(r) { return View.flipRow(r, FLIP); }
  function vCol(c) { return View.flipCol(c, FLIP); }
  /* 「我是蓝方、对面是红方」：贴图阵营 / 阵营装饰件 / 文案都走这一个判定 */
  function vTeam(t) { return View.vTeam(t, ME); }
  /* 逻辑朝向 → 屏幕朝向：180° 旋转 = 上下互换 + 左右互换。
   * lastFacing 缓存的是**逻辑朝向**，这里只在取值时映射，所以切视角不需要清缓存。 */
  function vFacing(f) { return View.facing(f, FLIP); }
  /* 切视角：背景板里的阵营色调（L7）与通道标签跟视角绑定，必须作废重画 */
  function setFlip(on) {
    var v = !!on;
    if (v === FLIP) return;
    FLIP = v;
    bgKey = '';
  }

  /* ==========================================================================
   * ART —— v9 贴图模块
   *
   * 分工：
   *   · 图片加载 / 命名约定 全在这里，渲染代码只问「我要哪张图」
   *   · 任何一张图没加载好 → 返回 null，调用方自动退回原来的矢量画法
   *     （所以贴图缺失时游戏不会崩，只是那一个部件用旧样式）
   *
   * 贴图清单由 `dev/gen-asset-index.js` 从 art/v9/ 目录扫描生成（assets.js），
   * 不手写 —— 否则一定会和目录脱节。加了新素材就重跑一次那个脚本。
   * ====================================================================== */
  var ART = (function () {
    var FILES = window.ARTV9FILES || [];
    var DECO = window.ARTV9DECO || {};
    var ANCHOR = window.ARTV9DECO_ANCHOR || {};
    var TEAM_DECO = window.ARTV9DECO_TEAM || [];
    var DIR = 'art/v9/';
    var cache = {};
    var loaded = 0, failed = 0;

    function load() {
      if (!FILES.length || typeof Image !== 'function') return;
      FILES.forEach(function (f) {
        var im = new Image();
        im.onload = function () { loaded++; };
        im.onerror = function () { failed++; };
        im.src = DIR + f;
        cache[f] = im;
      });
    }
    /* 只有「真的可以画」才返回 image，否则 null（交给矢量兜底） */
    function img(name) {
      if (!name) return null;
      var i = cache[name];
      if (!i) return null;
      if (i.complete === false) return null;
      if (i.naturalWidth === 0) return null;
      return i;
    }
    function stats() { return { total: FILES.length, loaded: loaded, failed: failed }; }

    /* ---------- 等级 → 材质纪元：Lv1-2→e1 木，3-4→e2 石，5-6→e3 铁，7-8→e4 装甲，9-10→e5 金 ---------- */
    function eraOf(level) {
      return Math.min(5, Math.max(1, Math.ceil((level || 1) / 2)));
    }

    function baseFile(b) {
      var k = b.def.key, lv = b.level || 1;
      if (b.def.isBase) return 'base_L' + Math.min(6, lv) + '.png';
      if (k === 'mine') return 'mine_L' + Math.min(5, lv) + '.png';
      if (k === 'ward') return 'ward_body_e' + eraOf(lv) + '.png';
      return k + '_base_e' + eraOf(lv) + '.png';
    }

    /* 武器层：分支只换武器不换底座，所以文件名里带分支名。
     * 分支在 Lv5（e3）才选，所以 e1/e2 一定用基础武器。 */
    function topFile(b) {
      var k = b.def.key, lv = b.level || 1, era = eraOf(lv);
      if (b.def.isBase || k === 'mine') return null;
      if (k === 'ward') return b.branch ? ('ward_' + b.branch + '_top_e' + era + '.png') : null;
      if (b.branch && era >= 3) return k + '_' + b.branch + '_top_e' + era + '.png';
      return k + '_top_e' + Math.min(2, era) + '.png';
    }

    /* 哪些家族的武器是「炮管朝右」的 —— 需要按瞄准角旋转。
     * 法师球 / 特斯拉线圈 / 防御塔水晶都是无方向的，一转就歪。 */
    var SPIN_KEYS = { cannon: 1, arrow: 1, mortar: 1 };

    function teamDeco(b) {
      var out = [];
      /* v21：阵营专属件按**视觉阵营**取（我方挂星徽、对手挂兽骨），
       * 否则红方玩家会看到自己大本营挂着"敌方"的兽骨。 */
      var vt = vTeam(b.team);
      TEAM_DECO.forEach(function (t) {
        if (t.team !== vt) return;
        if ((b.level || 1) < (t.level_gte || 1)) return;
        t.add.forEach(function (d) { out.push(d); });
      });
      return out;
    }

    /* 某建筑当前等级该挂哪些装饰件（阵营占位符在这里替换） */
    function decoFiles(b) {
      var names = (DECO[b.level || 1] || []).slice();
      /* v21：阵营装饰件（蓝=星徽 / 红=兽骨）也按「我是蓝」重映射 */
      var team = vTeam(b.team);
      names = names.map(function (n) {
        return n.indexOf('{team}') >= 0 ? n.replace('{team}', team) : n;
      });
      /* 阵营专属件与通用件互斥：蓝方挂星徽、红方挂兽骨，不同时出现 */
      var td = teamDeco(b);
      var mutual = { dc_emblem_star: 'dc_skull', dc_skull: 'dc_emblem_star' };
      names = names.filter(function (n) { return td.indexOf(n) < 0; });
      return names.concat(td).filter(function (n, i, a) { return a.indexOf(n) === i; });
    }

    /* ---------- 脏化层（苔藓/锈迹/裂纹）：用 base 自己的剪影做 mask ----------
     * 不 mask 的话贴上去就是一块方形补丁，比不贴更假。
     * 结果按 (纹理, 底座) 缓存，同屏几十栋楼也只算一次。 */
    var maskCache = {};
    function maskedTexture(texFile, baseImgName) {
      var key = texFile + '|' + baseImgName;
      if (Object.prototype.hasOwnProperty.call(maskCache, key)) return maskCache[key];
      var tex = img(texFile), bs = img(baseImgName);
      if (!tex || !bs) return (maskCache[key] = null);
      try {
        var w = bs.naturalWidth || 512, h = bs.naturalHeight || 512;
        var c = document.createElement('canvas');
        c.width = w; c.height = h;
        var g = c.getContext('2d');
        g.drawImage(tex, 0, 0, w, h);
        g.globalCompositeOperation = 'destination-in';
        g.drawImage(bs, 0, 0, w, h);
        return (maskCache[key] = c);
      } catch (e) {
        return (maskCache[key] = null);
      }
    }

    /* ---------- 底座层 ---------- */
    /* 画在格子矩形内：底边对齐、水平居中，允许略微超出格子（建筑本该比格子饱满） */
    function drawBase(b, r, w, h) {
      var f = baseFile(b), im = img(f);
      if (!im) return false;
      var side = Math.max(w, h) * ART_FIT.base;
      var x = r.x + w / 2 - side / 2;
      var y = r.y + h - side;                 // 底边贴齐格子下沿
      ctx.drawImage(im, x, y, side, side);
      return true;
    }

    /* ---------- 装饰件层（底座之上、武器之下） ---------- */
    function drawDeco(b, r, w, h) {
      var names = decoFiles(b);
      if (!names.length) return;
      var baseName = baseFile(b);
      names.forEach(function (n) {
        var a = ANCHOR[n] || { anchor: 'face', fit: 0.28, x: 0.5, y: 0.5 };
        if (a.anchor === 'fill') {
          var m = maskedTexture(n + '.png', baseName);
          if (!m) return;
          /* 苔藓/锈迹只长在下半截：用 source 裁剪下半部 */
          var top = (n === 'dc_moss' || n === 'dc_rust') ? 0.45 : 0;
          ctx.save();
          ctx.globalAlpha = 0.92;
          ctx.drawImage(m,
            0, m.height * top, m.width, m.height * (1 - top),
            r.x + w / 2 - (w * ART_FIT.base) / 2,
            r.y + h - w * ART_FIT.base + w * ART_FIT.base * top,
            w * ART_FIT.base, w * ART_FIT.base * (1 - top));
          ctx.restore();
          return;
        }
        var im = img(n + '.png');
        if (!im) return;
        var sz = Math.max(w, h) * (a.fit || 0.3);
        var cx, cy;
        if (a.anchor === 'band') { cx = r.x + w / 2; cy = r.y + h * (a.y == null ? 0.55 : a.y); }
        else if (a.anchor === 'hang') { cx = r.x + w * (a.x == null ? 0.72 : a.x); cy = r.y + h * (a.y == null ? 0.06 : a.y) + sz / 2; }
        else if (a.anchor === 'crown') { cx = r.x + w / 2; cy = r.y + h * (a.y == null ? 0.02 : a.y) + sz / 2; }
        else { cx = r.x + w * (a.x == null ? 0.5 : a.x); cy = r.y + h * (a.y == null ? 0.5 : a.y); }
        ctx.drawImage(im, cx - sz / 2, cy - sz * 0.30, sz, sz);
      });
    }

    /* ---------- 武器层 ---------- */
    /* ang：瞄准角（弧度，0 = 朝右）。定子类 / 无方向类传 null，一律 0° 摆正。 */
    function drawTop(b, r, w, h, s, ang) {
      var f = topFile(b), im = img(f);
      if (!im) return false;
      var key = b.def.key;
      var spin = !!SPIN_KEYS[key] && (ang != null);
      var side = s * ART_FIT.top;
      ctx.save();
      ctx.translate(r.x + w / 2, r.y + h / 2);
      if (spin) ctx.rotate(ang);
      ctx.drawImage(im, -side / 2, -side / 2, side, side);
      ctx.restore();
      return true;
    }

    /* ---------- 兵种 ----------
     * 朝向：stepDir 是四向单位向量，且跨格沿用 → 直接拿来判方向。
     * 4 个方向用 3 套姿态覆盖（左右靠水平镜像）：
     *   down（朝镜头/向下推进）→ front
     *   up  （背对镜头/向上推进）→ back
     *   right / left → side（left 镜像）
     * 素材缺失时逐级回退，最终退回只有正面两帧的旧命名。 */
    var POSE = {
      down:  { pose: 'front', flip: false },
      up:    { pose: 'back',  flip: false },
      right: { pose: 'side',  flip: false },
      left:  { pose: 'side',  flip: true }
    };
    function unitFile(u, st, frame) {
      var p = POSE[vFacing(lastFacing[u.id] || 'down')] || POSE.down;
      /* v21 视角镜像：贴图阵营按「我是蓝、对面是红」重映射（不是按逻辑阵营）。
       * 红方玩家看到自己的兵是蓝皮、对手是红皮 —— 两端认知一致。 */
      var team = vTeam(u.team);
      var base = 'unit_' + u.key + '_' + team;
      var legacy = (st === 'atk') ? 'attack' : 'idle';
      var cands = [];
      if (st === 'walk') {
        cands.push(base + '_' + p.pose + '_walk' + frame + '.png');
        cands.push(base + '_' + p.pose + '_walk0.png');
      }
      cands.push(base + '_' + p.pose + '_' + st + '.png');   // 带姿态的 idle / atk
      if (st === 'walk') {
        /* 该姿态没做素材时，先退回**正面**的同状态（继续迈步），再退回站立。
         * 不能一上来就退回 idle —— 那样对称造型（气球/飞艇）往上飞时会"停住不迈步"。 */
        cands.push(base + '_front_walk' + frame + '.png');
        cands.push(base + '_front_walk0.png');
      }
      if (st === 'idle') {
        /* 没有该姿态的 idle 时，用该姿态的走路帧兜底。
         * 绝不能退回正面 idle —— 那会出现「往上走是背面、一停下变正面」的跳变，
         * 比"站着腿略分开"难看得多。 */
        cands.push(base + '_' + p.pose + '_walk0.png');
      }
      cands.push(base + '_' + legacy + '.png');              // 旧命名：只有正面（视作 front）
      for (var i = 0; i < cands.length; i++) {
        if (img(cands[i])) return cands[i];
      }
      return null;
    }
    function drawUnit(u, cx, bottomY, s, scaleMul) {
      var moving = (u.nextStep && u.moveProg > 0.02);
      var attacking = (u.lastAttackAt != null && state.time - u.lastAttackAt < 0.30);
      var st = attacking ? 'atk' : (moving ? 'walk' : 'idle');
      /* 走路两帧：一格两步，相位直接取 moveProg —— 步频天然跟速度绑定，不会滑步。
       * 停下时不重置相位（冻结在当前帧），避免"脚弹回并拢"。 */
      var frame = ((u.moveProg || 0) < 0.5) ? 0 : 1;
      var fn = unitFile(u, st, frame);
      var im = img(fn);
      if (!im) return false;
      var p = POSE[vFacing(lastFacing[u.id] || 'down')] || POSE.down;
      var mul = (scaleMul == null) ? 1 : scaleMul;
      var side = s * ART_FIT.unit * mul;
      /* 走路时轻微上下浮动；pose 帧本身已经有步伐，浮动幅度压到 0.03 免得像在蹦 */
      var bob = moving ? Math.sin((u.moveProg || 0) * Math.PI * 2) * s * 0.030 : 0;

      // 脚下软投影：贴图兵种不压这层会像浮在棋盘上
      ctx.save();
      ctx.globalAlpha = 0.30;
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.ellipse(cx, bottomY + bob, side * 0.30, side * 0.10, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      ctx.save();
      ctx.translate(cx, bottomY + bob);
      if (p.flip) ctx.scale(-1, 1);          // 绕自身中心镜像，武器不会甩到另一边
      ctx.drawImage(im, -side / 2, -side, side, side);
      ctx.restore();
      return true;
    }

    /* 朝向缓存：转向后必须保持最后朝向，不能回退默认方向 */
    var lastFacing = {};
    function updateFacing(u) {
      var d = u.stepDir;
      if (!d) return;
      var f = null;
      if (d.c > 0) f = 'right';
      else if (d.c < 0) f = 'left';
      else if (d.r > 0) f = 'down';
      else if (d.r < 0) f = 'up';
      /* 拐角那一格先不换姿态（等走过 15%），否则一格之内会闪两套姿态 */
      if (f && u.moveProg > 0.15) lastFacing[u.id] = f;
      else if (f && !lastFacing[u.id]) lastFacing[u.id] = f;
    }

    /* ---------- 特效层 ----------
     * 特效图是「纯黑底 + 亮度键控」抠出来的（连续 alpha），默认用 `lighter` 叠加：
     * 暗部等于加 0，只有亮的发亮 —— 火光该有的样子。
     *
     * 但**法术图标不是发光体**（它有暗色描边和实体），用 lighter 会把描边吃掉、
     * 整张发灰，所以 blend 可传 'source-over'。 */
    function drawFx(name, cx, cy, side, alpha, ang, blend) {
      var im = img(name + '.png');
      if (!im) return false;
      ctx.save();
      ctx.globalCompositeOperation = blend || 'lighter';
      ctx.globalAlpha = Math.max(0, Math.min(1, alpha == null ? 1 : alpha));
      ctx.translate(cx, cy);
      if (ang) ctx.rotate(ang);
      ctx.drawImage(im, -side / 2, -side / 2, side, side);
      ctx.restore();
      return true;
    }

    return {
      load: load, img: img, stats: stats, eraOf: eraOf,
      baseFile: baseFile, topFile: topFile, decoFiles: decoFiles,
      drawBase: drawBase, drawDeco: drawDeco, drawTop: drawTop,
      drawUnit: drawUnit, updateFacing: updateFacing, drawFx: drawFx,
      facing: function (id) { return lastFacing[id] || null; },
      isSpin: function (key) { return !!SPIN_KEYS[key]; }
    };
  })();

  /* 贴图相对格子的尺寸系数（调这三个数就能整体放大/缩小，不用改结构）
   *   base 1.16 —— 建筑撑满一格，略微出格（建筑本该比格子饱满）
   *   top  1.34 —— 武器层通常比底座略大，出格 15% 才不显得"缩在台座里"
   *   unit 1.12 —— 实测 0.96 时兵像蚂蚁（只占 0.55 格），1.30 又会压到邻格并和同格
   *                多兵叠在一起，1.12 约 0.7 格最舒服 */
  var ART_FIT = { base: 1.16, top: 1.34, unit: 1.12 };

  /* ==========================================================================
   * 贴图特效队列（纯渲染层，不碰逻辑）
   *
   * 出生 / 死亡这两种效果逻辑层没有事件可听，但渲染层每帧都能看到"谁新出现了、
   * 谁不见了"，所以在这里用一张 id 表做差分。好处是逻辑层一行不用改。
   * ====================================================================== */
  var fxQueue = [];        // { kind, x, y, t0, side }
  var seenUnits = {};      // id → { x, y }（最后一帧的位置，死亡时用来放烟）
  var spellZones = [];     // 增益类法术的持续领域 { row, col, radius, kind, t0, dur }

  function pushFx(kind, x, y, side) {
    if (fxQueue.length > 60) fxQueue.shift();   // 兜底上限，防止极端情况堆积
    fxQueue.push({ kind: kind, x: x, y: y, t0: state.time, side: side });
  }

  function trackUnitFx(s) {
    var seen = {};
    state.units.forEach(function (u) {
      seen[u.id] = 1;
      var p = lerpPos(u);
      var r = cellRectF(p.row, p.col);
      var cx = r.x + r.s / 2;
      var cy = r.y + r.s * 0.74;
      if (!seenUnits[u.id]) {
        seenUnits[u.id] = { x: cx, y: cy };
        /* 出生：只有真的从场外进场才有意义；第一帧全量初始化时不要刷屏 */
        if (state.time > 0.15) pushFx('fx_spawn_1', cx, cy, s * 1.05);
      } else {
        seenUnits[u.id].x = cx;
        seenUnits[u.id].y = cy;
      }
    });
    Object.keys(seenUnits).forEach(function (id) {
      if (seen[id]) return;
      var q = seenUnits[id];
      pushFx('fx_death_1', q.x, q.y, s * 0.90);
      delete seenUnits[id];
    });
  }

  /* 增益类法术的持续领域：画一块贴地的淡色椭圆光环，直到法术结束 */
  function drawSpellZones(s) {
    for (var i = spellZones.length - 1; i >= 0; i--) {
      var z = spellZones[i];
      var age = state.time - z.t0;
      if (age < 0 || age > z.dur) { spellZones.splice(i, 1); continue; }
      var col = z.kind === 'rage' ? '#ffb14d' : (z.kind === 'freeze' ? '#6fd3ff' : '#c99ae0');
      var k = age / z.dur;
      var fade = k < 0.8 ? 0.20 : 0.20 * (1 - (k - 0.8) / 0.2);
      var c0 = cellRect(z.row, z.col);
      var zcx = c0.x + s / 2, zcy = c0.y + s / 2;
      var zrad = (z.radius + 0.5) * s;
      ctx.save();
      ctx.globalAlpha = Math.max(0, fade);
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.ellipse(zcx, zcy, zrad, zrad * 0.60, 0, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = Math.max(0, Math.min(1, fade * 2.6));
      ctx.strokeStyle = col; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.ellipse(zcx, zcy, zrad, zrad * 0.60, 0, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }
  }

  function drawFxQueue() {
    for (var i = fxQueue.length - 1; i >= 0; i--) {
      var f = fxQueue[i];
      var age = state.time - f.t0;
      var isSpawn = (f.kind === 'fx_spawn_1');
      var ttl = isSpawn ? 0.38 : 0.46;
      if (age > ttl || age < 0) { fxQueue.splice(i, 1); continue; }
      var k = age / ttl;
      /* 出生向上撑开；死亡向上飘散并淡出 */
      var grow = isSpawn ? (0.75 + k * 0.55) : (0.65 + k * 0.45);
      var alpha = isSpawn ? (1 - k) * 0.95 : Math.pow(1 - k, 1.4) * 0.85;
      ART.drawFx(f.kind, f.x, f.y - (isSpawn ? 0 : k * 6), f.side * grow, alpha, 0);
    }
  }


  /* 渲染插值（配合逻辑层的亚格进度）：
   *
   * 逻辑层给每个单位提供：
   *   u.row/u.col   = 当前所在格
   *   u.nextStep    = 正在走向的下一格（可能为 null）
   *   u.moveProg    = 走到 nextStep 的进度（0~1，按速度均匀累积）
   *
   * 绘制位置 = 当前格 + (nextStep - 当前格) × moveProg
   *
   * 这个位置**每 tick 都在变化**（moveProg 每 tick 按 speed×DT 匀速推进），
   * 所以画面上是连续滑动的，不会「走一格停一下」。
   *
   * 注意：**不要**在这里再额外加一份进度（曾经加过 acc/DT 的补偿，
   * 结果视觉速度比逻辑速度更快、跨格瞬间还会跳一下 —— 实测发现的 bug）。
   * 20Hz 的更新对 1 格/秒左右的移动已经足够平滑。
   */
  function lerpPos(u) {
    var prog = (typeof u.moveProg === 'number') ? u.moveProg : 0;
    if (prog < 0) prog = 0;
    if (prog > 1) prog = 1;
    var tr, tc;
    if (u.nextStep && prog > 0) {
      tr = u.row + (u.nextStep.r - u.row) * prog;
      tc = u.col + (u.nextStep.c - u.col) * prog;
    } else {
      tr = u.row; tc = u.col;
    }
    /* 转向那一 tick 会有一段"直角"位移（纵向 + 横向同时变），
     * 单帧距离约是平时的 √2 倍。这里只做**减速**（绝不加速）：
     * 如果这一帧要走太远，就少走一点，下一帧自然追上——
     * 视觉上是转弯时略微放缓，比"拐角处猛地一跳"自然得多。 */
    var prev = visLast[u.id];
    if (prev) {
      var spd = (u.def && u.def.speed) ? u.def.speed : 0.8;
      var maxStep = Math.max(0.03, spd * C.DT * 1.05);   // 1.05 = 只给 5% 余量
      var dr = tr - prev.r, dc = tc - prev.c;
      var dist = Math.abs(dr) + Math.abs(dc);
      if (dist > maxStep) {
        var k2 = maxStep / dist;
        tr = prev.r + dr * k2;
        tc = prev.c + dc * k2;
      }
    }
    visLast[u.id] = { r: tr, c: tc };
    return { row: tr, col: tc };
  }
  function cellRectF(row, col) {
    var s2 = layout.cell;
    return { x: layout.ox + (vCol(col) - 1) * s2, y: layout.oy + vRow(row) * s2, s: s2 };
  }
  var hoverCell = null;   // 鼠标当前悬停的格子（用于范围预览）
  var bcardsEl = document.getElementById('bcards');
  var ucardsEl = document.getElementById('ucards');
  var scardsEl = document.getElementById('scards');
  var gcardsEl = document.getElementById('gcards');
  var paneBuild = document.getElementById('paneBuild');
  var paneGlobal = document.getElementById('paneGlobal');
  var tabBuild = document.getElementById('tabBuild');
  var tabGlobal = document.getElementById('tabGlobal');
  var detailEl = document.getElementById('detail');
  var btnPath = document.getElementById('btnpath');
  var autoDeployEl = document.getElementById('autodeploy');

  var ME = 'blue', FOE = 'red';

  /* ================================================================
   * 双人对战（PvP）—— 确定性锁步 + WebSocket 中继（v20）
   * ----------------------------------------------------------------
   * · 不破坏单机：给 7 个「动作函数」包一层拦截。单机时原样转发；PvP 时先做
   *   本地纯校验（保持 UI 即时反馈），通过则把动作变成命令提交，由锁步引擎
   *   在两端同一 tick 执行（保证同步）。
   * · 锁步引擎用 REAL_C（包裹前的原始函数快照），避免自调用递归。
   * · 主循环在 PvP 下改调 net.step()，不再跑 aiUpdate。
   * ================================================================ */
  var NetMod = (typeof window !== 'undefined' && window.Net) ? window.Net : null;
  var REAL_C = Object.assign({}, C);   // 原始动作函数快照（必须在包裹之前）
  var PVP = { active: false, role: null, net: null, raw: null, transport: null, room: null,
              rtt: -1, pingAt: -1, pingTimer: 0, desync: false };

  (function installPvpHooks() {
    C.deployUnit = function (s, team, key, col) {
      if (!PVP.active || !PVP.net) return REAL_C.deployUnit.apply(null, arguments);
      var chk = C.canDeploy(s, team, key, col);
      if (!chk.ok) return chk;
      PVP.net.submit({ op: 'deploy', team: team, k: key, col: col });
      return { ok: true, unit: null, pvp: true };
    };
    C.placeBuilding = function (s, team, key, row, col) {
      if (!PVP.active || !PVP.net) return REAL_C.placeBuilding.apply(null, arguments);
      var chk = C.canPlace(s, team, key, row, col);
      if (!chk.ok) return chk;
      PVP.net.submit({ op: 'place', team: team, k: key, row: row, col: col });
      return { ok: true, building: null, pvp: true };
    };
    C.castSpell = function (s, team, key, row, col) {
      if (!PVP.active || !PVP.net) return REAL_C.castSpell.apply(null, arguments);
      var chk = C.canCastSpell(s, team, key, row, col);
      if (!chk.ok) return chk;
      var sp = null; C.DATA.spells.forEach(function (x) { if (x.key === key) sp = x; });
      var hits = 0;
      try { hits = (sp ? C.spellTargets(s, team, sp, row, col) : []).length; } catch (e) { hits = 0; }
      PVP.net.submit({ op: 'cast', team: team, k: key, row: row, col: col });
      return { ok: true, hits: hits, pvp: true };
    };
    C.upgradeBase = function (s, team) {
      if (!PVP.active || !PVP.net) return REAL_C.upgradeBase.apply(null, arguments);
      var base = C.ownBase(s, team);
      var cost = base ? C.buildingUpgradeCost(base) : null;
      if (cost == null) return { ok: false, why: '大本营已满级' };
      if (s.res[team] < cost) return { ok: false, why: '金币不足（需要 ' + cost + '）' };
      PVP.net.submit({ op: 'upBase', team: team });
      return { ok: true, level: (s.baseLevel[team] || 1) + 1, pvp: true };
    };
    C.upgradeBuilding = function (s, b, branch) {
      if (!PVP.active || !PVP.net) return REAL_C.upgradeBuilding.apply(null, arguments);
      if (!b || !b.def) return { ok: false, why: '没有这个建筑' };
      if (b.def.isBase) return C.upgradeBase(s, b.team);
      var cost = C.buildingUpgradeCost(b);
      if (cost == null) return { ok: false, why: '已达最高等级' };
      if (s.res[b.team] < cost) return { ok: false, why: '金币不足（需要 ' + cost + '）' };
      PVP.net.submit({ op: 'upBld', team: b.team, ref: C.toRef(b.row, b.col), branch: branch || undefined });
      return { ok: true, level: (b.level || 1) + 1, branch: branch || null, pvp: true };
    };
    C.upgradeGlobal = function (s, team, key) {
      if (!PVP.active || !PVP.net) return REAL_C.upgradeGlobal.apply(null, arguments);
      var g = null; C.globalUpgradeStatus(s, team).forEach(function (x) { if (x.key === key) g = x; });
      if (!g) return { ok: false, why: '未知科技' };
      if (g.cost == null) return { ok: false, why: '已满级' };
      if (s.res[team] < g.cost) return { ok: false, why: '金币不足（需要 ' + g.cost + '）' };
      PVP.net.submit({ op: 'upGlobal', team: team, k: key });
      return { ok: true, level: g.level + 1, cost: g.cost, nextEffect: g.nextEffect || '（同步中）', pvp: true };
    };
    C.demolishBuilding = function (s, b) {
      if (!PVP.active || !PVP.net) return REAL_C.demolishBuilding.apply(null, arguments);
      var chk = C.canDemolish(s, b);
      if (!chk.ok) return chk;
      PVP.net.submit({ op: 'dem', team: b.team, ref: C.toRef(b.row, b.col) });
      return { ok: true, refund: C.demolishRefund(b), pvp: true };
    };
  })();

  /* 传输多播：大厅与锁步引擎同时订阅同一条 WebSocket（各自忽略无关消息） */
  function makeMux(raw) {
    var subs = [];
    raw.onMessage(function (m) { for (var i = 0; i < subs.length; i++) { try { subs[i](m); } catch (e) {} } });
    return {
      send: function (o) { return raw.send(o); },
      onMessage: function (f) { subs.push(f); },
      close: function () { raw.close(); }
    };
  }
  function pvpStatus(t, isErr) {
    var e = document.getElementById('pvpstatus');
    if (!e) return;
    e.textContent = t || '';
    if (e.classList) { if (isErr) e.classList.add('err'); else e.classList.remove('err'); }
  }
  function pvpServerUrl() {
    try {
      if (typeof location !== 'undefined' && location && location.host) {
        return (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host;
      }
    } catch (e) {}
    return 'ws://localhost:8787';
  }
  function genSeed() { return (Math.random() * 2147483647) >>> 0; }

  /* 开局前就要把 RTT 量出来 —— 输入延迟 D 必须大于一个完整往返，这是锁步的硬下限，
   * 等进了对局再测就晚了（那时命令已经在路上，改 D 会让已排期的命令全部错位）。
   * 取多次最小值：单次结果可能被一次排队/重传污染，最小值才接近真实链路。 */
  function pvpStartPing() {
    if (PVP.pingTimer) clearInterval(PVP.pingTimer);
    function ping() {
      if (!PVP.transport || !NetMod) return;
      if (PVP.pingAt >= 0) return;                 // 上一条没回，不叠着发
      PVP.pingAt = NetMod.nowMs();
      PVP.transport.send({ type: 'ping2', t: PVP.pingAt });
    }
    ping();
    PVP.pingTimer = setInterval(ping, 1200);
  }

  /* 按实测 RTT 定输入延迟。200ms 余量是给抖动留的：RTT 稳定 300ms，不代表每一刻
   * 都是 300ms，偶发多 100ms 就会让命令迟到、当场分叉。 */
  function pvpDelayTicks() {
    var ms = PVP.rtt > 0 ? PVP.rtt : 250;          // 还没测出来就按 250ms 保守估
    var t = Math.ceil(ms / 50) + 4;
    return Math.max(6, Math.min(40, t));           // 上限 40 tick = 2 秒，再高就没法玩了
  }

  function pvpConnect(room) {
    if (!NetMod || !NetMod.WsTransport) {
      pvpStatus('联机模块未加载：请用 relay 服务器打开页面（node server/relay.js）', true);
      return;
    }
    if (PVP.transport) { try { PVP.transport.close(); } catch (e) {} }
    if (PVP.pingTimer) { clearInterval(PVP.pingTimer); PVP.pingTimer = 0; }
    PVP.rtt = -1; PVP.pingAt = -1;
    var raw = NetMod.WsTransport(pvpServerUrl());
    var mux = makeMux(raw);
    PVP.raw = raw; PVP.transport = mux; PVP.room = room;
    mux.onMessage(pvpOnMessage);
    raw.onOpen = function () {
      mux.send({ type: 'join', room: room });
      pvpStatus('已连接，进入房间 ' + room + '，等待对手…');
      pvpStartPing();
    };
    try {
      raw.ws.addEventListener('error', function () {
        pvpStatus('连接失败：确认 relay 已启动（node server/relay.js）且地址可达', true);
      });
      raw.ws.addEventListener('close', function () {
        if (!PVP.active) pvpStatus('连接已断开', true);
      });
    } catch (e) {}
    pvpStatus('正在连接 ' + pvpServerUrl() + ' …');
  }

  function pvpOnMessage(msg) {
    if (!msg || typeof msg !== 'object') return;
    if (msg.type === 'waiting') {
      pvpStatus('房间 ' + msg.room + '：等待对手加入…');
    } else if (msg.type === 'ping2') {
      /* 对手在量链路，原样回显。这条在配对前就要能处理 —— 大厅阶段也得测得出 RTT。 */
      if (PVP.transport) PVP.transport.send({ type: 'pong2', t: msg.t });
    } else if (msg.type === 'pong2') {
      if (msg.t === PVP.pingAt) {
        var d = NetMod ? (NetMod.nowMs() - PVP.pingAt) : -1;
        if (d >= 0) PVP.rtt = (PVP.rtt > 0 && PVP.rtt < d) ? PVP.rtt : d;
        PVP.pingAt = -1;
      }
    } else if (msg.type === 'paired') {
      PVP.role = msg.role;
      if (PVP.role === 'host') {
        pvpStatus('配对成功（你是房主），正在开局…');
        var seed = genSeed();
        /* D 由房主算、随 start 下发，保证两端拿到完全同一个值 ——
         * 两端各自算的话，一次 RTT 抖动就能让两边取到不同的 D，直接分叉。 */
        var dt = pvpDelayTicks();
        PVP.transport.send({ type: 'start', seed: seed, dt: dt });
        pvpBegin(seed, dt);
      } else {
        pvpStatus('配对成功（你是应战方），等待房主开局…');
      }
    } else if (msg.type === 'start') {
      pvpBegin(msg.seed >>> 0, msg.dt);
    } else if (msg.type === 'rematch') {
      if (PVP.role === 'host' && PVP.active) pvpRestart();
    } else if (msg.type === 'peer-left') {
      if (PVP.active) { if (hintEl) hintEl.textContent = '对手已离开对局'; }
      else pvpStatus('对手已离开房间', true);
    }
  }

  /* 联机状态角标：把「延迟」和「帧差」变成具体数字。
   * 为什么必须做：之前所有关于「延时很重」的判断都只能靠体感，而真实原因却是本地
   * tick 漂移（帧率掉下去仿真变慢），跟网络一点关系都没有 —— 没有数字就只能猜，
   * 一猜就猜错方向，白改好几轮。现在玩家截图就能看到到底是网络还是帧差。 */
  function pvpNetHud() {
    if (!PVP.active || !PVP.net || !hintEl) return;
    if (PVP.desync) { hintEl.textContent = '⚠ 与对手不同步，建议返回菜单重开一局'; return; }
    var s = '双人对战：你在蓝方（下方），对手在红方（上方）';
    var r = PVP.net.rtt, l = PVP.net.lead;
    if (r >= 0) s += '　·　网络 ' + Math.round(r) + 'ms';
    s += '　·　输入延迟 ' + (PVP.net.delayTicks * 50) + 'ms';
