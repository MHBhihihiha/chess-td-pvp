    if (Math.abs(l) >= 4) s += '　·　帧差 ' + (l > 0 ? '+' : '') + l + (PVP.net.waiting ? '（已暂停等对手）' : '');
    hintEl.textContent = s;
  }

  function pvpBegin(seed, dt) {
    if (!NetMod || !NetMod.createLockstep) { pvpStatus('联机模块未加载', true); return; }
    PVP.active = true;
    ME = (PVP.role === 'host') ? 'blue' : 'red';
    FOE = (ME === 'blue') ? 'red' : 'blue';
    /* v21：红方玩家把整盘倒过来看 —— 双方都「自己是蓝方、在下方」 */
    setFlip(ME === 'red');
    state = C.createState({ seed: seed >>> 0, difficulty: 'hard' });
    state.aiTeam = null;                 // 双人：没有 AI
    sel = null; selectedUnit = null; selectedBuilding = null;
    startedAt = 0;
    if (overEl) overEl.classList.remove('show');
    if (detailEl) { detailEl.classList.remove('show'); detailEl.innerHTML = ''; }
    setStartVisible(false);
    if (autoDeployEl) autoDeployEl.checked = false;   // PvP 不能本地直接派兵
    if (PVP.pingTimer) { clearInterval(PVP.pingTimer); PVP.pingTimer = 0; }   // 交给锁步自己测，别两套 ping 打架
    if (PVP.net) { try { PVP.net.close(); } catch (e) {} PVP.net = null; }
    PVP.desync = false;
    var D = (dt | 0) || pvpDelayTicks();
    PVP.net = NetMod.createLockstep({
      C: REAL_C, state: state, me: ME, transport: PVP.transport,
      delayTicks: D, checkEvery: 20, rtt: PVP.rtt,
      onDesync: function (e) {
        PVP.desync = true;
        pvpStatus('⚠ 与对手不同步（tick ' + e.tick + '），建议重开一局', true);
        try { console.warn('[PvP] desync', e); } catch (x) {}
      }
    });
    buildCards(); buildGlobalCards(); render();
    /* 文案跟着镜像走：不管逻辑上是蓝是红，玩家眼里自己永远是下方蓝方 */
    if (hintEl) hintEl.textContent = '双人对战：你在蓝方（下方），对手在红方（上方）';
  }

  function pvpRestart() {
    var seed = genSeed();
    var dt = pvpDelayTicks();
    if (PVP.transport) PVP.transport.send({ type: 'start', seed: seed, dt: dt });
    pvpBegin(seed, dt);
  }

  function pvpLeave() {
    if (PVP.pingTimer) { clearInterval(PVP.pingTimer); PVP.pingTimer = 0; }
    if (PVP.transport) { try { PVP.transport.close(); } catch (e) {} }
    if (PVP.net) { try { PVP.net.close(); } catch (e) {} }
    PVP.active = false; PVP.net = null; PVP.transport = null; PVP.raw = null;
    PVP.role = null; PVP.room = null;
    ME = 'blue'; FOE = 'red';
    setFlip(false);            // 回单机 = 回默认（蓝方）视角
    pvpStatus('');
  }

  /* 模式切换（AI / PvP），只在开始界面生效 */
  var startMode = 'ai';
  function setStartMode(m) {
    startMode = m;
    var ai = document.getElementById('modeai'), pv = document.getElementById('modepvp');
    if (ai) { ai.classList.toggle('on', m === 'ai'); ai.setAttribute('aria-selected', m === 'ai' ? 'true' : 'false'); }
    if (pv) { pv.classList.toggle('on', m === 'pvp'); pv.setAttribute('aria-selected', m === 'pvp' ? 'true' : 'false'); }
    var box = document.getElementById('pvpbox'); if (box) box.hidden = (m !== 'pvp');
    var sb = document.getElementById('startbtn'); if (sb) sb.style.display = (m === 'pvp') ? 'none' : '';
    var cl = document.getElementById('cornerl'); if (cl) cl.style.display = (m === 'pvp') ? 'none' : '';
  }
  (function wireStartMode() {
    var ai = document.getElementById('modeai'), pv = document.getElementById('modepvp');
    if (ai) ai.onclick = function () { setStartMode('ai'); };
    if (pv) pv.onclick = function () { setStartMode('pvp'); };
    var cc = document.getElementById('pvpcreate'), jj = document.getElementById('pvpjoin');
    var code = document.getElementById('roomcode');
    if (cc) cc.onclick = function () {

      pvpConnect(r);
    };
  })();

  var BUILD_ORDER = ['mine', 'cannon', 'arrow', 'mage', 'mortar', 'tesla', 'ward'];
  var UNIT_ORDER = ['infantry', 'heavy', 'siege', 'ram', 'archer', 'balloon', 'airship', 'dragon'];

  var sel = null;                 // {kind:'building'|'unit'|'spell', key}
  var showPath = false;
  var selectedBuilding = null;
  var selectedUnit = null;
  var layout = { cell: 30, ox: 0, oy: 0 };
  var renderDt = 1 / 60;     // 上一帧的 dt（秒），用于把炮口转向的平滑做成帧率无关
  var lastDetailRefresh = 0;

  /* 难度选择卡片（规格 §4.1 / §4.5）

   * 目标真人胜率只作为内部标定依据：简单 0.6–0.8 / 普通 0.4–0.6 / 困难 0.1–0.2。 */
  var DIFF_INFO = {

  function buildDiffCards() {

  /* CTA 提示行同步：切换难度后给玩家「选择生效了」的确认反馈 */

  /* 结束界面结果剪影（规格 §5.3）：胜=红方残部 / 负=蓝方残部 / 平=蓝红步兵对峙 */
  function fillFigs(res) {

  function newGame() {
    /* 单机永远从默认（蓝方）视角开局：PvP 退出来时 ME 可能还是 'red'，
     * 这里一并复位，避免「单人局用红方视角 + 红方大本营在下」的错位。 */
    ME = 'blue'; FOE = 'red';
    setFlip(false);
    state = C.createState({ difficulty: difficulty });
    state.aiTeam = FOE;               // 红方是电脑（大本营自愈等难度特判走这一边）
    sel = null;
    selectedUnit = null;

  /* 开始游戏：先把开局界面收起来，再重置一局 */
  function startGame() {
    setStartVisible(false);
    newGame();
    startedAt = 0;
  }

  /* ---------------------------------------------------------------- 布局 */
  function computeLayout() {
    var wrap = document.getElementById('board-wrap');
    var W = wrap.clientWidth, H = wrap.clientHeight;
    var rows = C.ROWS + 2;
    var cell = Math.max(14, Math.min(Math.floor(H / rows), Math.floor(W / (C.COLS + 2))));
    layout.cell = cell;
    layout.ox = (W - cell * C.COLS) / 2;
    layout.oy = (H - cell * rows) / 2;
  }
  /* 逻辑格 → 屏幕矩形。
   * 多格建筑（大本营 2×2）必须传 spanRows/spanCols：
   * 180° 镜像会把「左上角」翻成「右下角」，只按单格算会让整块建筑向右下错一格 ——
   * 红方视角下大本营会压到最底那条通道行上，盖住通道标签（v21 实测到的现象）。
   * 所以镜像时对四角取 min，才是真正的屏幕左上角。 */
  function cellRect(row, col, spanRows, spanCols) {
    var s = layout.cell;
    var sr = (spanRows | 0) || 1, sc = (spanCols | 0) || 1;
    var vr = vRow(row), vc = vCol(col);
    if (sr > 1 || sc > 1) {
      vr = Math.min(vr, vRow(row + sr - 1));
      vc = Math.min(vc, vCol(col + sc - 1));
    }
    return { x: layout.ox + (vc - 1) * s, y: layout.oy + vr * s, s: s };
  }
  /* 屏幕点 → 逻辑格。180° 旋转是自逆变换，所以「正向」和「反向」用同一对映射。 */
  function pointToCell(px, py) {
    var s = layout.cell;
    var col = Math.floor((px - layout.ox) / s) + 1;
    var row = Math.floor((py - layout.oy) / s);
    if (col < 1 || col > C.COLS || row < 0 || row > C.ROWS + 1) return null;
    return { row: vRow(row), col: vCol(col) };
  }

  /* ---------------------------------------------------------------- 绘制 */
  function drawRoundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  /* ================================================================ 弹道系统
   * 每种攻击者都有专属的「飞行物」，从发射者飞向目标，带抛物线弧。
   *
   * 视觉分类（对应逻辑层 projStyle）：
   *   ball   炮弹/炸弹  —— 圆球 + 拖尾，落地小爆
   *   arrow  箭矢        —— 细长箭头 + 速度线
   *   bolt   弩矢        —— 更粗更快的箭头
   *   orb    法术球      —— 发光球 + 光晕
   *   shell  高抛炮弹    —— 大弧线 + 落点阴影预警
   *   spark  电花        —— 锯齿闪电
   *   slash  近战刀光    —— 短促弧形闪光
   *   crit   重击        —— 大字刀光 + 震屏感
   *
   * 生命期：逻辑层给 ttl（0.13~0.18s），我们用 born 到 now 的进度 0→1 插值。
   */
  /* ---------------------------------------------------------------- 电的质感
   * 特斯拉电塔 / 大电塔 = 「电击」：从塔顶劈向目标的锐利闪电。
   *
   * 关键是「折」不是「摆」：
   *   · 段数少（3~9 段）、拐点尖锐、幅度小 → 像闪电劈下来
   *   · 段数多 + 正弦包络 → 会摆成一条波浪线，那是水波不是电
   * 随机种子混入 (弹道 id, 当前时间)，每 25ms 重扭一次，看起来像在抖。 */
  function drawVoltBolt(x0, y0, x1, y1, color, size, seedBase, now) {
    var dx = x1 - x0, dy = y1 - y0;
    var L = Math.max(1, Math.hypot(dx, dy));
    var nx = -dy / L, ny = dx / L;
    var segs = Math.max(3, Math.min(9, Math.round(L / 16)));
    var seed = seedBase * 131 + Math.floor(now * 40);

    function jitter(k) {
      var r = Math.sin(seed * 0.7 + k * 12.9898) * 43758.5453;
      return (r - Math.floor(r) - 0.5);
    }

    var pts = [[x0, y0]];
    for (var i = 1; i < segs; i++) {
      var t = i / segs;
      // 中点略大、两端收敛：起止点必须精确落在塔顶和敌人身上
      var amp = jitter(i) * L * 0.10 * (Math.sin(t * Math.PI) * 0.6 + 0.4);
      pts.push([x0 + dx * t + nx * amp, y0 + dy * t + ny * amp]);
    }
    pts.push([x1, y1]);

    function strokePath(list, w, col) {
      ctx.beginPath();
      ctx.moveTo(list[0][0], list[0][1]);
      for (var p = 1; p < list.length; p++) ctx.lineTo(list[p][0], list[p][1]);
      ctx.lineWidth = w; ctx.strokeStyle = col; ctx.stroke();
    }

    ctx.lineCap = 'round';
    ctx.lineJoin = 'miter';       // 尖角，不是圆滑过渡 → 电的锐利感
    strokePath(pts, Math.max(4, size * 1.15), hexA(color, 0.16));    // 外辉光
    strokePath(pts, Math.max(2, size * 0.40), hexA(color, 0.80));    // 主干
    strokePath(pts, Math.max(1, size * 0.13), '#ffffff');            // 白芯

    /* 分叉：从中间某个拐点甩出一小截，闪电的"分叉"特征 */
    var mid = pts[1 + Math.floor(pts.length / 3)];
    if (mid) {
      var fx = mid[0] + (dx / L) * L * 0.16 + nx * L * 0.10 * (jitter(99) > 0 ? 1 : -1);
      var fy = mid[1] + (dy / L) * L * 0.16 + ny * L * 0.10 * (jitter(99) > 0 ? 1 : -1);
      strokePath([mid, [fx, fy]], Math.max(1, size * 0.16), hexA(color, 0.55));
    }

    // 命中点电光
    ctx.beginPath();
    ctx.arc(x1, y1, size * (0.55 + 0.14 * Math.sin(now * 30 + seed)), 0, Math.PI * 2);
    ctx.fillStyle = hexA(color, 0.80); ctx.fill();
    // 塔顶起弧点的小闪光
    ctx.beginPath();
    ctx.arc(x0, y0, size * 0.34, 0, Math.PI * 2);
    ctx.fillStyle = hexA('#ffffff', 0.55); ctx.fill();
  }

  /* 脉冲塔的电磁波 = 「波」：干净推开的一圈环，**不带锯齿**。
   * （锯齿是"电"，画在波前上会让人以为脉冲塔也在放电，把两种塔混成一类。） */
  function drawWaves() {
    if (!state.waves || !state.waves.length) return;
    var s = layout.cell;
    state.waves.forEach(function (w) {
      var c = cellRect(w.row, w.col);
      var cx = c.x + s / 2, cy = c.y + s / 2;
      var R = Math.max(0.5, w.radius * s);
      var prog = w.maxR > 0 ? Math.min(1, w.radius / w.maxR) : 1;
      var a = Math.max(0, 1 - prog);
      var col = w.color || '#8ff0e0';

      // 环内的能量面（柔光，越往外越薄）
      var g = ctx.createRadialGradient(cx, cy, Math.max(1, R * 0.5), cx, cy, R);
      g.addColorStop(0, hexA(col, 0));
      g.addColorStop(0.78, hexA(col, 0.09 * a));
      g.addColorStop(1, hexA(col, 0.20 * a));
      ctx.beginPath();
      ctx.arc(cx, cy, R, 0, Math.PI * 2);
      ctx.fillStyle = g; ctx.fill();

      // 波前：干净的正圆
      ctx.beginPath();
      ctx.arc(cx, cy, R, 0, Math.PI * 2);
      ctx.strokeStyle = hexA('#eafffb', 0.18 + 0.62 * a);
      ctx.lineWidth = Math.max(1.5, s * 0.085) * (1 - prog * 0.45);
      ctx.stroke();

      // 拖尾一圈，做出"推出去"的厚度
      ctx.beginPath();
      ctx.arc(cx, cy, Math.max(0.5, R - s * 0.16), 0, Math.PI * 2);
      ctx.strokeStyle = hexA(col, 0.28 * a);
      ctx.lineWidth = Math.max(1, s * 0.05);
      ctx.stroke();
    });
  }

  /* 按 id 找活着的单位（渲染层频繁用，避免每次 filter 全表） */
  function unitById(id) {
    if (id == null) return null;
    for (var ui = 0; ui < state.units.length; ui++) {
      if (state.units[ui].id === id) return state.units[ui];
    }
    return null;
  }
  /* 单位的亚格精度实时像素中心：用 lerpPos 的浮点格坐标 + 格子矩形 */
  function liveUnitCenter(u) {
    var p = lerpPos(u);
    var r = cellRectF(p.row, p.col);
    return { x: r.x + r.s / 2, y: r.y + r.s / 2 };
  }

  function drawProjectiles() {
    if (!state.projectiles || !state.projectiles.length) { fxImpacts = null; return; }
    var now = state.time;

    state.projectiles.forEach(function (p) {
      var st = p.proj || { type: 'ball', color: '#dfe8f5', size: 0.11, arc: 0.05, life: 0.22 };
      // 飞行进度（0=发射，1=命中）—— 用逻辑层给的 life，不同弹道速度不同
      var life = st.life || p.ttl || 0.22;
      var t = (now - (p.born != null ? p.born : now)) / life;
      if (!isFinite(t)) t = 1;
      t = t < 0 ? 0 : (t > 1 ? 1 : t);

      var a = cellRect(p.from.row, p.from.col);
      var b = cellRect(p.to.row, p.to.col);
      var x0 = a.x + a.s / 2, y0 = a.y + a.s / 2;
      var x1 = b.x + b.s / 2, y1 = b.y + b.s / 2;
      // 贝塞尔：中点抬升（arc 越大越明显）
      var mx = (x0 + x1) / 2, my = (y0 + y1) / 2;
      var lift = (st.arc || 0) * Math.max(a.s, Math.abs(y0 - y1), Math.abs(x0 - x1));
      var cx = mx, cy = my - lift;
      var ix = (1 - t) * (1 - t) * x0 + 2 * (1 - t) * t * cx + t * t * x1;
      var iy = (1 - t) * (1 - t) * y0 + 2 * (1 - t) * t * cy + t * t * y1;

      var size = (st.size || 0.12) * a.s;

      /* ---- 炮口火光：弹道刚出生的 ~0.1 秒，在出膛点按弹道方向画一帧
       * 只有"从炮口射出去"的才有：近战刀光和闪电不画（它们不从枪口出）。
       * 火光用 lighter 叠加，所以即使压在建筑上也不会发灰。 */
      var pAge = now - (p.born != null ? p.born : now);
      if (pAge >= 0 && pAge < 0.11 &&
          st.type !== 'slash' && st.type !== 'crit' && st.type !== 'volt' &&
          st.type !== 'arrow' && st.type !== 'bolt') {   // 弓箭没有火药火光
        var mAng = Math.atan2(y1 - y0, x1 - x0);
        ART.drawFx(pAge < 0.055 ? 'fx_muzzle_1' : 'fx_muzzle_2',
                   x0, y0, a.s * 0.86, 1 - pAge / 0.11, mAng);
      }

      // ---- 拖尾（越靠后越淡）闪电自成一体，不需要拖尾
      if (st.type !== 'slash' && st.type !== 'crit' && st.type !== 'volt') {
        var trailN = 5;
        for (var k = 1; k <= trailN; k++) {
          var tt = Math.max(0, t - k * 0.035);
          var tx = (1 - tt) * (1 - tt) * x0 + 2 * (1 - tt) * tt * cx + tt * tt * x1;
          var ty = (1 - tt) * (1 - tt) * y0 + 2 * (1 - tt) * tt * cy + tt * tt * y1;
          var al = 0.42 * (1 - k / (trailN + 1));
          ctx.beginPath();
          ctx.arc(tx, ty, size * (0.85 - k * 0.11), 0, Math.PI * 2);
          ctx.fillStyle = hexA(st.color, al);
          ctx.fill();
        }
      }

      /* ---- 闪电：特斯拉电塔 / 脉冲塔 / 大电塔
       * 大电塔的第 2、3 道闪电，起点是上一个敌人（见逻辑层 chain），
       * 所以这里画出来天然就是"敌人 → 敌人"的连锁电弧。 */
      if (st.type === 'volt') {
        /* ---- 闪电要「贴着」移动中的敌人 ----
         * 逻辑层的 p.to 是格坐标，敌人格内移动（moveProg 插值）时只有跨格才跳变，
         * 所以闪电会打在「格心」而不是「人身上」。
         * 这里改按目标的**亚格精度实时位置**取两端：
         *   · 终点 → targetId 的实时插值位置
         *   · 起点 → 链式闪电的 fromUnitId（上一环那个还在移动的敌人）实时位置
         * 敌人都还在就用实时值，否则退回开火时记录的格坐标。 */
        var vx0 = x0, vy0 = y0, vx1 = x1, vy1 = y1;
        var vt = unitById(p.targetId);
        if (vt) { var vc = liveUnitCenter(vt); if (vc) { vx1 = vc.x; vy1 = vc.y; } }
        if (p.fromUnitId) {
          var vf = unitById(p.fromUnitId);
          if (vf) { var vf2 = liveUnitCenter(vf); if (vf2) { vx0 = vf2.x; vy0 = vf2.y; } }
        }
        drawVoltBolt(vx0, vy0, vx1, vy1, st.color || '#8ff0e0', size, p.id || 1, now);
        return;
      }

      ctx.save();
      if (st.type === 'arrow' || st.type === 'bolt') {
        /* ---- 箭矢：细长杆 + 两片箭羽 + 尖箭头（箭塔射的是箭，不是炮弹） */
        var adx = (x1 - x0), ady = (y1 - y0);
        var alen0 = Math.max(1, Math.hypot(adx, ady));
        var aux = adx / alen0, auy = ady / alen0;
        var avx = -auy, avy = aux;
        var alen = size * (st.type === 'bolt' ? 4.2 : 3.6);
        // 箭杆
        ctx.strokeStyle = '#c8a870';
        ctx.lineWidth = Math.max(1.4, size * 0.34);
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(ix - aux * alen, iy - auy * alen);
        ctx.lineTo(ix + aux * size * 0.26, iy + auy * size * 0.26);
        ctx.stroke();
        // 箭羽 ×2
        ctx.fillStyle = st.color;
        for (var fw = -1; fw <= 1; fw += 2) {
          ctx.beginPath();
          ctx.moveTo(ix - aux * alen, iy - auy * alen);
          ctx.lineTo(ix - aux * alen * 0.60 + avx * fw * size * 0.62,
                     iy - auy * alen * 0.60 + avy * fw * size * 0.62);
          ctx.lineTo(ix - aux * alen * 0.48, iy - auy * alen * 0.48);
          ctx.closePath(); ctx.fill();
        }
        // 箭头
        var atx = ix + aux * size * 0.76, aty = iy + auy * size * 0.76;
        ctx.beginPath();
        ctx.moveTo(atx, aty);
        ctx.lineTo(ix - aux * size * 0.22 + avx * size * 0.46,
                   iy - auy * size * 0.22 + avy * size * 0.46);
        ctx.lineTo(ix - aux * size * 0.22 - avx * size * 0.46,
                   iy - auy * size * 0.22 - avy * size * 0.46);
        ctx.closePath();
        ctx.fillStyle = '#eafbd8'; ctx.fill();
        ctx.strokeStyle = 'rgba(40,60,30,.55)'; ctx.lineWidth = 1; ctx.stroke();
      } else if (st.type === 'shell') {
        /* ---- 迫击炮弹：高高抛上天 → 砸下来 → 范围爆炸
         *      落点有虚线预警圈 + 十字准星，越接近落地越亮 */
        var aoe = st.aoe || 0;
        var aoePx = (aoe + 0.5) * b.s;
        var warnA = 0.30 + 0.60 * t;

        ctx.beginPath();
        ctx.ellipse(x1, y1, aoePx, aoePx * 0.56, 0, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,150,80,' + (0.05 + 0.11 * t) + ')';
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,182,112,' + warnA + ')';
        ctx.lineWidth = 2;
        ctx.setLineDash([5, 4]);
        ctx.stroke();
        ctx.setLineDash([]);

        var cbx = aoePx * 0.88, cby = aoePx * 0.50;
        ctx.strokeStyle = 'rgba(255,204,148,' + (0.20 + 0.55 * t) + ')';
        ctx.lineWidth = 1.6;
        ctx.beginPath();

      var dy = (ac.y + ac.s / 2) - cy;

   * 这个换算是把两个方向相反的错误值都推掉的依据：
   *   k=1.5 → 每格仅 ≈18 根（稀疏的塑料草茎）；k=0.55 → ≈137 根（越界、糊成噪点）。
   * 缩小后纹理更细、感知对比下降，所以 overlay α 补到 0.40（0.36 → 0.40）。
   * L4 = 0.75 × 0.62 = 0.47，保持与主贴图的相对错位。 */
  var TEX_L3_SCALE = 0.75, TEX_L4_SCALE = 0.47;
  var bgBuilds = 0, bgBuildMs = 0;      // 只供 __game.bgStats() 读（美术规范 B6 性能预算验收）
  /* 贴图就绪检查：拿到 tex_grass.png 就让背景板重建一次（bgKey 置空 → 下次构建必跑）。
   * 抽成函数是为了可测（headless 下 rAF 不跑，测不到的时序等于没验证）。 */
  function syncGrassTexture() {
    if (!bgTexPending || !ART.img(GRASS_TEX)) return false;
    bgTexPending = false;
    bgKey = '';
    buildBackground();
    return true;
  }
  function buildBackground() {
    var dpr = window.devicePixelRatio || 1;
    var W = canvas.clientWidth, H = canvas.clientHeight;
    var s = layout.cell;
    var key = [W, H, s, layout.ox, layout.oy, dpr, FLIP ? 1 : 0, ME, PVP.active ? 1 : 0].join(',');
    if (bgKey === key && bgCanvas) return;
    bgKey = key;
    var tBuild = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var c = document.createElement('canvas');
    c.width = Math.max(1, Math.floor(W * dpr));
    c.height = Math.max(1, Math.floor(H * dpr));
    var g = c.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);

    var BW = s * C.COLS, BH = s * (C.ROWS + 2);
    var bx = layout.ox, by = layout.oy;

    /* ---- 画布外：深色氛围 ---- */
    var sky = g.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#18241c');
    sky.addColorStop(0.55, '#121a14');
    sky.addColorStop(1, '#0c110d');
    g.fillStyle = sky;
    g.fillRect(0, 0, W, H);
    // 棋盘上方的柔和光晕（像 arena 灯）
    var glow = g.createRadialGradient(bx + BW / 2, by + BH / 2, 10, bx + BW / 2, by + BH / 2, Math.max(BW, BH) * 0.75);
    glow.addColorStop(0, 'rgba(150,190,120,.13)');
    glow.addColorStop(0.5, 'rgba(120,160,110,.06)');
    glow.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = glow;
    g.fillRect(0, 0, W, H);
    // 四角压暗
    var vig = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.78);
    vig.addColorStop(0, 'rgba(0,0,0,0)');
    vig.addColorStop(1, 'rgba(0,0,0,.52)');
    g.fillStyle = vig;
    g.fillRect(0, 0, W, H);

    /* ---- 棋盘软投影 ---- */
    g.save();
    g.shadowColor = 'rgba(0,0,0,.6)';
    g.shadowBlur = Math.max(10, s * 0.5);
    g.shadowOffsetY = Math.max(3, s * 0.12);
    g.fillStyle = '#000';
    g.fillRect(bx - 2, by - 2, BW + 4, BH + 4);
    g.restore();

    /* ---- 棋盘格盘：L0–L8 草地分层（规范 docs/art/icons-and-grass.md §B3） ----
     * 层次顺序不可调：L0 底色 → L1 光楔 → L2 簇斑 → L3/L4 贴图 → L5 草尖 → L6 微点
     *                 → L7 阵营色调 → L8 雕刻格线（可读性的保险，永远最后）
     * 全部在离屏画布内跑一次，render() 里只有一个 drawImage —— 游戏循环内草地开销为 0。
     * 改这里的任何一层，都要回 B8 验收（尤其 B8-2 格线 ΔL* ≥ 14，最容易失守）。
     */
    /* v2 色板（§B2）：暖 #60A246 / 冷 #4C8850，Lab L* 60.6 / 51.5 → ΔL*=9.1。
     * v1 的 #6EA94D/#4C7F4E 是 ΔL*=14.9（旧版 7.6 的两倍），棋盘台阶被无意翻倍 →
     * 读成「铺装砖」，草只是砖上的花纹。v2 的 ΔL* 与旧版同级，整盘均值仍是 56.05。
     * 6 个变体按 (row,col) 哈希取，抖动幅度 L*±1.5 / S±3pp / H±2°（不做实时 HSL 运算）。 */
    var GRASS_W = ['#60A246', '#62A448', '#5E9F44', '#64A74B', '#5C9C42', '#61A347'];  // 暖格
    var GRASS_C = ['#4C8850', '#4E8B53', '#4A854D', '#508E55', '#488249', '#4D8A51'];  // 冷格
    var DIRT_A = '#a5845a', DIRT_B = '#8e7350';                                       // 通道（土路）
    /* 自适应密度（§B3 表）：格子小于 20px 时草尖不足 4px，画出来只会是脏点，整层跳过 */
    var dense = s >= 32 ? { dark: 6, light: 3, tips: 20, dots: 24 }
              : s >= 20 ? { dark: 6, light: 3, tips: 12, dots: 18 }
              : { dark: 3, light: 0, tips: 0, dots: 10 };
    /* 可复现哈希：同一 (row,col) 永远长同一撮草，避免每次 resize 换脸 */
    function h2(row, col, salt) {
      var v = (row * 73856093) ^ (col * 19349663) ^ (salt * 83492791);
      v = (v ^ (v >>> 13)) * 1274126177;
      return ((v ^ (v >>> 16)) >>> 0) / 4294967296;
    }
    /* 软边椭圆斑（L2）：径向渐变从实色收到「同色全透明」。
     * 不能收到 rgba(0,0,0,0) —— 那会朝透明黑插值，边缘发灰发脏。
     * v2 两条硬规则（§B3）：
     *   ① 必须有平台段（0→0.45 同色）：纯径向衰减的平均贡献只有峰值 α 的 1/3，α=0.10 等于没画；
     *   ② 圆斑=石头，拉长+旋转=草丛：ry/rx 取 0.35–0.60，且逐斑旋转（由调用方给 ang）。 */
    function softBlob(cx, cy, rx, ry, hex, alpha, ang) {
      var cr = parseInt(hex.slice(1, 3), 16), cg = parseInt(hex.slice(3, 5), 16), cb = parseInt(hex.slice(5, 7), 16);
      var grd = g.createRadialGradient(0, 0, 0, 0, 0, rx);
      grd.addColorStop(0, hex);
      grd.addColorStop(0.45, hex);
      grd.addColorStop(1, 'rgba(' + cr + ',' + cg + ',' + cb + ',0)');
      g.save();
      g.globalAlpha = alpha;
      g.translate(cx, cy);
      if (ang) g.rotate(ang);
      g.scale(1, ry / rx);
      g.fillStyle = grd;
      g.beginPath(); g.arc(0, 0, rx, 0, Math.PI * 2); g.fill();
      g.restore();
    }

    /* ===== L0 底色双色格：暖/冷分离（ΔH 23.9°），不靠拉大明度差 ===== */
    var row, col, x, y, chan, odd;
    for (row = 0; row <= C.ROWS + 1; row++) {
      for (col = 1; col <= C.COLS; col++) {
        x = bx + (col - 1) * s; y = by + row * s;
        chan = (row === 0 || row === C.ROWS + 1);
        odd = (row + col) % 2 === 1;
        if (chan) {
          g.fillStyle = odd ? DIRT_B : DIRT_A;
        } else {
          var pal = odd ? GRASS_C : GRASS_W;
          g.fillStyle = pal[Math.floor(h2(row, col, 1) * pal.length)];
        }
        g.fillRect(x, y, s, s);
      }
    }

    /* ===== L1 大尺度光楔：3 个全盘级渐变（不是每格），把「印刷棋盘感」打散 ===== */
    g.save();
    g.beginPath(); g.rect(bx, by, BW, BH); g.clip();
    var w1 = g.createLinearGradient(0, by, 0, by + BH * 0.45);
    w1.addColorStop(0, 'rgba(214,255,170,.10)'); w1.addColorStop(1, 'rgba(214,255,170,0)');
    g.fillStyle = w1; g.fillRect(bx, by, BW, BH);
    var w2 = g.createLinearGradient(0, by + BH * 0.55, 0, by + BH);
    w2.addColorStop(0, 'rgba(20,40,20,0)'); w2.addColorStop(1, 'rgba(20,40,20,.18)');
    g.fillStyle = w2; g.fillRect(bx, by, BW, BH);
    var w3 = g.createRadialGradient(bx + BW * 0.28, by + BH * 0.22, 0, bx + BW * 0.28, by + BH * 0.22, BW * 0.78);
    w3.addColorStop(0, 'rgba(230,255,190,.09)'); w3.addColorStop(1, 'rgba(230,255,190,0)');
    g.fillStyle = w3; g.fillRect(bx, by, BW, BH);
    g.restore();

    /* ===== L2 草簇斑块：立体感的唯一来源（暗斑定结构、亮斑给受光） ===== */
    /* 通道行也参与同一套分层，但配色改土色系 —— 往土路上压绿斑只会变泥浆 */
    var DARK_G = ['#2C5222', '#35602A'], LIGHT_G = ['#86C46A', '#9AD37B'];
    var DARK_D = ['#6b4f2a', '#7a5c33'], LIGHT_D = ['#c9a06a', '#d8b783'];
    /* 通道行的砂砾噪点：makeNoiseTile 保留下来正是为了这条降级路径（贴图缺失也不至于秃） */
    var noiseDirt = makeNoiseTile(13, ['#6b4f2a', '#c9a06a', '#4e3818', '#e0c088'], 0.45);
    var dirtPat = g.createPattern(noiseDirt, 'repeat');
    for (row = 0; row <= C.ROWS + 1; row++) {
      for (col = 1; col <= C.COLS; col++) {
        x = bx + (col - 1) * s; y = by + row * s;
        chan = (row === 0 || row === C.ROWS + 1);
        odd = (row + col) % 2 === 1;
        var dk = chan ? DARK_D : DARK_G, lt = chan ? LIGHT_D : LIGHT_G;
        for (var bi = 0; bi < dense.dark + dense.light; bi++) {
          var isLight = bi >= dense.dark;
          /* v2（§B3 L2）：rx 砍一半 + 椭圆更扁长 + 逐斑旋转 → 从「4~6 颗卵石」变成「草丛」。
           * v1 的 rx 0.16–0.34s、ry/rx 0.55–0.80（近圆且覆盖半格）是「读成铺装砖」的第一贡献者。 */
          var brx = s * (0.10 + h2(row, col, 20 + bi) * 0.10);            // 0.10–0.20s
          var bry = brx * (0.35 + h2(row, col, 40 + bi) * 0.25);          // 0.35–0.60 rx（扁长）
          var bcx = x + s * 0.5 + (h2(row, col, 60 + bi) - 0.5) * 0.76 * s;
          var bcy = y + s * 0.5 + (h2(row, col, 80 + bi) - 0.5) * 0.76 * s;
          var ba = isLight ? (0.14 + h2(row, col, 100 + bi) * 0.08)       // 亮 0.14–0.22
                           : (0.16 + h2(row, col, 100 + bi) * 0.12);      // 暗 0.16–0.28
          if (odd) ba += isLight ? -0.02 : 0.02;                  // 冷格：暗更暗、亮更收
          var bang = (20 + h2(row, col, 140 + bi) * 50) * Math.PI / 180;  // 逐斑旋转 20°–70°
          var arr2 = isLight ? lt : dk;
          softBlob(bcx, bcy, brx, bry, arr2[Math.floor(h2(row, col, 120 + bi) * arr2.length)], ba, bang);
        }
        /* 通道行：保留旧砂砾噪点（pattern 在循环外只建一次，这里只是逐格贴） */
        if (chan && dirtPat) {
          g.save(); g.globalAlpha = 0.5; g.fillStyle = dirtPat; g.fillRect(x, y, s, s); g.restore();
        }
      }
    }

    /* ===== L3 / L4 草叶贴图（异步资产；缺失时自动降级，仅少掉笔触簇团感） ===== */
    var grassTex = ART.img(GRASS_TEX);
    if (grassTex && typeof g.createPattern === 'function') {
      var yChanTop = by, hChan = s;
      var yMid = by + s, hMid = s * C.ROWS;          // 行1~10 的草地主体
      var yChanBot = by + (C.ROWS + 1) * s;
      /* L3 主贴图：overlay .34，**绘制尺度 0.55**（规范 §B5 v2）。
       * 尺度语义：0.55 = 把 512 源图缩小到 55% 铺，屏幕周期 282px，棋盘 300–560px
       * → 整盘只看到 1.1–2.0 次重复，随机纹理的重复不可辨。
       * 为什么不再是 2.2：2.2 是为 ImageGen「蕨团图」补细节用的；那套图内容本身是
       * 「每格 1 团的宽叶蕨」，放大只会放大石头感。v2 换成程序化细叶图（叶长 7–17px），
       * 44px 格里能数出 40–90 根细叶，不需要放大。 */
      var pat3 = g.createPattern(grassTex, 'repeat');
      if (pat3 && pat3.setTransform && typeof DOMMatrix === 'function') {
        try { pat3.setTransform(new DOMMatrix().scale(TEX_L3_SCALE, TEX_L3_SCALE)); } catch (e) {}
      } else if (pat3 && typeof pat3.setTransform !== 'function') {
        /* 不支持 pattern 变换的旧引擎：退回 1:1，宁可纹理小也不要不画 */
      }
      if (pat3) {
        g.save();
        g.globalCompositeOperation = 'overlay';
        g.fillStyle = pat3;
        g.globalAlpha = 0.40;
        g.fillRect(bx, yMid, BW, hMid);
        g.globalAlpha = 0.40 * 0.6;                  // 通道行 α×0.6：土路上只露一点草根
        g.fillRect(bx, yChanTop, BW, hChan);
        g.fillRect(bx, yChanBot, BW, hChan);
        g.restore();
      }
      /* L4 次贴图：同一张图换尺度/相位/旋转（0.34 = 0.55×0.62，保持与 v1 相同的相对错位），
       * 语义是「更低频的错位层」，打散 L3 的重复感；0.22 的 soft-light 只做厚薄不均。 */
      if (typeof DOMMatrix === 'function') {
        var pat4 = g.createPattern(grassTex, 'repeat');
        if (pat4 && pat4.setTransform) {
          try {
            pat4.setTransform(new DOMMatrix().translate(bx - 97, by - 141).rotate(17).scale(TEX_L4_SCALE, TEX_L4_SCALE));
            g.save();
            g.globalCompositeOperation = 'soft-light';
            g.fillStyle = pat4;
            g.globalAlpha = 0.20;
            g.fillRect(bx, yMid, BW, hMid);
            g.globalAlpha = 0.20 * 0.6;
            g.fillRect(bx, yChanTop, BW, hChan);
            g.fillRect(bx, yChanBot, BW, hChan);
            g.restore();
          } catch (e) { /* setTransform 不被支持 → 静默降级为只有 L3 */ }
        }
      }
    } else {
      bgTexPending = true;                            // 贴图还没加载好，等它到了再重建一次
    }

    /* ===== L5 受光草尖：二次贝塞尔叶片（直线画出来像胡茬，这是「草」与「毛」的分界） ===== */
    if (dense.tips > 0) {
      g.save();
      g.globalCompositeOperation = 'lighter';
      g.lineCap = 'round';
      g.lineWidth = Math.max(0.8, s * 0.030);
      for (row = 1; row <= C.ROWS; row++) {
        for (col = 1; col <= C.COLS; col++) {
          x = bx + (col - 1) * s; y = by + row * s;
          var coldCell = (row + col) % 2 === 1;
          for (var ti = 0; ti < dense.tips; ti++) {
            var tx = x + h2(row, col, 300 + ti) * s * 0.78;      // 权重偏向格子左上 65%
            var ty = y + (0.10 + h2(row, col, 340 + ti) * 0.85) * s;
            /* 长度三档混合（短 40% / 中 40% / 长 20%）：全部等长会画成「刷子」。
             * 上限 0.18s：0.24s 在 cell 44 是 10.5px，已撞 C3「单叶屏显 5–11px」的天花板，
             * 超过就变成一撮撮长毛，反而更像纤维丝不像草。 */
            var tier = h2(row, col, 380 + ti);
            var len = s * (tier < 0.40 ? (0.06 + h2(row, col, 390 + ti) * 0.03)    // 0.060–0.090
                        : tier < 0.80 ? (0.09 + h2(row, col, 390 + ti) * 0.045)    // 0.090–0.135
                        : (0.13 + h2(row, col, 390 + ti) * 0.05));                 // 0.130–0.180
            /* 方向：以「竖直向上」(−90°) 为中心 ±70° 扇形散开（140° 跨度，不是全向）。
             * 旧版 11 根全落右上 26°–53° 一个象限 —— 同向短划读成「斜雨」，这是草叶感的机制性杀手。 */
            var ra = (-90 + (h2(row, col, 700 + ti) * 2 - 1) * 70) * Math.PI / 180;
            var ex = Math.cos(ra) * len, ey = Math.sin(ra) * len;
            var bend = (h2(row, col, 760 + ti) - 0.5) * 0.55 * len;   // 侧向弯，草叶不是竹签
            g.beginPath();
            g.moveTo(tx, ty);
            g.quadraticCurveTo(tx + ex * 0.50 - Math.sin(ra) * bend,
                               ty + ey * 0.50 + Math.cos(ra) * bend,
                               tx + ex, ty + ey);
            g.strokeStyle = h2(row, col, 420 + ti) < 0.5 ? '#B9DF8C' : '#D3EFA4';
            /* α 上限 0.22→0.18：配贴图受光层占比 0.20→0.34 后，贴图自己已经够亮，
             * 画布这层再压到 0.22 会叠成「亮片」。两边一起抬亮是这次踩的坑。 */
            g.globalAlpha = (0.09 + h2(row, col, 460 + ti) * 0.09) * (coldCell ? 0.7 : 1);
            g.stroke();
          }
        }
      }
      g.restore();
    }

    /* ===== L6 微噪点：打散色带 / 防 banding（每格 24 点，旧版等效 80+） ===== */
    for (row = 0; row <= C.ROWS + 1; row++) {
      for (col = 1; col <= C.COLS; col++) {
        x = bx + (col - 1) * s; y = by + row * s;
        for (var di = 0; di < dense.dots; di++) {
          g.fillStyle = h2(row, col, 500 + di) < 0.5 ? '#24461C' : '#A8D887';
          g.globalAlpha = 0.05 + h2(row, col, 560 + di) * 0.04;
          g.fillRect(x + h2(row, col, 620 + di) * s, y + h2(row, col, 680 + di) * s, 1, 1);
        }
      }
    }
    g.globalAlpha = 1;

    /* ===== L7 阵营色调：soft-light 吃色相不动明度，红蓝分区更清楚又不压暗棋盘 =====
     * v21：镜像视角下红蓝两半在屏幕上对调 —— 色调必须跟着走，
     * 否则红方玩家会发现自己脚下这片草是红的（自己家被涂成敌方色，最刺眼的一类 bug）。 */
    g.save();
    g.globalCompositeOperation = 'soft-light';
    var yRedBand = FLIP ? (by + s * 6) : (by + s);      // 屏幕上红半场的起始 y
    var yBlueBand = FLIP ? (by + s) : (by + s * 6);     // 屏幕上蓝半场的起始 y
    g.fillStyle = 'rgba(232,96,64,.10)';  g.fillRect(bx, yRedBand, BW, s * 5);     // 红方 5 行
    g.fillStyle = 'rgba(70,130,255,.11)'; g.fillRect(bx, yBlueBand, BW, s * 5);    // 蓝方 5 行
    g.restore();

    /* ===== L8 雕刻格线：暗槽 + 亮棱错开 1px =====
     * 人眼对「阶跃」敏感、对单条半透明线不敏感。凹槽给出两个方向相反的微台阶，
     * 在纹理噪声上的辨识度远高于单线 —— 观感上也像「草被压出来的碾痕」。 */
    g.save();
    g.beginPath(); g.rect(bx, by, BW, BH); g.clip();
    g.lineWidth = 1;
    var r2, c2, gy;
    for (r2 = 0; r2 <= C.ROWS + 2; r2++) {
      gy = by + r2 * s;
      g.strokeStyle = 'rgba(10,24,12,.52)';
      g.beginPath(); g.moveTo(bx, gy + .5); g.lineTo(bx + BW, gy + .5); g.stroke();
      g.strokeStyle = 'rgba(216,244,186,.30)';
      g.beginPath(); g.moveTo(bx, gy + 1.5); g.lineTo(bx + BW, gy + 1.5); g.stroke();
    }
    for (c2 = 0; c2 <= C.COLS; c2++) {
      g.strokeStyle = 'rgba(10,24,12,.52)';
      g.beginPath(); g.moveTo(bx + c2 * s + .5, by); g.lineTo(bx + c2 * s + .5, by + BH); g.stroke();
      g.strokeStyle = 'rgba(216,244,186,.30)';
      g.beginPath(); g.moveTo(bx + c2 * s + 1.5, by); g.lineTo(bx + c2 * s + 1.5, by + BH); g.stroke();
    }
    g.restore();
    // 半场中线（红蓝分界，行5/行6 之间）：暗槽更重 + 下方 1px 亮棱
    var midY = by + 6 * s;
    /* 换 v2 细叶贴图 + 新色板后中线掉到 17.0（要求 ≥18）：贴图把中线两侧的明度拉平了。
     * 不能靠加宽（3px 已是 6px 格距的 1/2，再加宽会读成一条路），只能加深。 */
    g.fillStyle = 'rgba(12,26,14,.74)';
    g.fillRect(bx, midY - 1.5, BW, 3);
    g.fillStyle = 'rgba(255,244,214,.34)';
    g.fillRect(bx, midY + 1.5, BW, 1);

    // 通道标签（深色药片底 + 米色字）
    function chanLabel(row, text, tip) {
      var y = by + vRow(row) * s;          // v21：镜像视角下行 0 与行 11 互换
      g.font = '600 ' + Math.max(9, s * 0.30) + 'px "PingFang SC","Microsoft YaHei",sans-serif';
      // measureText 在无画布环境（测试桩）下可能不可用 → 按字数估算回退
      function textW(t) {
        var m = g.measureText(t);
        var w = m && m.width;
        return (typeof w === 'number' && isFinite(w)) ? w : t.length * s * 0.17;
      }
      var w1 = textW(text);
      var w2 = tip ? textW(tip) : 0;
      var pad = s * 0.18, total = w1 + (tip ? w2 + s * 0.22 : 0) + pad * 2;
      var px = bx + s * 0.25, py = y + s * 0.5;
      g.fillStyle = 'rgba(10,14,10,.48)';   // 草地变亮后药片标签需要更强的底（+.06，规范 §B3 L8）
      g.beginPath();
      var rh = s * 0.52, rr = rh / 2;
      g.moveTo(px + rr, py - rh / 2);
      g.arcTo(px + total, py - rh / 2, px + total, py + rh / 2, rr);
      g.arcTo(px + total, py + rh / 2, px, py + rh / 2, rr);
      g.arcTo(px, py + rh / 2, px, py - rh / 2, rr);
      g.arcTo(px, py - rh / 2, px + total, py - rh / 2, rr);
      g.closePath();
      g.fill();
      g.textBaseline = 'middle'; g.textAlign = 'left';
      g.fillStyle = '#e8ddc0';
      g.fillText(text, px + pad, py + 0.5);
      if (tip) {
        g.fillStyle = 'rgba(232,221,192,.62)';
        g.fillText(tip, px + pad + w1 + s * 0.22, py + 0.5);
      }
    }
    /* v21：标签文案按「谁在用这条通道」给，不按行号写死 ——
     * 镜像视角下我方通道永远在屏幕最底下（行 11），字却要写"蓝方通道"。
     * 单人局对手是电脑、双人局是对手，副标题随之区分。 */
    chanLabel(C.CHANNEL_ROW[ME], '行B · 蓝方通道', '点这里派兵');
    chanLabel(C.CHANNEL_ROW[FOE], '行A · 红方通道', PVP.active ? '对手出兵走这里' : '电脑出兵走这里');

    /* ---- 棋盘外框 ---- */
    g.strokeStyle = 'rgba(10,22,12,.9)';
    g.lineWidth = 2;
    g.strokeRect(bx - 1, by - 1, BW + 2, BH + 2);
    g.strokeStyle = 'rgba(255,255,255,.07)';
    g.lineWidth = 1;
    g.strokeRect(bx + 0.5, by + 0.5, BW - 1, BH - 1);

    bgCanvas = c;
    bgBuilds++;
    if (tBuild) bgBuildMs = performance.now() - tBuild;
  }

  function render() {
    if (!state) return;
    var dpr = window.devicePixelRatio || 1;
    var W = canvas.clientWidth, H = canvas.clientHeight;
    if (canvas.width !== Math.floor(W * dpr) || canvas.height !== Math.floor(H * dpr)) {
      canvas.width = Math.floor(W * dpr); canvas.height = Math.floor(H * dpr);
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    computeLayout();
    var s = layout.cell;

    // 1 地面 / 背景板（预渲染，尺寸不变不重画）
    buildBackground();
    if (bgCanvas) ctx.drawImage(bgCanvas, 0, 0, W, H);

    // 1.2 脉冲塔的电磁波：画在地面之上、建筑和单位之下（它是贴地的冲击波）
    drawWaves();

    // 1.5 放置提示 / 法术范围预览
    if (sel && !state.over) {
      if (sel.kind === 'building') {
        for (var hr = 1; hr <= C.ROWS; hr++) {
          for (var hc = 1; hc <= C.COLS; hc++) {
            if (!C.canPlace(state, ME, sel.key, hr, hc).ok) continue;
            var q = cellRect(hr, hc);
            ctx.fillStyle = 'rgba(110,220,140,.20)';
            ctx.fillRect(q.x, q.y, s, s);
          }
        }
      } else if (sel.kind === 'unit') {
        for (var dc2 = 1; dc2 <= C.COLS; dc2++) {
          if (!C.canDeploy(state, ME, sel.key, dc2).ok) continue;
          var q2 = cellRect(C.CHANNEL_ROW[ME], dc2);
          ctx.fillStyle = 'rgba(110,200,255,.30)';
          ctx.fillRect(q2.x, q2.y, s, s);
        }
      }
      if (sel.kind === 'spell') {
        // 法术落点：把所有可放格子淡淡标出来
        var sp = null;
        C.DATA.spells.forEach(function (x) { if (x.key === sel.key) sp = x; });
        if (sp) {
          for (var sr = 1; sr <= C.ROWS; sr++) {
            for (var sc = 1; sc <= C.COLS; sc++) {
              if (!C.canCastSpell(state, ME, sel.key, sr, sc).ok) continue;
              var q3 = cellRect(sr, sc);
              ctx.fillStyle = 'rgba(255,190,110,.10)';
              ctx.fillRect(q3.x, q3.y, s, s);
            }
          }
        }
      }
    }

    /* ---- 法术：落点范围 + 图标降临 + 命中特效 ----
     * 时间轴（单次施法总长 0.9s）：
     *   0 ~ 0.30   图标从上方 1.4 格处落向落点，由小放大（0.55 → 1.30）
     *   0.30 ~ 0.75  伤害类接 4 帧爆炸；增益类只剩图标脉冲
     *   0 ~ 0.55   范围圈快速扩散后淡出，颜色取法术自身颜色
     */
    var DMG_SPELLS = { arrowRain: 1, fireball: 1, rocket: 1 };
    for (var ei = state.events.length - 1, shown = 0; ei >= 0 && shown < 3; ei--) {
      var ev = state.events[ei];
      if (ev.type !== 'spell') continue;
      shown++;
      var age = state.time - ev.t;
      if (age < 0 || age > 0.9) continue;

      var c0 = cellRect(ev.row, ev.col);
      var ecx = c0.x + s / 2, ecy = c0.y + s / 2;
      var spel = null;
      C.DATA.spells.forEach(function (x) { if (x.key === ev.key) spel = x; });
      var spcol = (spel && spel.color) || '#ffc878';
      var srad = (ev.radius + 0.5) * s;

      // 范围圈：扩散 + 淡出
      var rp = Math.min(1, age / 0.55);
      ctx.strokeStyle = hexA(spcol, 0.9 * (1 - rp));
      ctx.lineWidth = 1 + 3 * (1 - rp);
      ctx.beginPath();
      ctx.arc(ecx, ecy, srad * (0.55 + rp * 0.55), 0, Math.PI * 2);
      ctx.stroke();
      // 圈内柔光（贴地，所以压扁成椭圆）
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.32 * (1 - rp);
      ctx.fillStyle = spcol;
      ctx.beginPath();
      ctx.ellipse(ecx, ecy, srad * 0.92, srad * 0.50, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // 图标降临（用普通混合：图标有暗色描边，叠加会被吃掉）
      if (age < 0.60) {
        var kd = Math.min(1, age / 0.30);
        var dropY = ecy - (1 - kd) * s * 1.4;
        var sc = 0.55 + kd * 0.75;
        var ia = age < 0.42 ? 1 : Math.max(0, 1 - (age - 0.42) / 0.18);
        /* 1.55 倍会让图标涨到 2 格宽，在棋盘上显得像贴纸；1.20 倍约 1.4 格刚好 */
        ART.drawFx('spell_' + ev.key, ecx, dropY, s * 1.20 * sc, ia, 0, 'source-over');
      }
      // 伤害类：落地爆炸（复用爆炸 4 帧）
      if (DMG_SPELLS[ev.key] && age > 0.30) {
        var bf = Math.min(0.999, (age - 0.30) / 0.45);
        var bi = Math.min(3, Math.floor(bf * 4));
        ART.drawFx('fx_boom_' + (bi + 1), ecx, ecy, srad * 2.15, 1 - bf * 0.30, 0);
      }

      // 增益类：登记一个持续领域（渲染层地面光环，直到法术结束）
      if (!ev._zoned && !DMG_SPELLS[ev.key] && age < 0.5) {
        ev._zoned = true;
        var zdur = ev.key === 'rage' ? 8 : (ev.key === 'freeze' ? 4 : 5);
        spellZones.push({ row: ev.row, col: ev.col, radius: ev.radius, kind: ev.key, t0: ev.t, dur: zdur });
      }
    }

    // 增益领域（画在建筑之下，贴地）
    drawSpellZones(s);

    // 2 建筑
    state.buildings.forEach(function (b) {
      var r = cellRect(b.row, b.col, b.def.size[0], b.def.size[1]);
      var w = s * b.def.size[1], h = s * b.def.size[0];
      var hurt = (state.time - (b.justDamaged || -99)) < 0.18;
      var color = b.def.color;
      var name = b.def.name;
      if (b.branch && C.branches[b.branch]) { color = C.branches[b.branch].color; name = C.branches[b.branch].name; }

      /* 优先用 v9 贴图（底座 + 装饰件）；贴图没加载好就退回原来的纯色方块 + 汉字 */
      var drewSprite = ART.drawBase(b, r, w, h);
      if (drewSprite) {
        ART.drawDeco(b, r, w, h);
      } else {
        ctx.fillStyle = hurt ? '#ffffff' : color;
        drawRoundRect(r.x + 1, r.y + 1, w - 2, h - 2, 3);
        ctx.fill();
        // 有炮口的建筑：汉字缩小并移到下方，把中央让给旋转炮口
        var hasTurret = b.def.isBase || (b.def.atk && b.def.atk > 0);
        ctx.fillStyle = hurt ? 'rgba(0,0,0,.55)' : 'rgba(0,0,0,.38)';
        ctx.font = 'bold ' + Math.max(9, s * (hasTurret ? 0.27 : 0.40)) + 'px sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(b.def.glyph, r.x + w / 2, r.y + h / 2 + (hasTurret ? s * 0.29 : -s * 0.08));
      }
      // 受击闪白：贴图模式下也要有反馈，用一层半透明白盖上去
      if (drewSprite && hurt) {
        ctx.save();
        ctx.globalAlpha = 0.55;
        ctx.fillStyle = '#ffffff';
        drawRoundRect(r.x + 1, r.y + 1, w - 2, h - 2, 3);
        ctx.fill();
        ctx.restore();
      }
      // 冰冻/弱化的视觉标记
      if (b.frozenUntil && state.time < b.frozenUntil) { ctx.fillStyle = 'rgba(160,230,255,.45)'; ctx.fillRect(r.x + 1, r.y + 1, w - 2, h - 2); }
      else if (b.weakenUntil && state.time < b.weakenUntil) { ctx.fillStyle = 'rgba(200,150,220,.35)'; ctx.fillRect(r.x + 1, r.y + 1, w - 2, h - 2); }
      else if (b.rageUntil && state.time < b.rageUntil) { ctx.fillStyle = 'rgba(255,210,120,.35)'; ctx.fillRect(r.x + 1, r.y + 1, w - 2, h - 2); }

      // 建筑自愈：停火期结束、正在回血时，塔身周期性地刷一层淡绿治疗光
      var healCfg = b.def.isBase ? C.DATA.selfHeal : C.DATA.buildingSelfHeal;
      if (b.hp < b.hpMax &&
          (state.time - (b.justDamaged != null ? b.justDamaged : -999)) >= (healCfg ? healCfg.delay : 8)) {
        var healPhase = state.time % 0.9;
        if (healPhase < 0.4) {
          ART.drawFx('fx_heal_1', r.x + w / 2, r.y + h / 2 - s * 0.08,
                     s * 0.9, 0.55 - healPhase * 1.15, 0);
        }
      }

      // ★ 跟着目标旋转的炮口
      drawBuildingTurret(b, r, w, h, s);

      ctx.fillStyle = '#ffd479';
      ctx.font = 'bold ' + Math.max(8, s * 0.26) + 'px sans-serif';
      ctx.textAlign = 'left'; ctx.textBaseline = 'top';
      ctx.fillText('Lv' + (b.level || 1), r.x + 3, r.y + 2);
      if (b.dr > 0) {   // 有防御塔加护
        ctx.strokeStyle = 'rgba(140,220,255,.75)'; ctx.lineWidth = 1.5;
        ctx.strokeRect(r.x + 2, r.y + 2, w - 4, h - 4);
      }
      var ratio = Math.max(0, b.hp / b.hpMax);
      if (ratio < 0.999 || hurt) {
        var bw = w - 4;
        ctx.fillStyle = 'rgba(0,0,0,.72)';
        ctx.fillRect(r.x + 2, r.y + h - 5, bw, 4);
        ctx.fillStyle = ratio > .5 ? '#54d96b' : ratio > .25 ? '#ffcc44' : '#ff5f5f';
        ctx.fillRect(r.x + 2, r.y + h - 5, bw * ratio, 4);
      }
      if (selectedBuilding === b) {
        ctx.strokeStyle = '#6fd3ff'; ctx.lineWidth = 2;
        ctx.strokeRect(r.x + 1, r.y + 1, w - 2, h - 2);
      }
    });

    // 3.6 鼠标悬停时的「作用范围预览」（放置建筑 / 施放法术时跟着鼠标走）
    if (hoverCell && sel && !state.over) {
      var hc = hoverCell;
      if (sel.kind === 'building') {
        var bdef = C.DATA.buildings[sel.key];
        if (bdef) {
          var hr = cellRect(hc.row, hc.col);
          var hx = hr.x + s * bdef.size[1] / 2, hy = hr.y + s * bdef.size[0] / 2;
          // 建筑落点轮廓
          ctx.strokeStyle = 'rgba(126,240,160,.95)'; ctx.lineWidth = 2;
          ctx.strokeRect(hr.x + 1, hr.y + 1, s * bdef.size[1] - 2, s * bdef.size[0] - 2);
          // 攻击范围（红圈）
          var hst = C.statsForLevel(bdef, 1);
          if (hst && hst.range) {
            var hr2 = (hst.range + 0.5) * s;
            ctx.fillStyle = 'rgba(255,120,90,.13)';
            ctx.beginPath(); ctx.arc(hx, hy, hr2, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = 'rgba(255,140,110,.9)'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(hx, hy, hr2, 0, Math.PI * 2); ctx.stroke();
            ctx.fillStyle = 'rgba(255,200,175,.95)';
            ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
            ctx.fillText('攻击范围 ' + (hst.range * 2 + 1) + '×' + (hst.range * 2 + 1), hx, hy - hr2 - 3);
          }
          // 保护范围（蓝虚线，防御塔专用）
          if (bdef.aura) {
            var ha = (bdef.aura.radius + 0.5) * s;
            ctx.fillStyle = 'rgba(110,200,255,.13)';
            ctx.beginPath(); ctx.arc(hx, hy, ha, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = 'rgba(130,215,255,.95)'; ctx.lineWidth = 2; ctx.setLineDash([5, 4]);
            ctx.beginPath(); ctx.arc(hx, hy, ha, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
            ctx.fillStyle = 'rgba(185,232,255,.95)';
            ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
            ctx.fillText('保护范围 ' + (bdef.aura.radius * 2 + 1) + '×' + (bdef.aura.radius * 2 + 1) +
              '，减伤 ' + Math.round(bdef.aura.dr * 100) + '%', hx, hy + ha + 3);
          }
          // 能不能建在这里
          var hok = C.canPlace(state, ME, sel.key, hc.row, hc.col).ok;
          ctx.fillStyle = hok ? 'rgba(110,230,140,.22)' : 'rgba(255,90,90,.25)';
          ctx.fillRect(hr.x + 1, hr.y + 1, s * bdef.size[1] - 2, s * bdef.size[0] - 2);
          if (bdef.size[0] === 1 && bdef.size[1] === 1) {
            var q = cellRect(hc.row, hc.col);
            ctx.fillStyle = hok ? 'rgba(110,230,140,.22)' : 'rgba(255,90,90,.25)';
            ctx.fillRect(q.x + 1, q.y + 1, s - 2, s - 2);
          }
        }
      } else if (sel.kind === 'spell') {
        var sp = null;
        C.DATA.spells.forEach(function (x) { if (x.key === sel.key) sp = x; });
        if (sp) {
          var aoe = sp.aoe || 0;
          // 法术作用范围：以落点为中心的 (2a+1)×(2a+1) 方格
          for (var ar = hc.row - aoe; ar <= hc.row + aoe; ar++) {
            for (var ac = hc.col - aoe; ac <= hc.col + aoe; ac++) {
              if (ac < 1 || ac > C.COLS || ar < 1 || ar > C.ROWS) continue;
              var q2 = cellRect(ar, ac);
              ctx.fillStyle = (ar === hc.row && ac === hc.col)
                ? 'rgba(255,210,120,.40)' : 'rgba(255,190,110,.20)';
              ctx.fillRect(q2.x + 1, q2.y + 1, s - 2, s - 2);
            }
          }
          var q3 = cellRect(hc.row, hc.col);
          ctx.strokeStyle = 'rgba(255,210,120,.95)'; ctx.lineWidth = 2;
          ctx.strokeRect(q3.x + 1, q3.y + 1, s - 2, s - 2);
          var size = aoe * 2 + 1;
          ctx.fillStyle = 'rgba(255,225,160,.98)';
          ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
          ctx.fillText(sp.name + '：' + size + '×' + size, q3.x + s / 2, q3.y - 3);
        }
      }
    }
    if (selectedBuilding && state.buildings.indexOf(selectedBuilding) >= 0) {
      var sb = selectedBuilding;
      var sr = cellRect(sb.row, sb.col, sb.def.size[0], sb.def.size[1]);
      var cx0 = sr.x + s * sb.def.size[1] / 2;
      var cy0 = sr.y + s * sb.def.size[0] / 2;
      var stb = C.combatStatsOf(sb);
      if (stb && stb.range) {
        var rr0 = (stb.range + 0.5) * s;
        ctx.fillStyle = 'rgba(255,120,90,.13)';
        ctx.beginPath(); ctx.arc(cx0, cy0, rr0, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = 'rgba(255,140,110,.9)'; ctx.lineWidth = 2; ctx.setLineDash([]);
        ctx.beginPath(); ctx.arc(cx0, cy0, rr0, 0, Math.PI * 2); ctx.stroke();
        ctx.fillStyle = 'rgba(255,195,165,.95)';
        ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
        ctx.fillText('攻击范围 ' + (stb.range * 2 + 1) + '×' + (stb.range * 2 + 1), cx0, cy0 - rr0 - 3);
      }
      var aus = C.statsForLevel(sb.def, sb.level || 1, sb.branch);
      if (aus && aus.auraRadius != null) {
        var ar0 = (aus.auraRadius + 0.5) * s;
        ctx.fillStyle = 'rgba(110,200,255,.13)';
        ctx.beginPath(); ctx.arc(cx0, cy0, ar0, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = 'rgba(130,215,255,.95)'; ctx.lineWidth = 2; ctx.setLineDash([5, 4]);
        ctx.beginPath(); ctx.arc(cx0, cy0, ar0, 0, Math.PI * 2); ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = 'rgba(185,232,255,.95)';
        ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
        ctx.fillText('保护范围 ' + (aus.auraRadius * 2 + 1) + '×' + (aus.auraRadius * 2 + 1) +
          '，减伤 ' + Math.round((aus.auraDR || 0) * 100) + '%', cx0, cy0 + ar0 + 3);
      }
      var brs0 = C.branchesFor(sb);
      if (brs0.length) {
        ctx.fillStyle = 'rgba(255,225,150,.95)';
        ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
        ctx.fillText('可升级：' + brs0.map(function (x) { return x.name; }).join(' / '), cx0, cy0 + s * 1.1 + 16);
      }
    }

    if (showPath) {
      var f = state.field[ME];
      ctx.strokeStyle = 'rgba(120,200,255,.5)'; ctx.lineWidth = 1.5;
      for (var rr = 0; rr <= C.ROWS + 1; rr++) {
        for (var cc = 1; cc <= C.COLS; cc++) {
          var t = f.dir[rr][cc];
          if (!t) continue;
          var a2 = cellRect(rr, cc), b2 = cellRect(t.r, t.c);
          ctx.beginPath();
          ctx.moveTo(a2.x + s / 2, a2.y + s / 2);
          ctx.lineTo(b2.x + s / 2, b2.y + s / 2);
          ctx.stroke();
        }
      }
    }

    // 3 地面兵 —— 用「外圈阵营色 + 朝向箭头」区分敌我
    function teamRing(u) { return u.team === ME ? '#5aa9ff' : '#ff6b6b'; }
    function drawTeamMark(cx, cy, radius, u) {
      // 外圈：己方蓝环 / 敌方红环
      ctx.beginPath();
      ctx.arc(cx, cy, radius + 2.2, 0, Math.PI * 2);
      ctx.strokeStyle = teamRing(u); ctx.lineWidth = 2.4; ctx.stroke();
      // 朝向小三角：己方朝下（往敌方推），敌方朝上
      var dir = u.team === ME ? 1 : -1;
      var tip = radius + 5.5;
      ctx.beginPath();
      ctx.moveTo(cx, cy + dir * tip);
      ctx.lineTo(cx - 3.2, cy + dir * (tip - 3.6));
      ctx.lineTo(cx + 3.2, cy + dir * (tip - 3.6));
      ctx.closePath();
      ctx.fillStyle = teamRing(u); ctx.fill();
    }
    /* 出生 / 死亡特效的差分（必须在画兵之前跑，否则死亡那一刻的位置取不到） */
    trackUnitFx(s);

    var byCell = {};
    var ipos = {};                 // id → 插值后的浮点格坐标
    state.units.forEach(function (u) {
      if (u.def.air) return;
      var p = lerpPos(u);
      ipos[u.id] = p;
      /* 分桶用**真实逻辑格**（u.row/u.col），不要用插值后的坐标。
       * 之前用 Math.round(插值坐标) 分桶，单位在相邻两格之间移动时 key 会来回变，
       * 「同格多兵偏移」随之闪来闪去 —— 看起来就是"左右来回跳"（实测到的 bug）。
       * 逻辑格在一格之内是稳定的，所以分桶稳定。 */
      var k = u.row + '_' + u.col;
      (byCell[k] = byCell[k] || []).push(u);
    });
    Object.keys(byCell).forEach(function (k) {
      var list = byCell[k];
      var p = k.split('_'), r = cellRect(+p[0], +p[1]);
      // 只有一只兵时按插值坐标平滑绘制；多兵同格时按格子画（保证偏移稳定）
      if (list.length === 1 && ipos[list[0].id]) {
        var ip = ipos[list[0].id];
        r = cellRectF(ip.row, ip.col);
      }
      // 同一格里有敌我双方时，己方画在左半、敌方画在右半，一眼分得开
      var hasBoth = list.some(function (u) { return u.team === ME; }) &&
                    list.some(function (u) { return u.team !== ME; });

      /* 同格多兵的排布。
       * 旧的偏移量是给「半径 0.3 格的小圆点」调的；换成 1.12 格的贴图后，
       * 两只兵会几乎完全叠住（只能看到最上面那一只）。
       * 现在改成「按人数收缩 + 编队站位」：
       *   1 只 → 原尺寸居中
       *   2 只 → 左右半格，各自缩到 0.84
       *   3~4 只 → 2×2 编队，缩到 0.72
       *   敌我同格 → 强制按阵营左右分列，并再压一档
       * 缩放只作用于贴图；血条、数量角标照旧按整格画。 */
      var n = list.length;
      var unitScale = n === 1 ? 1 : (n === 2 ? 0.78 : 0.66);
      if (hasBoth) unitScale = Math.min(unitScale, 0.74);
      var SLOT2 = [[-0.23, 0], [0.23, 0]];
      var SLOT4 = [[-0.22, -0.17], [0.22, -0.17], [-0.22, 0.17], [0.22, 0.17]];

      list.forEach(function (u, i) {
        var dx, dy, slot;
        if (hasBoth) {
          // 己方左列、敌方右列；同阵营内部再按序号上下错开
          var sameTeam = list.filter(function (o) { return o.team === u.team; });
          var idx = sameTeam.indexOf(u);
          dx = (u.team === ME ? -0.21 : 0.21);
          dy = sameTeam.length === 1 ? 0 : (idx === 0 ? -0.16 : 0.16);
        } else if (n === 2) {
          slot = SLOT2[i % 2]; dx = slot[0]; dy = slot[1];
        } else if (n >= 3) {
          slot = SLOT4[i % 4]; dx = slot[0]; dy = slot[1];
        } else {
          dx = 0; dy = 0;
        }
        var cx = r.x + s / 2 + s * dx;
        var cy = r.y + s / 2 + s * dy;
        var hurt = (state.time - (u.justDamaged || -99)) < 0.18;
        /* 朝向：用 stepDir 判方向，转向后保持最后朝向（状态机在 ART 里） */
        ART.updateFacing(u);
        // 贴图兵种：脚下压一层软投影，否则会显得浮在棋盘上
        var drew = ART.drawUnit(u, cx, cy + s * 0.40 * unitScale, s, unitScale);
        if (drew) {
          if (hurt) {   // 受击闪白：贴图上盖一层，保留打击反馈
            ctx.save();
            ctx.globalAlpha = 0.45; ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(cx, cy, s * 0.17 * unitScale, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
          }
        } else {
          ctx.beginPath();
          ctx.arc(cx, cy, s * 0.30 * unitScale, 0, Math.PI * 2);
          ctx.fillStyle = hurt ? '#fff' : u.def.color;
          ctx.fill();
          ctx.strokeStyle = '#0d111a'; ctx.lineWidth = 1.5; ctx.stroke();
          drawTeamMark(cx, cy, s * 0.30 * unitScale, u);
        }

        /* 增益/减益着色：逻辑层已给单位打上 frozenUntil / weakenUntil / rageUntil，
         * 这里按剩余状态盖一层半透明色圈，让"被冰冻/被弱化/被狂暴"一目了然。 */
        var tcol = null;
        if (u.frozenUntil && state.time < u.frozenUntil) tcol = 'rgba(150,220,255,.42)';
        else if (u.weakenUntil && state.time < u.weakenUntil) tcol = 'rgba(200,150,220,.38)';
        else if (u.rageUntil && state.time < u.rageUntil) tcol = 'rgba(255,190,80,.34)';
        if (tcol) {
          ctx.save();
          ctx.fillStyle = tcol;
          ctx.beginPath();
          ctx.arc(cx, cy - s * 0.16 * unitScale, s * 0.36 * unitScale, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      });
      var mx = 0;
      list.forEach(function (u) { mx = Math.max(mx, u.hp / u.hpMax); });
      if (mx < 0.999) {
        ctx.fillStyle = 'rgba(0,0,0,.72)';
        ctx.fillRect(r.x + 2, r.y + s - 5, s - 4, 4);
        ctx.fillStyle = mx > .5 ? '#54d96b' : mx > .25 ? '#ffcc44' : '#ff5f5f';
        ctx.fillRect(r.x + 2, r.y + s - 5, (s - 4) * mx, 4);
      }
      if (list.length > 1) {
        var mine = list.filter(function (u) { return u.team === ME; }).length;
        ctx.fillStyle = '#fff';
        ctx.font = 'bold ' + Math.max(8, s * 0.3) + 'px sans-serif';
        ctx.textAlign = 'right'; ctx.textBaseline = 'top';
        ctx.fillText((mine === list.length ? '我' : mine === 0 ? '敌' : '') + 'x' + list.length, r.x + s - 2, r.y + 2);
      }
    });

    // 4 空中兵（同样带阵营环 + 朝向箭头，另外加一圈虚线表示「飞行」，并显示血条）
    state.units.forEach(function (u) {
      if (!u.def.air) return;
      var ipA = lerpPos(u);
      var r = cellRectF(ipA.row, ipA.col);
      var acx = r.x + s / 2, acy = r.y + s * 0.42;
      ctx.fillStyle = 'rgba(0,0,0,.35)';
      ctx.beginPath(); ctx.ellipse(acx, r.y + s * 0.84, s * 0.22, s * 0.1, 0, 0, Math.PI * 2); ctx.fill();
      ART.updateFacing(u);
      var drewAir = ART.drawUnit(u, acx, r.y + s * 0.76, s);
      if (!drewAir) {
        ctx.globalAlpha = 0.9;
        ctx.beginPath(); ctx.arc(acx, acy, s * 0.3, 0, Math.PI * 2);
        ctx.fillStyle = u.def.color; ctx.fill();
        ctx.strokeStyle = '#0d111a'; ctx.lineWidth = 1.5; ctx.stroke();
        ctx.globalAlpha = 1;
        drawTeamMark(acx, acy, s * 0.3, u);
        // 飞行标记：外面再加一圈细虚线（贴图模式下不需要，飘起来本身就说明在飞）
        ctx.beginPath();
        ctx.arc(acx, acy, s * 0.42, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255,255,255,.45)'; ctx.lineWidth = 1;
        ctx.setLineDash([2, 3]); ctx.stroke(); ctx.setLineDash([]);
      }
      // 增益/减益着色（与地面兵一致）
      var tcolA = null;
      if (u.frozenUntil && state.time < u.frozenUntil) tcolA = 'rgba(150,220,255,.42)';
      else if (u.weakenUntil && state.time < u.weakenUntil) tcolA = 'rgba(200,150,220,.38)';
      else if (u.rageUntil && state.time < u.rageUntil) tcolA = 'rgba(255,190,80,.34)';
      if (tcolA) {
        ctx.save();
        ctx.fillStyle = tcolA;
        ctx.beginPath();
        ctx.arc(acx, acy - s * 0.10, s * 0.36, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      // 血条：空中兵也要能看到血量（画在格子下沿）
      var airRatio = Math.max(0, Math.min(1, u.hp / u.hpMax));
      var bwA = s - 4;
      ctx.fillStyle = 'rgba(0,0,0,.75)';
      ctx.fillRect(r.x + 2, r.y + s - 6, bwA, 4);
      ctx.fillStyle = airRatio > .5 ? '#54d96b' : airRatio > .25 ? '#ffcc44' : '#ff5f5f';
      ctx.fillRect(r.x + 2, r.y + s - 6, bwA * airRatio, 4);
      // 血量数字（格子够大才写，免得糊成一团）
      if (s >= 26) {
        ctx.fillStyle = 'rgba(0,0,0,.6)';
        ctx.font = 'bold 9px sans-serif';
        ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
        ctx.fillText(Math.ceil(u.hp) + '/' + u.hpMax, r.x + 3, r.y + s - 7);
      }
    });

    // 5 弹道 / 命中特效
    drawProjectiles();

    // 5.5 出生 / 死亡贴图特效（画在弹道之后，压在最上层）
    drawFxQueue();

    // UI
    goldEl.textContent = Math.floor(state.res[ME]);
    var inc = C.DATA.baseLevels[C.baseLevelOf(state, ME) - 1].income;
    state.buildings.forEach(function (b) {
      if (b.team === ME && b.def.income) inc += C.statsForLevel(b.def, b.level || 1, b.branch).income;
    });
    rateEl.textContent = '+' + inc.toFixed(0) + '/s';
    var fb = C.ownBase(state, FOE);
    enemyEl.textContent = fb ? ('红方大本营 Lv' + (fb.level || 1) + ' ' + Math.max(0, Math.floor(fb.hp)) + '/' + fb.hpMax)
      : '红方大本营 已摧毁';
    hintEl.style.borderColor = '#44664b';
    retryIcons();   // 等贴图加载完的建筑卡片图标（数组空时零成本）
    updateCards();
  }

  /* ---------------------------------------------------------------- 卡片 */
  /* 卡片图标：
   *  建筑 = 底座 + 武器 现场合成到小画布（Lv1 木/石纪元 = 默认形态；
   *        防御塔带碉堡顶，金矿/大本营是单层整图）
   *  兵种 = 蓝方 idle 贴图；法术 = spell_* 图标
   * 贴图没加载好时画布空着，由 retryIcons() 在后续帧补画；
   * 一直失败（文件缺失）才回退到汉字，保证卡片永远有内容。 */
  var iconRetry = [];
  function buildingIconFiles(key) {
    if (key === 'mine') return { base: 'mine_L1.png', top: null };
    if (key === 'base') return { base: 'base_L1.png', top: null };
    if (key === 'ward') return { base: 'ward_body_e1.png', top: 'ward_bunker_top_e3.png' };
    return { base: key + '_base_e1.png', top: key + '_top_e1.png' };
  }
  function paintBuildingIcon(cv, key) {
    var g = cv.getContext('2d');
    if (!g) return false;
    var S = cv.width;
    g.clearRect(0, 0, S, S);
    var f = buildingIconFiles(key);
    var bi = ART.img(f.base);
    if (!bi) return false;
    var bw = S * 0.78;                                   // 底座：底边对齐、居中
    g.drawImage(bi, (S - bw) / 2, S - bw, bw, bw);
    if (f.top) {
      var ti = ART.img(f.top);
      if (ti) {
        var tw = S * 0.90;                               // 武器：略大，坐在底座上（和棋盘同比例）
        g.drawImage(ti, (S - tw) / 2, S * 0.52 - tw / 2, tw, tw);
      }
    }
    return true;
  }
  function retryIcons() {
    if (!iconRetry.length) return;
    iconRetry = iconRetry.filter(function (job) {
      job.n = (job.n || 0) + 1;
      if (paintBuildingIcon(job.cv, job.key)) {
        var gt = job.cv.parentNode.querySelector('.gt');
        if (gt) gt.style.display = 'none';
        return false;
      }
      return job.n < 150;                               // 最多重试 ~2.5 秒（文件真缺失就认栽，留汉字）
    });
  }
  function iconHtml(kind, key, glyph, color) {
    if (kind === 'unit') {
      return '<div class="ic"><img class="ci" src="art/v9/unit_' + key + '_blue_idle.png" alt=""' +
        ' onerror="this.remove();this.parentNode.classList.add(\'noimg\')">' +
        '<span class="gt" style="color:' + color + '">' + glyph + '</span></div>';
    }
    if (kind === 'spell') {
      return '<div class="ic"><img class="ci" src="art/v9/spell_' + key + '.png" alt=""' +
        ' onerror="this.remove();this.parentNode.classList.add(\'noimg\')">' +
        '<span class="gt" style="color:' + color + '">' + glyph + '</span></div>';
    }
    // 建筑：画布图标 + 汉字回退
    return '<div class="ic"><canvas class="ci" width="96" height="96"></canvas>' +
      '<span class="gt" style="color:' + color + '">' + glyph + '</span></div>';
  }

  function buildCards() {
    bcardsEl.innerHTML = '';
    BUILD_ORDER.forEach(function (key) {
      var d = C.DATA.buildings[key];
      var el = document.createElement('div');
      el.className = 'card'; el.dataset.kind = 'building'; el.dataset.key = key;
      el.innerHTML = iconHtml('building', key, d.glyph, d.color) +
        '<div class="n">' + d.name + '</div><div class="c">' + d.cost + '</div>';
      el.onclick = function () { select('building', key); };
      bcardsEl.appendChild(el);
      var cv = el.querySelector('canvas.ci');
      if (cv && !paintBuildingIcon(cv, key)) iconRetry.push({ cv: cv, key: key });
      else if (cv) { var gt = el.querySelector('.gt'); if (gt) gt.style.display = 'none'; }
    });
    ucardsEl.innerHTML = '';
    UNIT_ORDER.forEach(function (key) {
      var d = C.DATA.units[key];
      var el = document.createElement('div');
      el.className = 'card'; el.dataset.kind = 'unit'; el.dataset.key = key;
      el.innerHTML = '<div class="cdbar"></div>' +
        iconHtml('unit', key, d.glyph, d.color) +
        '<div class="n">' + d.name + '</div><div class="c">' + d.cost + '</div>' +
        '<div class="cd"></div>';
      el.onclick = function () { select('unit', key); };
      ucardsEl.appendChild(el);
    });
    scardsEl.innerHTML = '';
    C.DATA.spells.forEach(function (sp) {
      var el = document.createElement('div');
      el.className = 'card'; el.dataset.kind = 'spell'; el.dataset.key = sp.key;
      el.innerHTML = '<div class="cdbar"></div>' +
        iconHtml('spell', sp.key, sp.glyph, sp.color) +
        '<div class="n">' + sp.name + '</div><div class="c">Lv' + sp.unlockBaseLevel + '</div>' +
        '<div class="cd"></div>';
      el.onclick = function () { select('spell', sp.key); };
      scardsEl.appendChild(el);
    });
  }

  function updateCards() {
    if (!state) return;
    Array.prototype.forEach.call(bcardsEl.children, function (el) {
      var key = el.dataset.key, d = C.DATA.buildings[key];
      var poor = state.res[ME] < d.cost;
      el.classList.toggle('locked', poor);
      el.classList.toggle('sel', !!sel && sel.kind === 'building' && sel.key === key);
    });
    Array.prototype.forEach.call(ucardsEl.children, function (el) {
      var key = el.dataset.key, d = C.DATA.units[key];
      var cd = state.unitCd[ME][key] || 0;
      var poor = state.res[ME] < d.cost;
      el.classList.toggle('locked', poor);
      el.classList.toggle('sel', !!sel && sel.kind === 'unit' && sel.key === key);
      var fill = el.querySelector('.cdbar');
      if (fill) fill.style.width = (d.deployCd > 0 ? Math.min(100, cd / d.deployCd * 100) : 0) + '%';
      var tag = el.querySelector('.cd');
      if (tag) tag.textContent = cd > 0 ? cd.toFixed(1) + 's' : '';
    });
    Array.prototype.forEach.call(scardsEl.children, function (el) {
      var key = el.dataset.key;
      var st = C.spellStatus(state, ME).filter(function (x) { return x.key === key; })[0];
      if (!st) return;
      el.classList.toggle('locked', !st.unlocked);
      el.classList.toggle('sel', !!sel && sel.kind === 'spell' && sel.key === key);
      var fill = el.querySelector('.cdbar');
      if (fill) fill.style.width = (st.cooldown > 0 ? Math.min(100, st.cd / st.cooldown * 100) : 0) + '%';
      var tag = el.querySelector('.cd');
      if (tag) tag.textContent = !st.unlocked ? '锁' : (st.cd > 0 ? st.cd.toFixed(0) + 's' : '');
    });
  }

  function select(kind, key) {
    sel = { kind: kind, key: key };
    if (kind === 'building') {
      hintEl.textContent = '「' + C.DATA.buildings[key].name + '」：点自己半场（行6~10）的空格放置';
    } else if (kind === 'unit') {
      var d = C.DATA.units[key];
      var cd = state.unitCd[ME][key] || 0;
      hintEl.textContent = cd > 0
        ? ('「' + d.name + '」冷却中（还有 ' + cd.toFixed(1) + ' 秒）')
        : ('「' + d.name + '」：点最下面那条通道的某一列派出去');
    } else {
      var sp = null;
      C.DATA.spells.forEach(function (x) { if (x.key === key) sp = x; });
      var ok = C.canCastSpell(state, ME, key, 5, 5);
      hintEl.textContent = ok.ok
        ? ('「' + sp.name + '」：点棋盘上任意一格作为落点（覆盖 ' + ((sp.aoe || 0) * 2 + 1) + '×' + ((sp.aoe || 0) * 2 + 1) + '）')
        : ('「' + sp.name + '」现在不能用：' + ok.why);
    }
    updateCards();
    render();
  }

  /* ---------------------------------------------------------- 总体升级卡片 */
  function buildGlobalCards() {
    if (!state) return;
    gcardsEl.innerHTML = '';
    C.globalUpgradeStatus(state, ME).forEach(function (g) {
      var el = document.createElement('div');
      el.className = 'card'; el.dataset.gkey = g.key;
      el.innerHTML = '<div class="ic"><img class="ci" src="art/v9/up_' + g.key + '.png" alt=""' +
        ' onerror="this.remove();this.parentNode.classList.add(\'noimg\')">' +
        '<span class="gt" style="color:' + g.color + '">' + g.glyph + '</span></div>' +
        '<div class="n">' + g.name + '</div>' +
        '<div class="lvtag">Lv' + g.level + '/10</div>' +
        '<div class="eff">' + g.effect + '</div>' +
        '<div class="c">' + (g.cost == null ? '满级' : g.cost + ' 金') + '</div>';
      el.onclick = function () {
        var r = C.upgradeGlobal(state, ME, g.key);
        hintEl.textContent = r.ok
          ? (g.name + ' 升到 Lv' + r.level + '（花费 ' + r.cost + ' 金），现在 ' + g.nextEffect)
          : (g.name + '：' + r.why);
        buildGlobalCards(); updateCards(); render();
      };
      gcardsEl.appendChild(el);
    });
  }

  /* 点击自己的单位 → 弹出它的详细状况 */
  function renderUnitDetail(u) {
    var d = u.def;
    var gb = C.globalBonus(state, u.team);
    var rows = [
      ['所属', (u.team === ME ? '我方' : '敌方') + ' · ' + (d.air ? '空中单位' : '地面单位')],
      ['血量', Math.max(0, Math.ceil(u.hp)) + ' / ' + u.hpMax],
      ['攻击力', (d.atk * (u.team === ME ? gb.unitAtk : 1)).toFixed(1) + '（基础 ' + d.atk + '）'],
      ['攻击间隔', d.atkInterval + ' 秒'],
      ['攻击范围', d.range + ' 格（上下左右）'],
      ['可打目标', d.targets === 'both' ? '对地对空' : '只对地'],
      ['打什么', d.priority === 'siege' ? '只打建筑和大本营' : '只打士兵和大本营'],
      ['移动速度', d.speed + ' 格/秒'],
      ['护甲', d.armor]
    ];
    var ratio = Math.max(0, Math.min(1, u.hp / u.hpMax));
    detailEl.innerHTML = '' +
      '<div class="head">' +
        '<div class="g" style="background:' + d.color + '">' + d.glyph + '</div>' +
        '<div class="nm">' + d.name + ' <span class="lv">' + (u.team === ME ? '我方' : '敌方') + '</span></div>' +
        '<div class="x" id="detailclose">✕</div>' +
      '</div>' +
      '<div class="desc">' + (d.desc || '') + '</div>' +
      '<div class="bar"><i style="width:' + (ratio * 100).toFixed(1) + '%;background:' +
        (ratio > .5 ? '#54d96b' : ratio > .25 ? '#ffcc44' : '#ff5f5f') + '"></i></div>' +
      '<table>' + rows.map(function (r) {
        return '<tr><td class="k">' + r[0] + '</td><td class="v">' + r[1] + '</td></tr>';
      }).join('') + '</table>';
    detailEl.classList.add('show');
    document.getElementById('detailclose').onclick = function () { selectedUnit = null; renderDetail(); render(); };
  }
  /* ------------------------------------------------------- 建筑详情 + 升级 */
  function renderDetail() {
    var b = selectedBuilding;
    if (selectedUnit) { renderUnitDetail(selectedUnit); return; }
    if (!b || !state || state.buildings.indexOf(b) < 0) {
      detailEl.classList.remove('show');
      detailEl.innerHTML = '';
      return;
    }
    var info = C.buildingInfo(state, b);
    var cost = info.upgradeCost;
    var canUp = b.team === ME && cost !== null && state.res[ME] >= cost && !state.over;
    /* ★ v18：数值行统一走 bldStatRows / baseStatRows（与图鉴同一出口），
     * 这里只决定「怎么画」，不再各自拼一份 if 链。
     * 唯一的现场值：血量取「当前 / 上限」（图鉴那边是满血值）。 */
    var rows = [];
    if (info.isBase) {
      rows = baseStatRows(info.level, info.spells, { hpText: fmtNum(info.hp) + ' / ' + fmtNum(info.hpMax) });
    } else {
      var stNow = {
        hp: info.hpMax, atk: info.atk, atkInterval: info.atkInterval,
        range: info.range, targets: info.targets, mode: info.mode,
        income: info.income, auraRadius: info.auraRadius, auraDR: info.auraDR
      };
      rows = bldStatRows(b.def, stNow, info.next, {
        /* 生命这一行在面板里是「当前 / 上限」，图鉴里是满血值 —— 唯一的差别。
         * 数字格式统一交给 fmtNum（千分位），否则面板写 2400、图鉴写 2,400，看起来是两套数。 */
        hpText: fmtNum(info.hp) + ' / ' + fmtNum(info.hpMax),
        hpNext: info.next ? fmtNum(info.next.hp) : null
      });
    }
    var rowHTML = rows.map(function (r) {
      var v = r.v + (r.next != null ? ' <span class="up">→ ' + r.next + '</span>' : '');
      return '<tr><td class="k">' + r.k + '</td><td class="v">' + v + '</td></tr>';
    }).join('');
    var ratio = Math.max(0, Math.min(1, b.hp / b.hpMax));
    // 拆除按钮：返还 = 累计投入 × 0.8 ×（当前血量/总血量）
    var demolishBtn = '';
    if (b.team === ME && !b.def.isBase) {
      var refund = C.demolishRefund(b);
      demolishBtn = '<button id="detaildemolish" class="danger" title="返还 80% 已投入金币 × 当前血量比例">' +
        '拆除（返还 ' + refund + ' 金）</button>';
    }
    var acts = '';
    if (info.branches && info.branches.length) {
      var opts = info.branches;
      acts = opts.map(function (o, i) {
        /* ★ v14：按钮上直接把「选它之后这一级会变成多少」算出来贴在描述后面。
         * 原因是分支描述是静态文案，容易和真实数值脱节 —— 水晶塔原来就写着
         * 「减伤 +40%」而实际 L5 只有 20%，玩家一眼就看出标错。
         * 现在数值一律从 C.statsForLevel(def, 升级后等级, 分支) 现算。 */
        var lvAfter = info.level + 1;
        var pv = C.statsForLevel(b.def, lvAfter, o.key);
        var facts = [];
        if (pv.auraRadius != null) facts.push('保护 ' + (pv.auraRadius * 2 + 1) + '×' + (pv.auraRadius * 2 + 1));
        if (pv.auraDR != null) facts.push('减伤 ' + Math.round(pv.auraDR * 100) + '%');
        var factLine = facts.length
          ? '<br><span style="font-weight:600;font-size:10px;color:#ffe6a8">Lv' + lvAfter + '：' + facts.join(' · ') + '</span>'
          : '';
        return '<button class="' + (i ? 'alt' : '') + '" data-branch="' + o.key + '"' + (canUp ? '' : ' disabled') + ' title="' + o.desc + '">' +
          o.name + '（' + (cost == null ? '—' : cost + ' 金') + '）<br><span style="font-weight:400;font-size:10px">' + o.desc + '</span>' + factLine + '</button>';
      }).join('');
    } else {
      acts = '<button id="detailup"' + (canUp ? '' : ' disabled') + '>' +
        (b.team !== ME ? '敌方建筑（只读）'
          : cost === null ? '已满级'
          : '升级到 Lv' + (info.level + 1) + '（' + cost + ' 金）') + '</button>';
    }
    detailEl.innerHTML = '' +
      '<div class="head">' +
        '<div class="g" style="background:' + b.def.color + '">' + b.def.glyph + '</div>' +
        '<div class="nm">' + info.name +
          (info.branchName ? ' · ' + info.branchName : '') +
          ' <span class="lv">Lv' + info.level + '/' + info.maxLevel + '</span></div>' +
        '<div class="x" id="detailclose">✕</div>' +
      '</div>' +
      '<div class="desc">' + (b.team === ME ? '己方' : '敌方') + ' · ' + buildingDesc(b) + (info.note ? ' · ' + info.note : '') + '</div>' +
      '<div class="bar"><i style="width:' + (ratio * 100).toFixed(1) + '%;background:' + (ratio > .5 ? '#54d96b' : ratio > .25 ? '#ffcc44' : '#ff5f5f') + '"></i></div>' +
      '<table>' + rowHTML + '</table>' +
      '<div class="acts">' + acts + demolishBtn + '</div>';
    detailEl.classList.add('show');
    document.getElementById('detailclose').onclick = function () { selectedBuilding = null; renderDetail(); render(); };
    var upBtn = document.getElementById('detailup');
    if (upBtn && canUp) {
      upBtn.onclick = function () {
        var res = C.upgradeBuilding(state, b);
        hintEl.textContent = res.ok ? ('升级成功：Lv' + res.level + (res.branch ? '（' + (C.branches[res.branch] ? C.branches[res.branch].name : '') + '）' : ''))
          : ('不能升级：' + res.why);
        renderDetail(); render();
      };
    }
    var dmBtn = document.getElementById('detaildemolish');
    if (dmBtn) {
      dmBtn.onclick = function () {
        var res = C.demolishBuilding(state, b);
        hintEl.textContent = res.ok
          ? ('已拆除「' + info.name + '」，返还 ' + res.refund + ' 金')
          : ('不能拆除：' + res.why);
        if (res.ok) selectedBuilding = null;
        renderDetail(); render();
      };
      dmBtn.textContent = '拆除（返还 ' + C.demolishRefund(b) + ' 金）';
    }
    Array.prototype.forEach.call(detailEl.querySelectorAll('[data-branch]'), function (btn) {
      btn.onclick = function () {
        var res = C.upgradeBuilding(state, b, btn.dataset.branch);
        hintEl.textContent = res.ok ? ('升级成功：' + (C.branches[res.branch] ? C.branches[res.branch].name : ''))
          : ('不能升级：' + res.why);
        renderDetail(); render();
      };
    });
  }
  function modeName(mode) {
    return { single: '单体', group: '群攻（同格全打）', line: '群攻（直线贯穿）', allInRange: '群攻（范围内全部）', multi3: '最多3个单体' }[mode] || mode;
  }
  /* 建筑说明文案：选了分支之后要用**分支的**说明，否则会自相矛盾 ——
   * 防御塔基础 desc 写「保护范围 3×3」，可水晶塔分支其实是 5×5，
   * 玩家会看到「说明 3×3、数值表 5×5」这种一眼假的东西（v18 修）。 */
  function buildingDesc(b) {
    if (b && b.branch && C.DATA.branches[b.branch]) return C.DATA.branches[b.branch].desc;
    return (b && b.def && b.def.desc) || '';
  }

  /* ==========================================================================
   * 建筑 / 大本营的「数值行」唯一出口（v18）
   *
   * 为什么要有这一层：战斗中的建筑详情面板（渲染成 <table>）和图鉴详情
   * （渲染成 cxKV 小卡）原来是各写一套 if/else。同一个数值改了一处忘另一处，
   * 两处就会打架 —— v14 玩家报的「防御塔升水晶塔界面数值标错」就是这么来的
   * （面板写「减伤 +40%」、实际 L5 只有 20%）。
   * 现在两边都从这里取行，只在"怎么画"上分开：
   *   · 详情面板：rows → <tr><td class="k">…</td><td class="v">…</td></tr>
   *   · 图鉴详情：rows → cxKV(k, v, next, gold)
   *
   * 行结构：{ k 标签, v 当前值, next 下一级值（可空）, gold 是否金币色 }
   * 顺序也就是玩家看到的顺序：生命 → 攻击 → 攻速 → 射程 → … → 减伤。
   * ========================================================================== */
  function bldStatRows(def, st, nxt, opts) {
    opts = opts || {};
    var rows = [];
    if (!def || !st) return rows;
    rows.push({
      k: '生命',
      v: opts.hpText != null ? opts.hpText : fmtNum(st.hp),
      next: opts.hpNext !== undefined ? opts.hpNext : (nxt ? fmtNum(nxt.hp) : null)
    });
    /* 攻击三件套只在「真的会打人」的建筑上出现。
     * 防御塔（ward）没有 atk，以前面板照样给它挂一行「攻击方式：单体」—— 明显是误导。 */
    if (def.atk != null) {
      rows.push({ k: '攻击力', v: fmtNum(st.atk), next: nxt ? fmtNum(nxt.atk) : null });
      if (st.atkInterval != null) {
        rows.push({ k: '攻击间隔', v: fmtNum(st.atkInterval) + ' 秒', next: nxt ? fmtNum(nxt.atkInterval) + ' 秒' : null });
      }
      if (st.range != null) {
        rows.push({ k: '射程', v: fmtNum(st.range) + ' 格', next: nxt ? fmtNum(nxt.range) + ' 格' : null });
      }
      rows.push({ k: '可打目标', v: st.targets === 'both' ? '对地对空' : '只对地面', next: null });
      rows.push({ k: '攻击方式', v: modeName(st.mode), next: null });
    } else if (st.range != null) {
      /* 防御塔这类「有射程但不攻击」的建筑：射程留着没意义，只报光环。 */
    }
    if (def.income != null && st.income != null) {
      rows.push({
        k: '金币加成', v: st.income + ' /秒',
        next: nxt && nxt.income != null ? nxt.income + ' /秒' : null, gold: true
      });
    }
    /* 光环两件套：范围与减伤必须成对出现。
     * 只给减伤会出现「水晶塔 5×5 却只减 20%」看起来像标错的情况（v14 修复点）。 */
    if (st.auraRadius != null) {
      rows.push({
        k: '保护范围', v: (st.auraRadius * 2 + 1) + '×' + (st.auraRadius * 2 + 1),
        next: nxt && nxt.auraRadius != null ? (nxt.auraRadius * 2 + 1) + '×' + (nxt.auraRadius * 2 + 1) : null
      });
    }
    if (st.auraDR != null) {
      rows.push({
        k: '护盾减伤', v: Math.round(st.auraDR * 100) + '%',
        next: nxt && nxt.auraDR != null ? Math.round(nxt.auraDR * 100) + '%' : null
      });
    }
    return rows;
  }
  /* 大本营（没有「下一级的 stats 对象」，直接读 baseLevels）。
   * opts.hpText：战斗面板要显示「当前 / 上限」，图鉴只要满血值。 */
  function baseStatRows(lv, spellsAtLv, opts) {
    opts = opts || {};
    var BL = C.DATA.baseLevels;
    var cur = BL[lv - 1], nx = BL[lv];
    if (!cur) return [];
    var rows = [
      { k: '生命', v: opts.hpText != null ? opts.hpText : cur.hp.toLocaleString(),
        next: nx ? nx.hp.toLocaleString() : null },
      { k: '金币收入', v: cur.income + ' /秒', next: nx ? nx.income + ' /秒' : null, gold: true },
      { k: '本级解锁法术', v: (spellsAtLv && spellsAtLv.length) ? spellsAtLv.join('、') : '—', next: null }
    ];
    return rows;
  }

  /* ---------------------------------------------------------------- 交互 */
  function handleTap(px, py) {
    if (!state || state.over) return;
    var cell = pointToCell(px, py);
    if (!cell) return;

    // 法术落点优先
    if (sel && sel.kind === 'spell') {
      var r = C.castSpell(state, ME, sel.key, cell.row, cell.col);
      hintEl.textContent = r.ok ? ('施放成功，命中 ' + r.hits + ' 个目标') : ('不能施放：' + r.why);
      if (r.ok) sel = null;
      updateCards(); render();
      return;
    }

    // 点已有建筑 → 详情（再点同一次 = 取消选中）
    var hit = state.grid[cell.row] && state.grid[cell.row][cell.col];
    if (hit && cell.row >= 1 && cell.row <= C.ROWS) {
      if (selectedBuilding === hit) {          // 再次点击 → 取消选中
        selectedBuilding = null; selectedUnit = null;
        hintEl.textContent = '已取消选中';
        renderDetail(); render();
        return;
      }
      selectedBuilding = hit; selectedUnit = null;
      renderDetail(); render();
      return;
    }
    // 点单位 → 看它的详细状况（再点同一次 = 取消）
    var hitUnit = null;
    for (var ui2 = 0; ui2 < state.units.length; ui2++) {
      var uu = state.units[ui2];
      if (uu.row === cell.row && uu.col === cell.col) { hitUnit = uu; break; }
    }
    if (hitUnit) {
      if (selectedUnit === hitUnit) {
        selectedUnit = null; hintEl.textContent = '已取消选中';
        renderDetail(); render();
        return;
      }
      selectedUnit = hitUnit; selectedBuilding = null;
      hintEl.textContent = '查看「' + hitUnit.def.name + '」的状况（再点一次可取消）';
      renderDetail(); render();
      return;
    }
    selectedBuilding = null; selectedUnit = null; renderDetail();

    if (!sel) { hintEl.textContent = '先选一个建筑 / 兵种 / 法术，或点已有建筑查看升级'; return; }

    if (sel.kind === 'unit') {
      if (cell.row !== C.CHANNEL_ROW[ME]) {
        hintEl.textContent = '派兵要点最下面那条通道';
        return;
      }
      var r2 = C.deployUnit(state, ME, sel.key, cell.col);
      hintEl.textContent = r2.ok ? ('已派出「' + C.DATA.units[sel.key].name + '」到 列' + cell.col) : ('不能派兵：' + r2.why);
    } else if (sel.kind === 'building') {
      var r3 = C.placeBuilding(state, ME, sel.key, cell.row, cell.col);
      if (r3.ok) { hintEl.textContent = '已建造「' + C.DATA.buildings[sel.key].name + '」（点它可升级）'; sel = null; }
      else hintEl.textContent = '不能建造：' + r3.why;
    }
    updateCards(); render();
  }

  canvas.addEventListener('pointermove', function (e) {
    var rect = canvas.getBoundingClientRect();
    var c2 = pointToCell(e.clientX - rect.left, e.clientY - rect.top);
    var changed = (!!c2 !== !!hoverCell) || (c2 && hoverCell && (c2.row !== hoverCell.row || c2.col !== hoverCell.col));
    hoverCell = c2;
    if (changed) render();
  });
  canvas.addEventListener('pointerleave', function () { if (hoverCell) { hoverCell = null; render(); } });
  canvas.addEventListener('pointerdown', function (e) {
    var rect = canvas.getBoundingClientRect();
    handleTap(e.clientX - rect.left, e.clientY - rect.top);
  });
  btnPath.onclick = function () {
    showPath = !showPath;
    btnPath.style.color = showPath ? '#6fd3ff' : '';
    render();
  };
  /* --------------------------------------------------- 放置面板折叠（用户需求）
   * 「收起」后 #panel 只剩标签栏一行，棋盘按腾出的高度重铺满。
   *   · 状态落 localStorage（key: td_panel_collapsed），刷新后保持；默认展开
   *   · 不占 Tab / 空格（这两个键在游戏里有含义），键盘只靠按钮自身的 Enter / Space
   *   · 折叠态下点任一 tab → 先自动展开再切 pane，避免「点了却看不到卡片」的困惑
   *   · 高度一变必须回调 render()：canvas 的 backing store 尺寸是每次 render 时按
   *     clientWidth/Height × dpr 现算的，所以重画一次就自动适配新尺寸，不会发虚
   */
  var panelEl = document.getElementById('panel');
  var paneToggleEl = document.getElementById('paneltoggle');
  var paneIcoEl = document.getElementById('ptico');
  var paneTxtEl = document.getElementById('pttxt');
  var PANEL_LS_KEY = 'td_panel_collapsed';

  /* localStorage 可能被隐私模式 / file:// / 测试桩环境拒绝，一律吞掉异常走默认值 */
  function readPanelCollapsed() {
    try { return window.localStorage.getItem(PANEL_LS_KEY) === '1'; } catch (e) { return false; }
  }
  function savePanelCollapsed(v) {
    try { window.localStorage.setItem(PANEL_LS_KEY, v ? '1' : '0'); } catch (e) {}
  }
  /* 面板高度变了 → 立刻按新尺寸重画；再补一帧兜底
   * （过渡期间主循环每帧都会 render()，但没开局时 state 为 null 主循环不推进） */
  function refitBoard() {
    if (state) render();
    if (window.requestAnimationFrame) {
      window.requestAnimationFrame(function () { if (state) render(); });
    }
  }
  function isPanelCollapsed() { return panelEl.classList.contains('collapsed'); }
  function setPanelCollapsed(v, opts) {
    var c = !!v, o = opts || {};
    panelEl.classList.toggle('collapsed', c);
    if (paneToggleEl) {
      paneToggleEl.setAttribute('aria-expanded', c ? 'false' : 'true');
      paneToggleEl.setAttribute('aria-label', c ? '展开放置面板，让棋盘变小' : '收起放置面板，让棋盘更大');
      paneToggleEl.title = '收起 / 展开放置面板';
    }
    if (paneIcoEl) paneIcoEl.textContent = c ? '▴' : '▾';
    if (paneTxtEl) paneTxtEl.textContent = c ? '展开' : '收起';
    /* 收起时两个 pane 视觉上已隐藏（CSS max-height:0 + visibility:hidden），
     * 再用 aria-hidden 让读屏软件也跳过；展开时还权给 showTab 的 display 逻辑 */
    if (paneBuild) paneBuild.setAttribute('aria-hidden', c ? 'true' : 'false');
    if (paneGlobal) paneGlobal.setAttribute('aria-hidden', c ? 'true' : 'false');
    if (!o.silent) savePanelCollapsed(c);
    if (!o.noRefit) refitBoard();
  }
  /* 折叠结束后再校一次尺寸：过渡是渐变的，最后一帧的 clientHeight 最准 */
  function onPanelTransitionEnd() { refitBoard(); }
  [paneBuild, paneGlobal, panelEl].forEach(function (el) {
    if (el && el.addEventListener) el.addEventListener('transitionend', onPanelTransitionEnd);
  });
  function autoExpandPanel() {
    if (isPanelCollapsed()) setPanelCollapsed(false, { noRefit: true });
  }
  if (paneToggleEl) {
    paneToggleEl.onclick = function () { setPanelCollapsed(!isPanelCollapsed()); };
  }
  /* 初始化：读上次的折叠状态（silent → 不把默认值写回存储；noRefit → 此时还没棋盘） */
  setPanelCollapsed(readPanelCollapsed(), { silent: true, noRefit: true });

  function showTab(which) {
    var g = (which === 'global');
    paneBuild.style.display = g ? 'none' : 'block';
