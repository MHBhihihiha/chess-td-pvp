    paneGlobal.style.display = g ? 'block' : 'none';
    tabBuild.classList.toggle('on', !g);
    tabGlobal.classList.toggle('on', g);
    if (g) buildGlobalCards();
    /* 切 tab 也会改面板高度（两 pane 内容不同高），这里补一次重算——
     * 放在最后，保证「折叠态自动展开 + pane 切换」都落地后再量尺寸 */
    refitBoard();
  }
  tabBuild.onclick = function () { autoExpandPanel(); showTab('build'); };
  tabGlobal.onclick = function () { autoExpandPanel(); showTab('global'); };
  document.getElementById('btnrestart').onclick = function () {
    if (PVP.active) {
      if (PVP.role === 'host') pvpRestart();
      else if (PVP.transport) PVP.transport.send({ type: 'rematch' });
      return;
    }
    newGame();
  };
  document.getElementById('again').onclick = function () {
    if (PVP.active) {
      if (PVP.role === 'host') pvpRestart();
      else if (PVP.transport) PVP.transport.send({ type: 'rematch' });
      return;
    }
    startGame();
  };
  document.getElementById('startbtn').onclick = startGame;
  /* 返回主菜单（规格 §5.4 + 用户拍板：顺带重置一局）：显 #start、隐 #over、newGame
   * （newGame 会把 startedAt 置回 -1，菜单期间不推进模拟；点开始游戏再全量开局） */
  document.getElementById('tomenu').onclick = function () {
    if (PVP.active) pvpLeave();
    overEl.classList.remove('show');
    setStartVisible(true);              // 同时把放置面板收起来（桌面端底部不再露出卡片）
    newGame();
    syncDiffHint();
    setStartMode('ai');
  };

  /* ---------------------------------------------------------------- 主循环 */
  var last = 0, acc = 0, autoTimer = 0, hudTimer = 0;
  function frame(ts) {
    if (!last) last = ts;
    /* dt 上限从 0.1 提到 0.2。
     * 0.1 意味着帧率一旦掉到 10fps 以下（老旧手机、贴图还在解码、后台标签被节流），
     * 真实过了 0.15s 却只给仿真 0.1s —— 仿真按 2/3 速跑，tick 就一路落后对手。
     * 双人锁步下这就是「一方延时 10 秒」的源头之一，所以必须放宽。
     * 单机模式放宽只会让卡顿后追帧更猛，而下面 guard<60 已把单帧最多 3 秒封顶。 */
    var dt = Math.min(0.2, (ts - last) / 1000);
    last = ts;
    renderDt = dt;
    acc += dt;
    var guard = 0;
    var running = startedAt >= 0 && !state.over;   // 「开始游戏」之前 / 已经分出胜负之后都不再推进模拟
    while (running && acc >= C.DT && guard++ < 60) {
      if (PVP.active) {
        /* 双人：不跑 AI，由锁步引擎消费双方命令后推进一 tick。 */
        if (PVP.net) {
          /* step() 返回 false = 对手 tick 还没跟上，本帧不推进（保持两端口径一致）。
           * 把 acc 压回一步之内：否则等待期间会攒一堆积压，放开瞬间猛追几十 tick，
           * 又反过来把对手甩开 —— 抖动会自我放大。 */
          if (!PVP.net.step()) { acc = Math.min(acc, C.DT); break; }
        }
      } else {
        C.update(state, C.DT);
        C.aiUpdate(state, FOE, C.DT);
        // 自动派兵：哪个兵冷却好了就派出去（省手）
        autoTimer += C.DT;
        if (autoDeployEl && autoDeployEl.checked && autoTimer >= 0.5) {
          autoTimer = 0;
          for (var ui = 0; ui < UNIT_ORDER.length; ui++) {
            var k = UNIT_ORDER[ui];
            if (!C.isUnitReady(state, ME, k)) continue;
            if (state.res[ME] < C.DATA.units[k].cost) continue;
            for (var c = 1; c <= C.COLS; c++) {
              if (C.deployUnit(state, ME, k, c).ok) { ui = 99; break; }
            }
          }
        }
      }
      acc -= C.DT;
    }
    /* 草地贴图（L3/L4）是异步加载的：一旦就绪，让背景板重建一次就再也不跑（规范 §B5）。
     * 每 15 帧查一次而不是每帧 —— 省掉每帧一次的字符串查表，延迟最多 250ms，用户感知不到。 */
    if (bgTexPending && (bgTexTick++ % 15) === 0) syncGrassTexture();
    /* 联机角标每 0.5 秒刷一次（每帧写 textContent 会白白触发版面重算） */
    if (PVP.active) { hudTimer += dt; if (hudTimer >= 0.5) { hudTimer = 0; pvpNetHud(); } }
    render();
    if (selectedBuilding) {
      lastDetailRefresh += dt;
      if (lastDetailRefresh > 0.3) { lastDetailRefresh = 0; renderDetail(); }
    }
    if (state.over && !overEl.classList.contains('show')) {
      /* 结束界面填充（规格 §5.1–5.3）：标题/副标题/meta 数据行/双方战绩表/结果剪影 */
      var res = state.winner === ME ? 'win' : state.winner === FOE ? 'lose' : 'draw';
      overCard.className = 'card-r ' + res;
      overText.textContent = { win: '胜利', lose: '战败', draw: '平局' }[res];
      overText.className = 't ' + res;
      /* v21 视角镜像：双方都「自己是蓝方、在下方」，所以结算文案固定用视觉阵营，
       * 不再按 ME 反推逻辑阵营（红方玩家不该看到"你在红方（上方）"）。 */
      var meName = '蓝方';
      var foeName = '红方';
      overSub.textContent = {
        win:  foeName + '大本营已被摧毁',
        lose: meName + '大本营失守——更早布防、升级大本营，稳住经济再谈反推',
        draw: '战至时限，双方大本营均未被摧毁'
      }[res];
      var mm = Math.floor(state.time / 60), ss = ('0' + Math.floor(state.time % 60)).slice(-2);
      overMeta.innerHTML = (PVP.active ? '模式 <b>双人对战</b>' : '难度 <b>' + DIFF_INFO[difficulty].name + '</b>') +
        ' · 用时 <b>' + mm + ':' + ss + '</b>';
      function n(v) { return Math.floor(v).toLocaleString(); }
      function baseCell(team) {
        var b = C.ownBase(state, team);
        if (!b) return '<span class="dead">已摧毁</span>';
        var hp = Math.max(0, Math.floor(b.hp)), pct = Math.max(0, hp / b.hpMax);
        return 'Lv' + C.baseLevelOf(state, team) + ' · ' + n(hp) + '/' + n(b.hpMax) +
          '<div class="bar"><i class="' + (pct < .35 ? 'low' : '') + '" style="width:' + (pct * 100).toFixed(1) + '%"></i></div>';
      }
      overStats.innerHTML =
        '<table><thead><tr><th></th>' +
        '<th class="me"><span class="dot"></span>' + meName + '（你）</th>' +
        '<th class="foe"><span class="dot"></span>' + foeName + (PVP.active ? '（对手）' : '（AI）') + '</th></tr></thead><tbody>' +
        '<tr><td>大本营</td><td class="me">' + baseCell(ME) + '</td><td>' + baseCell(FOE) + '</td></tr>' +
        '<tr><td>累计收入</td><td class="me">' + n(state.stats[ME].income) + ' 金</td><td>' + n(state.stats[FOE].income) + ' 金</td></tr>' +
        '<tr><td>总花费</td><td class="me">' + n(state.stats[ME].spent) + ' 金</td><td>' + n(state.stats[FOE].spent) + ' 金</td></tr>' +
        '<tr><td>派兵数</td><td class="me">' + state.stats[ME].produced + ' 个</td><td>' + state.stats[FOE].produced + ' 个</td></tr>' +
        /* bug 修复：原 (stats[FOE].produced ? '—' : '—') 恒显示 '—'，改为双方真实击杀数 */
        '<tr><td>建筑击杀</td><td class="me">' + state.stats[ME].kills + ' 个</td><td>' + state.stats[FOE].kills + ' 个</td></tr>' +
        '</tbody></table><div class="note">击杀统计自建筑伤害；收入与花费为对局累计值</div>';
      fillFigs(res);
      overEl.classList.add('show');
    }
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', function () { if (state) render(); });
  window.__game = {
    get state() { return state; },
    render: render,
    start: startGame,               // 供测试/自动化用：等价于点「开始游戏」
    select: function (x) { sel = x; render(); },
    inspect: function (b) { selectedBuilding = b; selectedUnit = null; renderDetail(); render(); },
    inspectUnit: function (u) { selectedUnit = u; selectedBuilding = null; renderDetail(); render(); },
    /* 供测试断言：哪些建筑的顶部是「定子」（固定在底座正中、不转身） */
    isStator: function (key) { return !!STATOR_KEYS[key]; },

    /* ---- 贴图调试口 ---- */
    art: ART,
    artStats: function () { return ART.stats(); },
    /* ---- 背景板/草地调试口（美术规范 §B6/B8 的验收脚本用；不参与游戏逻辑） ---- */
    bgStats: function () { return { builds: bgBuilds, ms: bgBuildMs, texPending: bgTexPending, key: bgKey }; },
    syncGrassTexture: syncGrassTexture,     // 供自测：贴图就绪后重建背景板（等价于主循环里的那次检查）
    bgCanvas: function () { return bgCanvas; },
    /* 某建筑此刻会用到哪些贴图（排查「为什么这栋楼还是方块」最快的方式） */
    artFor: function (b) {
      return {
        level: b.level || 1, era: 'e' + ART.eraOf(b.level || 1), branch: b.branch || null,
        base: ART.baseFile(b), top: ART.topFile(b), deco: ART.decoFiles(b),
        baseLoaded: !!ART.img(ART.baseFile(b)),
        topLoaded: !!ART.img(ART.topFile(b))
      };
    },
    /* 朝向：返回某单位最近一次判定出的朝向（down/up/left/right） */
    facingOf: function (u) { return ART.facing(u.id); },
    reloadArt: function () { ART.load(); },
    /* 图鉴的两级（纯字符串，供 dev/dom-test.js 断言数值列没标错）。
     * 第一层：codexIndexHtml('bld'|'unit'|'spell')  —— 翻页浏览的整块 HTML
     * 第二层：codexDetailHtml(kind, key, lv, branch[, cmpOpen])
     * 另给 codexList(cat) 拿条目顺序，测试据此断言「一条都没漏」。 */
    codexIndexHtml: function (cat) { return codexIndexHTML(cat); },
    codexDetailHtml: function (kind, key, lv, branch, cmpOpen) {
      return codexDetailHTML(kind, key, lv, branch, cmpOpen);
    },
    codexList: function (cat) { return cxList(cat).slice(); },

    /* ---- 视角镜像调试口（v21）----
     * 自动化里没法"用眼睛看"红方视角，只能靠这几个口子把渲染层翻过去再验坐标。
     * setFlip 会顺带作废背景板（阵营色调/通道标签跟视角绑定），所以必须走这里而不是改全局。 */
    view: {
      setFlip: setFlip,
      isFlip: function () { return FLIP; },
      /* 逻辑格 → 屏幕矩形（与 cellRect 同一个实现，供测试算"该点哪里"） */
      cellRect: cellRect,
      /* 屏幕点 → 逻辑格（与 pointToCell 同一个实现，供测试断言"点对了没有"） */
      pick: pointToCell,
      vTeam: vTeam,
      facing: vFacing
    }
  };

  /* ============================================================ 图鉴（Codex）
   * v22 重做：两级结构 ——
   *   第一层「翻页浏览」：建筑 / 兵种 / 法术 三个分类，一次只看一件，两侧留残影暗示可翻；
   *   第二层「详情」：左大图（带等级滑轨）+ 右数值，下方「下」键展开各等级对照表。
   *
   * 两条铁律沿用至今：
   *   · 数值全部来自 C.* API（statsForLevel / buildingUpgradeCost / baseLevels），零硬编码；
   *   · 生成 HTML 的都是**纯字符串函数**（不碰 DOM），node 下可直接断言数值没标错
   *     （dev/dom-test.js 走的就是这条路）。
   *
   * 贴图合成与棋盘同一套规则：底座贴底居中(78%) + 武器层中心 52% 高(90%)。
   * 这里不重写，而是造一个「假建筑」复用 ART.baseFile / ART.topFile，
   * 保证图鉴里的大楼 = 棋盘上的那栋楼。
   * ========================================================================== */
  var codexFilled = false;
  function openCodex() {
    var el = document.getElementById('codex');
    if (!el) return;
    el.hidden = false;
    el.classList.add('show');
    codexFilled = true;
    try { bindCodexTabs(); mountBrowse(); } catch (e) { /* 图鉴渲染失败静默降级，主流程不受影响 */ }
  }
  function closeCodex() {
    var el = document.getElementById('codex');
    if (!el) return;
    el.hidden = true;
    el.classList.remove('show');
  }
  function bindCodexTabs() {
    if (!document.querySelectorAll) return;
    var tabs = document.querySelectorAll('#codex .cx-tab');
    Array.prototype.forEach.call(tabs, function (t) {
      t.onclick = function () { try { setCat(t.getAttribute('data-cat')); } catch (e) {} };
    });
  }

  /* ---- 浏览状态 ----
   * 分类用 bld / unit / spell。大本营并入 bld 的第一项 —— 它本来就是一栋建筑，
   * 单独占一个 Tab 只会让「建筑」这一栏少一栋、让玩家多按一次。
   * 每个分类各自记住「翻到第几张」和「看到第几级」，来回切分类不会丢位置。 */
  var CX_CATS = ['bld', 'unit', 'spell'];
  var cxState = {
    cat: 'bld',
    pos: { bld: 0, unit: 0, spell: 0 },
    lv: { bld: 1, unit: 1, spell: 1 },
    branch: { bld: null },
    cmp: false            // 第二层是否展开「各等级对比」
  };

  /* 某分类的全部条目，顺序即翻页顺序。大本营排建筑类第一位：
   * 它是最关键的建筑，也是新手第一个该看懂的东西。 */
  function cxList(cat) {
    if (!C || !C.DATA) return [];
    if (cat === 'bld') {
      var order = (typeof BUILD_ORDER !== 'undefined' && BUILD_ORDER)
        ? BUILD_ORDER : Object.keys(C.DATA.buildings);
      return ['base'].concat(order);
    }
    if (cat === 'unit') {
      return ((typeof UNIT_ORDER !== 'undefined' && UNIT_ORDER)
        ? UNIT_ORDER : Object.keys(C.DATA.units)).slice();
    }
    if (cat === 'spell') return C.DATA.spells.map(function (s) { return s.key; });
    return [];
  }
  /* 首尾循环：翻到最后一张再往右会回到第一张（图鉴本来就该能一直翻下去）。 */
  function cxPos(cat) {
    var list = cxList(cat);
    if (!list.length) return 0;
    var p = cxState.pos[cat] || 0;
    return ((p % list.length) + list.length) % list.length;
  }
  function cxCurKey(cat) { return cxList(cat)[cxPos(cat)]; }
  function cxName(cat, key) {
    if (cat === 'bld') return key === 'base' ? '大本营' : ((C.DATA.buildings[key] || {}).name || key);
    if (cat === 'unit') return (C.DATA.units[key] || {}).name || key;
    var sp = cxSpell(key);
    return sp ? sp.name : key;
  }
  function cxSpell(key) {
    if (!C || !C.DATA) return null;
    var out = null;
    C.DATA.spells.forEach(function (s) { if (s.key === key) out = s; });
    return out;
  }
  /* 该分类的最大等级：建筑/大本营有等级，兵种/法术没有（返回 0）。 */
  function cxMaxLv(cat, key) {
    if (cat === 'bld') {
      if (key === 'base') return C.DATA.baseLevels.length;
      var d = C.DATA.buildings[key];
      return (d && (d.maxLevel || 10)) || 10;
    }
    return 0;
  }

  /* 用「假建筑」复用 ART 的两层取图 */
  function cxArtFiles(key, lv, branch) {
    var def = (key === 'base') ? { key: 'base', isBase: true }
                               : (C && C.DATA && C.DATA.buildings ? C.DATA.buildings[key] : null);
    if (!def) return { base: null, top: null };
    /* 分支只在 L5 起才影响外观，L1-4 一律基础武器 */
    var fake = { def: def, level: lv || 1, branch: (lv || 1) >= 5 ? (branch || null) : null, team: 'blue' };
    try { return { base: ART.baseFile(fake), top: ART.topFile(fake) }; }
    catch (e) { return { base: null, top: null }; }
  }
  function cxGlyph(key) {
    if (key === 'base') return { g: '基', c: '#8fe06a' };
    var d = C.DATA.buildings[key];
    return d ? { g: d.glyph, c: d.color } : { g: '?', c: '#9db89a' };
  }

  /* ---------- 数值格式 / 分支 / 每级单元格（沿用旧实现） ---------- */
  function fmtNum(v) {
    if (v == null) return '—';
    if (typeof v !== 'number') return v;
    return (Math.round(v * 10) / 10).toLocaleString();
  }
  function bldBranches(key) {
    var out = [];
    if (C && C.DATA && C.DATA.branches) {
      Object.keys(C.DATA.branches).forEach(function (k) {
        var bs = C.DATA.branches[k];
        if (bs && bs.parent === key) out.push(bs);
      });
    }
    return out;
  }
  function lvCell(def, L, stat, branches) {
    if (branches.length < 2 || L <= 4) return { single: true, v: C.statsForLevel(def, L, null)[stat] };
    var va = C.statsForLevel(def, L, branches[0].key)[stat];
    var vb = C.statsForLevel(def, L, branches[1].key)[stat];
    /* v 必须一起带上：两分支同值时走 single 分支，读的就是 v。
     * 少了这一行，L5+ 的「生命」「射程」这种两分支一致的属性会整列显示成 —。 */
    return { single: (va === vb), v: va, a: va, b: vb };
  }
  function cellHTML(def, L, stat, branches, asPct) {
    var c = lvCell(def, L, stat, branches);
    function show(v) {
      if (v == null) return '—';
      if (asPct) return Math.round(v * 100) + '%';
      if (stat === 'auraRadius') return (v * 2 + 1) + '×' + (v * 2 + 1);
      return fmtNum(v);
    }
    if (c.single) return show(c.v);
    return '<span class="ba" style="color:' + branches[0].color + '">' + show(c.a) + '</span>' +
           '<span class="sep">/</span>' +
           '<span class="bb" style="color:' + branches[1].color + '">' + show(c.b) + '</span>';
  }
  function funcLabel(priority, air, targets) {
    var role = priority === 'siege' ? '拆迁（只拆建筑与大本营）' : '清剿（只打敌兵与大本营）';
    var dom = targets === 'both' ? '对地+对空' : '仅对地';
    return role + (air ? ' · 飞行' : '') + ' · ' + dom;
  }

  /* ---------- 大图 / 残影共用的图片层 ----------
   * 建筑两层叠法（底座贴底 + 武器居中）与棋盘一模一样；兵种是单张 idle；
   * 法术用 spell_*.png，那张图自带光晕，所以只给 72% 尺寸留出呼吸空间。
   * 残影不另画一套 —— 同一份 HTML 塞进更小更淡的容器即可。 */
  function cxMediaInner(cat, key, lv, branch) {
    if (cat === 'unit') {
      var u = C.DATA.units[key];
      if (!u) return '';
      return '<img class="u" src="art/v9/unit_' + key + '_blue_idle.png" alt="" onerror="this.remove()">' +
             '<span class="gt" style="color:' + u.color + '">' + u.glyph + '</span>';
    }
    if (cat === 'spell') {
      var sp = cxSpell(key);
      if (!sp) return '';
      return '<img class="s" src="art/v9/spell_' + key + '.png" alt="" style="color:' + sp.color +
             '" onerror="this.remove()">' +
             '<span class="gt" style="color:' + sp.color + '">' + sp.glyph + '</span>';
    }
    var f = cxArtFiles(key, lv, branch), h = '';
    if (f.base) h += '<img class="b" src="art/v9/' + f.base + '" alt="" onerror="this.remove()">';
    if (f.top)  h += '<img class="t" src="art/v9/' + f.top + '" alt="" onerror="this.remove()">';
    if (!h) { var gl = cxGlyph(key); h = '<span class="gt" style="color:' + gl.c + '">' + gl.g + '</span>'; }
    return h;
  }
  /* 兼容旧签名（codexDetailHTML 与调试口仍在用 'base' / 'bld' / 'unit' 三值） */
  function cxHeroInner(kind, key, lv, branch) {
    var cat = (kind === 'unit') ? 'unit' : (kind === 'spell' ? 'spell' : 'bld');
    return cxMediaInner(cat, key, lv, branch);
  }

  /* ---------- 第一层：翻页浏览 ---------- */
  /* 副标题只给一句「这是什么」，不铺数值 —— 数值是第二层的事。
   * 这一层要解决的是「认图」，塞满数字反而没人看得进去。 */
  function cxSubLine(cat, key) {
    if (cat === 'bld') {
      if (key === 'base') return '核心建筑 · ' + C.DATA.baseLevels.length + ' 级 · 被摧毁即失败';
      var d = C.DATA.buildings[key];
      if (!d) return '';
      var role = d.incomeByLevel ? '产出金币' : (d.aura ? '光环防护' : '攻击塔');
      return role + ' · ' + d.cost + ' 金 · ' + (d.maxLevel || 10) + ' 级';
    }
    if (cat === 'unit') {
      var u = C.DATA.units[key];
      if (!u) return '';
      return u.cost + ' 金 · 冷却 ' + u.deployCd + ' 秒' + (u.air ? ' · 飞行' : '');
    }
    var sp = cxSpell(key);
    if (!sp) return '';
    return '大本营 Lv' + sp.unlockBaseLevel + ' 解锁 · 冷却 ' + sp.cooldown + ' 秒';
  }

  /* 主图：整块可点，点了进第二层 */
  function cxFocusHTML(cat, key, lv, branch) {
    return '<div class="cx-fig">' + cxMediaInner(cat, key, lv, branch) + '</div>' +
      '<div class="cx-fname">' + cxName(cat, key) + '</div>' +
      '<div class="cx-fsub">' + cxSubLine(cat, key) + '</div>';
  }

  /* 残影：相邻项的图。**只放图不放字** —— 一旦写了名字，眼睛就会去读，
   * 而这一层的任务仅仅是告诉你「旁边还有东西」。 */
  function cxGhostHTML(cat, offset) {
    var list = cxList(cat);
    if (list.length < 2) return '';
    var p = cxPos(cat) + offset;
    p = ((p % list.length) + list.length) % list.length;
    var key = list[p];
    var lv = (cat === 'bld') ? (cxState.lv.bld || 1) : 1;
    return '<div class="gf">' + cxMediaInner(cat, key, lv, null) + '</div>';
  }

  /* 完整第一层 HTML。挂载时是拆开填三个容器，但这个整体版本对测试/截图更方便。 */
  function codexIndexHTML(cat) {
    cat = cat || cxState.cat;
    if (!C || !C.DATA) return '';
    var key = cxCurKey(cat);
    var lv = (cat === 'bld') ? (cxState.lv.bld || 1) : 1;
    return '<div class="cx-ghost l">' + cxGhostHTML(cat, -1) + '</div>' +
      '<div class="cx-focus">' + cxFocusHTML(cat, key, lv, cxState.branch.bld) + '</div>' +
      '<div class="cx-ghost r">' + cxGhostHTML(cat, 1) + '</div>';
  }

  /* ---------- 数值小卡 ---------- */
  function cxKV(k, v, next, gold) {
    return '<span class="kv"><span class="k">' + k + '</span>' +
      '<span class="v' + (gold ? ' gold' : '') + '">' + v +
      (next != null ? '<span class="nx">→ ' + next + '</span>' : '') + '</span></span>';
  }

  /* ---------- 全等级对照表（保留旧实现的信息量） ---------- */
  function cxBaseTable() {
    var BL = C.DATA.baseLevels;
    var th = '<th>数值 \ 等级</th>';
    BL.forEach(function (b) { th += '<th>Lv' + b.level + '</th>'; });
    function row(label, fn, cls) {
      var tds = '<td class="row">' + label + '</td>';
      BL.forEach(function (b) { tds += '<td' + (cls ? ' class="' + cls + '"' : '') + '>' + fn(b) + '</td>'; });
      return '<tr>' + tds + '</tr>';
    }
    var body = row('生命', function (b) { return b.hp.toLocaleString(); }) +
      row('收入/秒', function (b) { return b.income; }, 'gold') +
      row('升级花费', function (b) { return b.upgradeCost != null ? b.upgradeCost + ' 金' : '—'; }, 'gold') +
      row('解锁法术', function (b) {
        var s = C.DATA.spells.filter(function (x) { return x.unlockBaseLevel === b.level; })
          .map(function (x) { return x.name; }).join('、');
        return s || '—';
      });
    return '<div class="cx-tw"><table class="cx-lv"><thead><tr>' + th + '</tr></thead><tbody>' +
      body + '</tbody></table></div>';
  }
  function cxBldTable(key) {
    var def = C.DATA.buildings[key];
    if (!def) return '';
    var branches = bldBranches(key);
    var maxLv = def.maxLevel || 10;
    var rows = [{ label: '生命', stat: 'hp' }];
    if (def.atk != null)         rows.push({ label: '攻击', stat: 'atk' });
    if (def.atkInterval != null) rows.push({ label: '攻速(秒)', stat: 'atkInterval' });
    if (def.range != null)       rows.push({ label: '射程(格)', stat: 'range' });
    if (def.incomeByLevel)       rows.push({ label: '收入/秒', stat: 'income' });
    if (def.aura) {
      rows.push({ label: '保护范围', stat: 'auraRadius' });
      rows.push({ label: '减伤', stat: 'auraDR', asPct: true });
    }
    var th = '<th>数值 \ 等级</th>';
    for (var L = 1; L <= maxLv; L++)
      th += '<th class="' + (L === 5 && branches.length >= 2 ? 'lv5' : '') + '">L' + L + '</th>';
    var body = '';
    rows.forEach(function (r) {
      var tds = '<td class="row">' + r.label + '</td>';
      for (var L2 = 1; L2 <= maxLv; L2++) tds += '<td>' + cellHTML(def, L2, r.stat, branches, r.asPct) + '</td>';
      body += '<tr>' + tds + '</tr>';
    });
    var costTds = '<td class="row">升级花费</td>';
    for (var L3 = 1; L3 <= maxLv; L3++) {
      var c = (L3 < maxLv) ? C.buildingUpgradeCost({ def: def, level: L3 }) : null;
      costTds += '<td class="gold">' + (c != null ? c + ' 金' : '—') + '</td>';
    }
    body += '<tr>' + costTds + '</tr>';
    return '<div class="cx-tw"><table class="cx-lv"><thead><tr>' + th + '</tr></thead><tbody>' +
      body + '</tbody></table></div>';
  }

  /* ---------- 第二层的右侧：数值 ---------- */
  function cxFactsHTML(kind, key, lv, branch) {
    /* 通用渲染：把 bldStatRows/baseStatRows 的行画成 cxKV 小卡（v18 统一出口） */
    var rowsToKV = function (rows) {
      return rows.map(function (r) { return cxKV(r.k, r.v, r.next, r.gold); }).join('');
    };
    /* 大本营：既接受旧签名 kind='base'，也接受新签名 kind='bld' + key='base' */
    if (kind === 'base' || (kind === 'bld' && key === 'base')) {
      var BL = C.DATA.baseLevels, cur = BL[lv - 1];
      if (!cur) return '';
      var sp = C.DATA.spells.filter(function (s) { return s.unlockBaseLevel === lv; })
        .map(function (s) { return s.name; });
      var kv = rowsToKV(baseStatRows(lv, sp)) +
        cxKV('升级花费', cur.upgradeCost != null ? cur.upgradeCost + ' 金' : '已满级', null, true) +
        cxKV('防御射程', '2 格（外围 5×5）', null) +
        cxKV('自我修复', '8 秒未挨打后 1%/秒', null);
      /* 注意：全等级对照表不在这里出，改由第二层下方「各等级数值对比」折叠区统一渲染 ——
       * 否则同一张表在右侧和折叠区各来一份，屏幕直接被撑爆。 */
      return '<div class="cxd-name">大本营<span class="tag2">Lv' + lv + ' / ' + BL.length + '</span></div>' +
        '<div class="cxd-desc">被摧毁即失败；不受攻击时会自我修复血量。等级同时决定生命、金币产出与可用法术。</div>' +
        '<div class="cx-kv">' + kv + '</div>';
    }
    if (kind === 'unit') {
      var d = C.DATA.units[key];
      if (!d) return '';
      var pct = function (l) { return Math.round((C.globalMulOf(l, 0.15, 0.30) - 1) * 100); };
      var ukv = cxKV('造价', d.cost + ' 金', null, true) +
        cxKV('出兵冷却', d.deployCd + ' 秒', null) +
        cxKV('生命', d.hp, null) +
        cxKV('护甲', d.armor, null) +
        cxKV('攻击', d.atk, null) +
        cxKV('攻速', d.atkInterval + ' 秒', null) +
        cxKV('射程', d.range + ' 格', null) +
        cxKV('移速', d.speed + ' 格/秒', null) +
        '<span class="kv wide"><span class="k">职能</span><span class="v">' +
          funcLabel(d.priority, d.air, d.targets) + '</span></span>';
      var ghead = '<th class="lv">科技 \ 等级</th>';
      for (var L = 0; L <= 10; L++) ghead += '<th>Lv' + L + '</th>';
      function grow(name) {
        var tds = '<td class="lv">' + name + '</td>';
        for (var L2 = 0; L2 <= 10; L2++) tds += '<td class="pct">+' + pct(L2) + '%</td>';
        return '<tr>' + tds + '</tr>';
      }
      return '<div class="cxd-name">' + d.name + '<span class="tag2">' +
        (d.air ? '空中单位' : '地面单位') + '</span></div>' +
        '<div class="cxd-desc">' + d.desc + '</div>' +
        '<div class="cx-kv">' + ukv + '</div>' +
        '<div class="cxd-sub">总体升级对士兵的加成（兵种本身没有单兵等级）</div>' +
        '<div class="cx-gup"><table class="cx-g"><thead><tr>' + ghead + '</tr></thead><tbody>' +
        grow('士兵攻击') + grow('士兵生命') + '</tbody></table></div>';
    }
    /* 法术：没有等级，所以给的不是「几级多少伤」，而是「怎么用、什么时候能拿到」——
     * 解锁等级、冷却、范围、作用对象，这些才是挑法术时真正要比的四件事。 */
    if (kind === 'spell') {
      var spd = cxSpell(key);
      if (!spd) return '';
      /* aoe 是「格距离半径」，不是边长：aoe=1 实际盖 3×3。
       * 直接写 aoe+'×'+aoe 会把火球印成 1×1，和 desc 里的「3×3 范围」自相矛盾。 */
      var edge = spd.aoe * 2 + 1;
      var skv = cxKV('解锁等级', '大本营 Lv' + spd.unlockBaseLevel, null, true) +
        cxKV('冷却', spd.cooldown + ' 秒', null) +
        cxKV('作用范围', edge + '×' + edge + ' 格', null) +
        cxKV('作用对象', spd.affects === 'enemy' ? '敌方单位与建筑'
                          : (spd.affects === 'ally' ? '己方单位与建筑' : '全场'), null);
      return '<div class="cxd-name">' + spd.name + '<span class="tag2">法术</span></div>' +
        '<div class="cxd-desc">' + (spd.desc || '') + '</div>' +
        '<div class="cx-kv">' + skv + '</div>';
    }
    /* bld */
    var bd = C.DATA.buildings[key];
    if (!bd) return '';
    var maxLv = bd.maxLevel || 10;
    var brs = bldBranches(key);
    var br = null;
    if (lv >= 5) {
      brs.forEach(function (b) { if (b.key === branch) br = b; });
      if (!br && brs.length) br = brs[0];
    }
    var st = C.statsForLevel(bd, lv, br ? br.key : null);
    var nxt = lv < maxLv ? C.statsForLevel(bd, lv + 1, br ? br.key : null) : null;
    var cost = C.buildingUpgradeCost({ def: bd, level: lv });
    /* 与战斗面板同一份行（bldStatRows），只是画成小卡 */
    var kv2 = rowsToKV(bldStatRows(bd, st, nxt, {}));
    kv2 += cxKV('升级花费', cost != null ? cost + ' 金' : '已满级', null, true);
    var branchLine = '';
    if (brs.length) {
      branchLine = '<div class="cxd-branches">' + brs.map(function (b) {
        return '<span class="bx"' + (br && br.key === b.key ? ' on' : '') + ' style="color:' + b.color + '">' +
          b.name + '：' + b.desc + '</span>';
      }).join('') + '</div>';
    }
    return '<div class="cxd-name">' + bd.name +
      (br ? '<span class="tag2" style="color:' + br.color + '">' + br.name + '</span>' : '') +
      '<span class="tag2">Lv' + lv + ' / ' + maxLv + '</span></div>' +
      '<div class="cxd-desc">' + (br ? br.desc : (bd.desc || '')) + '</div>' +
      '<div class="cx-kv">' + kv2 + '</div>' + branchLine;
  }

  /* ---------- 等级滑动轨 / 分支选择 ---------- */
  function cxlvBarHTML(kind, lv, maxLv) {
    var ticks = '';
    for (var i = 1; i <= maxLv; i++) ticks += '<span class="tk' + (i === lv ? ' on' : '') + '">' + i + '</span>';
    return '<div class="cx-lvbar">' +
      '<div class="cx-lvhead"><span>等级</span><b data-lvtext>Lv' + lv + '</b></div>' +
      '<input class="cx-range" type="range" min="1" max="' + maxLv + '" step="1" value="' + lv +
        '" data-range aria-label="拖动选择等级">' +
      '<div class="cx-ticks">' + ticks + '</div></div>';
  }
  function cxBranchPickInner(key, lv, branch) {
    var brs = bldBranches(key);
    if (!brs.length || lv < 5) return '';
    var cur = branch || brs[0].key;
    return '<span class="bplabel">L5 分支</span>' + brs.map(function (b) {
      return '<button type="button" class="cx-bp' + (b.key === cur ? ' on' : '') + '" data-bp="' + b.key +
        '" style="color:' + b.color + '">' + b.name + '</button>';
    }).join('');
  }

  /* ---------- 第二层：完整详情（纯字符串，测试直接调它） ----------
   * v22 新增：正下方「各等级数值对比」折叠区。
   * 为什么要折叠而不是直接铺开：等级表有 10 列，铺开会把右下角的数值挤到屏幕外，
   * 玩家一进来只想看「这一级什么水平」，对比是第二步的需求。
   * 兵种 / 法术没有逐级数值，因此**不显示这个键** —— 摆一个空键比不摆更让人困惑。 */
  function codexDetailHTML(kind, key, lv, branch, cmpOpen) {
    if (!C || !C.DATA) return '';
    var cat = (kind === 'base') ? 'bld' : (kind || 'bld');
    var ckey = (kind === 'base') ? 'base' : key;
    if (cat === 'bld' && !ckey) ckey = 'base';
    var maxLv = (cat === 'bld') ? cxMaxLv('bld', ckey) : 0;
    if (maxLv) { if (!lv || lv < 1) lv = 1; if (lv > maxLv) lv = maxLv; }
    var bpick = (cat === 'bld' && ckey !== 'base') ? cxBranchPickInner(ckey, lv, branch) : '';

    var downBtn = maxLv
      ? '<button type="button" class="cx-downbtn' + (cmpOpen ? ' open' : '') + '" data-cmpbtn>' +
        '<span class="ar">▾</span>' + (cmpOpen ? '收起各等级对比' : '各等级数值对比') + '</button>'
      : '';
    var cmpBody = maxLv
      ? '<div class="cx-cmp"' + (cmpOpen ? '' : ' hidden') + ' data-cmppanel>' +
        '<div class="cmptitle">' + cxName(cat, ckey) + ' · L1 – L' + maxLv + '</div>' +
        (ckey === 'base' ? cxBaseTable() : cxBldTable(ckey)) + '</div>'
      : '';

    return '<div class="cx-detail" data-kind="' + kind + '">' +
      '<div class="cx-dtop">' +
        '<button type="button" class="cx-back" data-back="1">← 返回</button>' +
        '<span class="cx-didx">' + (cxPos(cat) + 1) + ' / ' + cxList(cat).length + '</span>' +
      '</div>' +
      '<div class="cx-detail-grid">' +
        '<div class="cx-hero">' +
          '<div class="cx-hero-stage" data-hero' + (cat === 'unit' ? ' data-unit="1"' : '') + '>' +
            cxHeroInner(cat, ckey, lv, branch) + '</div>' +
          (maxLv ? cxlvBarHTML(cat, lv, maxLv) : '') +
          '<div class="cx-branchpick" data-branchpick' + (bpick ? '' : ' hidden') + '>' + bpick + '</div>' +
        '</div>' +
        '<div class="cx-facts" data-facts>' + cxFactsHTML(cat, ckey, lv, branch) + '</div>' +
      '</div>' +
      downBtn + cmpBody +
      '</div>';
  }

  /* ---------- 挂载 + 交互（唯一碰 DOM 的一层） ---------- */
  function cxEl(id) {
    return (typeof document !== 'undefined' && document.getElementById) ? document.getElementById(id) : null;
  }
  function cxSetHidden(el, hidden) {
    if (!el) return;
    if (hidden) el.setAttribute('hidden', '');
    else el.removeAttribute('hidden');
  }

  /* 分支合法性：L5 起才有分支；换了建筑或降级要回退到 A 支 */
  function normalizeBranch(key, lv) {
    if (key === 'base') { cxState.branch.bld = null; return; }
    var brs = bldBranches(key);
    if (lv < 5 || !brs.length) { cxState.branch.bld = null; return; }
    var ok = false;
    brs.forEach(function (b) { if (b.key === cxState.branch.bld) ok = true; });
    if (!ok) cxState.branch.bld = brs[0].key;
  }

  /* 分类切换 */
  function setCat(cat) {
    if (CX_CATS.indexOf(cat) < 0) return;
    cxState.cat = cat;
    cxState.cmp = false;
    if (typeof document !== 'undefined' && document.querySelectorAll) {
      Array.prototype.forEach.call(document.querySelectorAll('#codex .cx-tab'), function (t) {
        var on = t.getAttribute('data-cat') === cat;
        t.classList.toggle('on', on);
        t.setAttribute('aria-selected', on ? 'true' : 'false');
        t.tabIndex = on ? 0 : -1;
      });
    }
    cxSetHidden(cxEl('cxbrowse'), false);
    cxSetHidden(cxEl('cxdetail'), true);
    mountBrowse(0);
  }

  /* ---------------- 第一层：翻页浏览 ---------------- */
  function mountBrowse(dir) {
    if (!C || !C.DATA) return;
    var cat = cxState.cat, list = cxList(cat);
    if (!list.length) return;
    var key = cxCurKey(cat);
    var lv = (cat === 'bld') ? (cxState.lv.bld || 1) : 1;

    var gl = cxEl('cxghostl'), gr = cxEl('cxghostr'), fr = cxEl('cxfocus');
    if (gl) gl.innerHTML = cxGhostHTML(cat, -1);
    if (gr) gr.innerHTML = cxGhostHTML(cat, 1);
    if (fr) {
      fr.innerHTML = cxFocusHTML(cat, key, lv, cxState.branch.bld);
      if (dir) {
        /* 摘掉再加、中间强制一次回流：否则连续翻页时动画只会播第一次，
         * 后面几次看起来是「图突然换了」而不是「滑过去」。 */
        fr.classList.remove('roll-next', 'roll-prev');
        if (fr.offsetWidth !== undefined) void fr.offsetWidth;
        fr.classList.add(dir > 0 ? 'roll-next' : 'roll-prev');
      }
      fr.onclick = function () { enterDetail(); };
      fr.onkeydown = function (e) {
        if (e && (e.key === 'Enter' || e.key === ' ')) {
          if (e.preventDefault) e.preventDefault();
          enterDetail();
        }
      };
    }
    var pv = cxEl('cxprev'), nx = cxEl('cxnext');
    if (pv) { pv.disabled = list.length < 2; pv.onclick = function () { cxTurn(-1); }; }
    if (nx) { nx.disabled = list.length < 2; nx.onclick = function () { cxTurn(1); }; }
  }
  function cxTurn(dir) {
    var cat = cxState.cat;
    cxState.pos[cat] = cxPos(cat) + dir;
    cxState.cmp = false;
    mountBrowse(dir);
  }
  function enterDetail() {
    cxState.cmp = false;
    cxSetHidden(cxEl('cxbrowse'), true);
    cxSetHidden(cxEl('cxdetail'), false);
    mountDetail();
  }
  function backToBrowse() {
    cxSetHidden(cxEl('cxdetail'), true);
    cxSetHidden(cxEl('cxbrowse'), false);
    mountBrowse(0);
  }

  /* ---------------- 第二层：详情 ---------------- */
  function cxCmpInner(cat, key) {
    if (cat !== 'bld') return '';
    var mx = cxMaxLv('bld', key);
    return '<div class="cmptitle">' + cxName('bld', key) + ' · L1 – L' + mx + '</div>' +
      (key === 'base' ? cxBaseTable() : cxBldTable(key));
  }
  function mountDetail() {
    var wrap = cxEl('cxdscroll');
    if (!wrap || !C || !C.DATA) return;
    var cat = cxState.cat, key = cxCurKey(cat);
    var lv = (cat === 'bld') ? (cxState.lv.bld || 1) : 1;
    if (cat === 'bld') normalizeBranch(key, lv);
    wrap.innerHTML = codexDetailHTML(cat, key, lv, cxState.branch.bld, cxState.cmp);
    if (wrap.scrollTop !== undefined) wrap.scrollTop = 0;   // 换了一件就从头上看
    var pv0 = cxEl('cxdprev'), nx0 = cxEl('cxdnext');
    if (pv0) pv0.disabled = cxList(cat).length < 2;
    if (nx0) nx0.disabled = cxList(cat).length < 2;
    if (!wrap.querySelector) return;

    var heroEl = wrap.querySelector('[data-hero]');
    var factsEl = wrap.querySelector('[data-facts]');
    var lvtextEl = wrap.querySelector('[data-lvtext]');
    var rangeEl = wrap.querySelector('[data-range]');
    var bpEl = wrap.querySelector('[data-branchpick]');
    var cmpPanel = wrap.querySelector('[data-cmppanel]');
    var cmpBtn = wrap.querySelector('[data-cmpbtn]');
    var backEl = wrap.querySelector('.cx-back');

    /* 只重画「跟着等级变」的部分，不整块重建 ——
     * 整块重建会让 range 输入框失焦，拖着拖着手感就断了。 */
    function paint() {
      var k = cxCurKey(cat);
      var l = (cat === 'bld') ? (cxState.lv.bld || 1) : 1;
      if (cat === 'bld') normalizeBranch(k, l);
      if (heroEl) heroEl.innerHTML = cxHeroInner(cat, k, l, cxState.branch.bld);
      if (factsEl) factsEl.innerHTML = cxFactsHTML(cat, k, l, cxState.branch.bld);
      if (lvtextEl) lvtextEl.textContent = 'Lv' + l;
      if (bpEl) {
        var inner = cxBranchPickInner(k, l, cxState.branch.bld);
        bpEl.innerHTML = inner;
        if (inner) bpEl.removeAttribute('hidden'); else bpEl.setAttribute('hidden', '');
        wireBranch();
      }
      var tks = wrap.querySelectorAll('.cx-ticks .tk');
      if (tks) {
        Array.prototype.forEach.call(tks, function (t, i) {
          t.className = 'tk' + ((i + 1) === l ? ' on' : '');
        });
      }
    }
    function wireBranch() {
      if (!bpEl || !bpEl.querySelectorAll) return;
      Array.prototype.forEach.call(bpEl.querySelectorAll('.cx-bp'), function (b) {
        b.onclick = function () { cxState.branch.bld = b.getAttribute('data-bp'); paint(); };
      });
    }
    if (rangeEl) rangeEl.oninput = function () { cxState.lv.bld = +rangeEl.value || 1; paint(); };
    if (backEl) backEl.onclick = backToBrowse;
    if (cmpBtn) cmpBtn.onclick = function () {
      cxState.cmp = !cxState.cmp;
      cxSetHidden(cmpPanel, !cxState.cmp);
      cmpBtn.classList.toggle('open', cxState.cmp);
      cmpBtn.innerHTML = '<span class="ar">▾</span>' +
        (cxState.cmp ? '收起各等级对比' : '各等级数值对比');
      /* 展开后把表格滚进视野：不然点了「下」屏幕上什么都没动，
       * 玩家会以为键没反应（表格在折叠区下方，可能整张都在屏幕外）。 */
      if (cxState.cmp && wrap.scrollTo) {
        try { wrap.scrollTo({ top: wrap.scrollHeight, behavior: 'smooth' }); }
        catch (e) { wrap.scrollTop = wrap.scrollHeight; }
      }
    };
    if (pv0) pv0.onclick = function () { cxTurnDetail(-1); };
    if (nx0) nx0.onclick = function () { cxTurnDetail(1); };
    wireBranch();
  }
  function cxTurnDetail(dir) {
    var cat = cxState.cat;
    cxState.pos[cat] = cxPos(cat) + dir;
    cxState.cmp = false;
    mountDetail();
  }

  /* 入口 / 关闭 按钮 + 键盘操作（纯展示：不开局、不推进模拟） */
  try {
    var codexOpenBtn = document.getElementById('codexopen');
    if (codexOpenBtn) codexOpenBtn.onclick = openCodex;
    var codexCloseBtn = document.getElementById('codexclose');
    if (codexCloseBtn) codexCloseBtn.onclick = closeCodex;
    if (document.addEventListener) {
      document.addEventListener('keydown', function (e) {
        var el = document.getElementById('codex');
        if (!e || !el || el.hidden) return;
        var k = e.key;
        var dw = cxEl('cxdetail'), detailOpen = !!(dw && !dw.hidden);

        /* Esc 分两层退：详情 → 返回列表，列表 → 关掉图鉴。
         * 一步就关会让「我只想退一层」的人整个重开。 */
        if (k === 'Escape') {
          if (detailOpen) backToBrowse(); else closeCodex();
          return;
        }
        if (k === 'ArrowLeft' || k === 'ArrowRight') {
          /* 滑轨聚焦时方向键是它自己的（调等级），别抢 */
          var tag = (e.target && e.target.tagName) || '';
          if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
          if (e.preventDefault) e.preventDefault();
          if (detailOpen) cxTurnDetail(k === 'ArrowRight' ? 1 : -1);
          else cxTurn(k === 'ArrowRight' ? 1 : -1);
          return;
        }
        if (!detailOpen) {
          if (k === 'Enter' || k === ' ' || k === 'ArrowUp') {
            if (e.preventDefault) e.preventDefault();
            enterDetail();
          }
          return;
        }
        /* 详情里「↓」= 展开/收起各等级对比，和屏幕上的「下」键同一个入口 */
        if (k === 'ArrowDown') {
          var sc = cxEl('cxdscroll');
          var cb = sc && sc.querySelector ? sc.querySelector('[data-cmpbtn]') : null;
          if (cb) { if (e.preventDefault) e.preventDefault(); cb.click(); }
        }
      });
    }
  } catch (e) {}

  /* 调试口（截图 / 自测用，正常玩不会触发）：
   *   #codex              打开图鉴（建筑分类第一件 = 大本营）
   *   #codex=unit         打开并切到「兵种」
   *   #codex=bld,ward,5   打开建筑页、翻到防御塔、进详情并停在 Lv5
   *   #codex=spell,fireball  打开法术页并进入「火球」详情
   * 这样无头浏览器不用模拟点击也能截到任意一层。 */
  (function () {
    try {
      var h = (typeof location !== 'undefined' && location.hash) ? location.hash.replace(/^#/, '') : '';
      if (h.indexOf('codex') !== 0) return;
      openCodex();
      var rest = h.indexOf('=') >= 0 ? h.split('=')[1] : '';
      var parts = rest ? rest.split(',') : [];
      var cat = parts[0] || 'bld';
      if (CX_CATS.indexOf(cat) < 0) return;
      setCat(cat);
      if (parts[1]) {
        var idx = cxList(cat).indexOf(parts[1]);
        if (idx >= 0) cxState.pos[cat] = idx;
        if (parts[2] && cat === 'bld') cxState.lv.bld = +parts[2] || 1;
        mountBrowse(0);
        enterDetail();
      }
    } catch (e) {}
  })();

  ART.load();   // 预加载 v9 贴图（没加载完的部件自动走矢量兜底，不会卡画面）
  // 先建一局（但 startedAt 仍是 -1，所以模拟不会跑），等玩家点「开始游戏」
  buildDiffCards();
  newGame();
  render();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
